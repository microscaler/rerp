components:
  schemas:
    AdAccount:
      type: object
      required:
      - id
      - platform
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - REDDIT
          - AMAZON_DSP
          - DSP_TRADE_DESK
          - DSP_DV360
          - DSP_STACKADAPT
          - DSP_ADFORM
          - DSP_ADMIXER
          - DSP_SMARTYADS
          - DSP_EPOM
          - BIDDER_BEESWAX
          - OPENRTB
          - LIVERAMP
        name:
          type: string
        external_account_id:
          type: string
          description: The platform's own account / ad-account / pixel id
        status:
          type: string
          enum:
          - AUTHORIZING
          - CONNECTED
          - TOKEN_EXPIRED
          - PAUSED
          - DISCONNECTED
          - ERROR
        authorize_url:
          type: string
          format: uri
          readOnly: true
          description: Present while AUTHORIZING
        capabilities:
          type: array
          items:
            type: string
            enum:
            - AUDIENCES
            - LOOKALIKES
            - CONVERSIONS
            - SPEND
            - CAMPAIGN_CONTROL
          readOnly: true
        conversion_endpoint:
          type: string
          enum:
          - META_CAPI
          - GOOGLE_OFFLINE
          - GOOGLE_ENHANCED
          - LINKEDIN_CAPI
          - TIKTOK_EVENTS
          - MICROSOFT_OFFLINE
          - NONE
          description: Which server-side conversion API the account relays to
        pixel_id:
          type: string
          description: Pixel / dataset / tag id used for conversion relay
        default_currency:
          type: string
        match_rate_last:
          type: number
          format: float
          readOnly: true
          description: Matched ÷ uploaded on the last audience sync, 0–1
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
        last_spend_import_at:
          type: string
          format: date-time
          readOnly: true
        last_error:
          type: string
          readOnly: true
        connected_by:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    AdAdapter:
      type: object
      required:
      - platform
      - kind
      properties:
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - REDDIT
          - AMAZON_DSP
          - DSP_TRADE_DESK
          - DSP_DV360
          - DSP_STACKADAPT
          - DSP_ADFORM
          - DSP_ADMIXER
          - DSP_SMARTYADS
          - DSP_EPOM
          - BIDDER_BEESWAX
          - OPENRTB
          - LIVERAMP
        kind:
          type: string
          enum:
          - WALLED_GARDEN_API
          - SELF_SERVE_DSP_API
          - BIDDER_AS_A_SERVICE
          - OPENRTB_BIDDER
          - ONBOARDER
          description: 'WALLED_GARDEN_API: the platform''s own marketing API (Meta, Google Ads, LinkedIn, X, TikTok, Microsoft,
            Reddit, Pinterest, Amazon). SELF_SERVE_DSP_API: a DSP with an advertiser API (Adform, StackAdapt, Admixer, SmartyAds,
            Epom white-label). BIDDER_AS_A_SERVICE: our own bidding logic hosted on a bidder (Beeswax). OPENRTB_BIDDER: our
            own bidder on exchanges. ONBOARDER: audiences only (LiveRamp).'
        capabilities:
          type: array
          items:
            type: string
            enum:
            - AUDIENCES
            - LOOKALIKES
            - CONVERSIONS
            - SPEND
            - CAMPAIGN_CREATE
            - CAMPAIGN_PAUSE
            - BUDGET
            - BID
            - SCHEDULE
            - FREQUENCY_CAP
            - PLACEMENTS
            - CREATIVE_UPLOAD
            - DEAL_IDS
            - GEO
            - DEVICE
            - DAYPARTING
            - CONTEXTUAL
            - RETARGETING_PIXEL
        objectives:
          type: array
          items:
            type: string
        formats:
          type: array
          items:
            type: string
            enum:
            - IMAGE
            - VIDEO
            - HTML5
            - NATIVE
            - TEXT
            - CAROUSEL
            - AUDIO
        identity:
          type: array
          items:
            type: string
          description: Identifiers the platform matches on (hashed email, phone, MAID, UID2, RampID, cookie)
        minimums:
          type: object
          properties:
            audience_matched:
              type: integer
              format: int64
            daily_budget:
              type: string
              format: decimal
              pattern: ^-?\d{1,15}(\.\d{1,4})?$
              description: Decimal string in the currency of the record.
            monthly_spend_practical:
              type: string
              format: decimal
              pattern: ^-?\d{1,15}(\.\d{1,4})?$
              description: Decimal string in the currency of the record.
            currency:
              type: string
        fee_model:
          type: string
          description: Take rate / subscription / none, as known
        status:
          type: string
          enum:
          - SHIPPED
          - PLANNED
          - NOT_PLANNED
        notes:
          type: string
    AdAttributionReport:
      type: object
      properties:
        model:
          type: string
        window_days:
          type: integer
          format: int32
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          type: object
          properties:
            spend:
              type: string
              format: decimal
              pattern: ^-?\d{1,15}(\.\d{1,4})?$
              description: Decimal string in the currency of the record.
            leads:
              type: integer
              format: int64
            deals:
              type: integer
              format: int64
            won:
              type: integer
              format: int64
            revenue:
              type: string
              format: decimal
              pattern: ^-?\d{1,15}(\.\d{1,4})?$
              description: Decimal string in the currency of the record.
            platform_reported_revenue:
              type: string
              format: decimal
              pattern: ^-?\d{1,15}(\.\d{1,4})?$
              description: Decimal string in the currency of the record.
            unattributed_revenue:
              type: string
              format: decimal
              pattern: ^-?\d{1,15}(\.\d{1,4})?$
              description: Decimal string in the currency of the record.
        rows:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              spend:
                type: string
                format: decimal
                pattern: ^-?\d{1,15}(\.\d{1,4})?$
                description: Decimal string in the currency of the record.
              leads:
                type: integer
                format: int64
              deals:
                type: integer
                format: int64
              won:
                type: integer
                format: int64
              revenue:
                type: string
                format: decimal
                pattern: ^-?\d{1,15}(\.\d{1,4})?$
                description: Decimal string in the currency of the record.
              platform_reported_revenue:
                type: string
                format: decimal
                pattern: ^-?\d{1,15}(\.\d{1,4})?$
                description: Decimal string in the currency of the record.
              roas:
                type: number
                format: float
              cac:
                type: string
                format: decimal
                pattern: ^-?\d{1,15}(\.\d{1,4})?$
                description: Decimal string in the currency of the record.
        warm_up_lift:
          type: object
          description: Email outcomes for contacts who were in a WARM_UP audience vs the holdout, when a holdout is configured
          properties:
            exposed:
              type: object
              additionalProperties:
                type: number
            holdout:
              type: object
              additionalProperties:
                type: number
            relative_lift:
              type: object
              additionalProperties:
                type: number
    AdAudience:
      type: object
      required:
      - id
      - name
      - account_id
      - platform
      - source
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
