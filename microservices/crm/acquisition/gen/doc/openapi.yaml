    AdTrackingSettings:
      type: object
      properties:
        cookie:
          type: object
          description: The first-party visitor cookie set on the tracking domain
          properties:
            name:
              type: string
              default: _pw_vid
            ttl_days:
              type: integer
              format: int32
              default: 400
              description: Chrome caps at 400 days; Safari caps script-set cookies at 7 days, server-set at the full TTL
            server_set:
              type: boolean
              default: true
              description: Set via `Set-Cookie` from `/ads/clicks` on the tracking domain (CNAME, same registrable domain
                as the site) so ITP keeps it
            same_site:
              type: string
              enum:
              - Lax
              - Strict
              - None
              default: Lax
            localstorage_mirror:
              type: boolean
              default: true
              description: Mirror the id into localStorage and restore the cookie when it is cleared
        click_id_params:
          type: array
          items:
            type: string
          default:
          - gclid
          - wbraid
          - gbraid
          - fbclid
          - ttclid
          - li_fat_id
          - msclkid
          - twclid
          - epik
          - pw_cid
          description: URL parameters the script captures on landing
        own_click_id_param:
          type: string
          default: pw_cid
          description: The workspace's own click id, stamped on every outbound link by the link-tag rules
        capture_utm:
          type: boolean
          default: true
        capture_referrer:
          type: boolean
          default: true
        fingerprint:
          type: object
          description: Soft identifiers used only to join sessions, never sent to a platform
          properties:
            enabled:
              type: boolean
              default: true
            signals:
              type: array
              items:
                type: string
                enum:
                - IP_PREFIX
                - USER_AGENT
                - SCREEN
                - TIMEZONE
                - LANGUAGE
            ip_truncation:
              type: string
              enum:
              - NONE
              - LAST_OCTET
              - LAST_TWO_OCTETS
              default: LAST_OCTET
        identify_on:
          type: array
          items:
            type: string
            enum:
            - FORM_SUBMIT
            - EMAIL_LINK
            - SMS_LINK
            - LOGIN
            - CHECKOUT
            - CALL
          description: 'Moments at which the anonymous visitor is joined to a contact (deterministic: email, phone, contact
            id in the link)'
        consent:
          type: object
          description: Consent-mode behaviour per region
          properties:
            mode:
              type: string
              enum:
              - ALWAYS
              - AFTER_CONSENT
              - REGION
              default: REGION
            strict_regions:
              type: array
              items:
                type: string
              description: ISO country codes where the cookie and click ids wait for consent (EU/EEA, UK, CH by default)
            cmp_signal:
              type: string
              enum:
              - TCF
              - GOOGLE_CONSENT_MODE
              - CUSTOM
              - NONE
              description: Which consent signal the script reads
            cookieless_pings:
              type: boolean
              description: Send consentless, id-free pings (page, source) for modelled attribution when consent is denied
        link_decoration:
          type: object
          properties:
            enabled:
              type: boolean
              default: true
            params:
              type: array
              items:
                type: string
              description: pw_cid plus utm_* on every tracked outbound link
            contact_token:
              type: boolean
              default: true
              description: Also carry a signed contact token so an email click identifies the visitor even without a cookie
        default_attribution_model:
          type: string
          default: LAST_TOUCH
        default_window_days:
          type: integer
          format: int32
          default: 30
        updated_at:
          type: string
          format: date-time
          readOnly: true
