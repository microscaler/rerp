        purpose:
          type: string
          enum:
          - WARM_UP
          - RETARGET
          - EXCLUDE
          - LOOKALIKE_SEED
          - OTHER
          description: 'WARM_UP is the pre-email sequence: add N days before a send, remove on click or after the window'
        warm_up:
          type: object
          properties:
            days_before_send:
              type: integer
              format: int32
            remove_on:
              type: string
              enum:
              - EMAIL_CLICKED
              - EMAIL_OPENED
              - SITE_VISIT
              - WINDOW_END
            window_days:
              type: integer
              format: int32
            frequency_cap_hint:
