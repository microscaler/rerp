openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Acquisition
  version: v1.0.0
  description: 'Where contacts come from and what they are worth: forms, tracked sites and events, UTM, conversions and business
    goals, surveys and events, ad accounts and adapters, ad audiences, creatives and buys, ad tracking settings and link decoration,
    the conversion relay and attribution.'
  x-api-docs:
    service: acquisition
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/acquisition
  description: Local development (port from port-registry)
- url: /api/v1/crm/acquisition
  description: CRM Acquisition API
tags:
- name: ad-attribution
  description: 'Ad attribution: journeys, models, spend vs attributed revenue, LTV cohorts'
- name: ad-audiences
  description: 'Ad audiences: connected ad accounts and segments / lists / tags kept in step with platform custom audiences
    (hashed server-side), warm-up sequences, lookalikes'
- name: ad-buying
  description: 'Ad buying: one platform-agnostic buy spec pushed through adapters (walled-garden APIs, self-serve DSP APIs,
    bidder-as-a-service, own OpenRTB bidder), creatives, delivery, recommendations applied'
- name: ad-tracking
  description: 'Ad tracking: first-party click capture, link decoration, server-side conversion relay (Meta CAPI, Google offline
    / enhanced, LinkedIn, TikTok), call touchpoints'
- name: campaigns
  description: Campaign reporting and attribution
- name: conversions
  description: Conversions
- name: events
  description: Event registration tracking
- name: goals
  description: Goals
- name: marketing-analytics
  description: Visitor tracking and analytics
- name: marketing-campaigns
  description: Campaign lead and revenue attribution
- name: marketing-forms
  description: Marketing form management
- name: utm
  description: Campaign, medium, and source tracking
- name: visitors
  description: Anonymous visitor tracking
paths:
  /ads/accounts:
    get:
      operationId: list_ad_accounts
      summary: Connected ad platforms
      tags:
      - ad-audiences
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdAccount'
                required:
                - items
              example:
                items:
                - id: e67555dd-33f4-5fee-9da3-a019895219b1
                  platform: META
                  name: Northwind Traders
                  status: AUTHORIZING
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Connected ad platforms.
    post:
      operationId: connect_ad_account
      summary: Connect an ad platform account (OAuth or API key)
      tags:
      - ad-audiences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAdAccountRequest'
            example:
              platform: META
              name: Northwind Traders
              external_account_id: ext_920852399f
              auth:
                kind: OAUTH
                secret_id: ext_b004302408
              conversion_endpoint: Conversion endpoint
              pixel_id: ext_7dc4878503
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Account; OAuth flows return `authorize_url` and status AUTHORIZING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
              example:
                id: ded95315-6c77-51a0-b8ea-66b76fada21a
                platform: META
                name: Acme · Meta EU
                external_account_id: act_1092884411
                status: CONNECTED
                capabilities:
                - AUDIENCES
                - CONVERSIONS
                - SPEND
                conversion_endpoint: META_CAPI
                default_currency: EUR
                match_rate_last: 0.61
                last_sync_at: '2026-11-05T15:48:00Z'
                last_spend_import_at: '2026-11-05T10:00:00Z'
                last_error: Last error
                connected_by: alex
                created_at: '2026-07-08T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      description: Connect an ad platform account (OAuth or API key). Audited.
  /ads/accounts/{id}:
    get:
      operationId: get_ad_account
      summary: One ad account with its capabilities and last sync
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
              example:
                id: ded95315-6c77-51a0-b8ea-66b76fada21a
                platform: META
                name: Acme · Meta EU
                external_account_id: act_1092884411
                status: CONNECTED
                capabilities:
                - AUDIENCES
                - CONVERSIONS
                - SPEND
                conversion_endpoint: META_CAPI
                default_currency: EUR
                match_rate_last: 0.61
                last_sync_at: '2026-11-05T15:48:00Z'
                last_spend_import_at: '2026-11-05T10:00:00Z'
                last_error: Last error
                connected_by: alex
                created_at: '2026-07-08T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: One ad account with its capabilities and last sync. 404 when the record does not exist in this workspace.
    patch:
      operationId: update_ad_account
      summary: Rename, change the default conversion event names, pause
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdAccountRequest'
            example:
              name: Northwind Traders
              status: CONNECTED
              conversion_endpoint: Conversion endpoint
              pixel_id: ext_7dc4878503
              default_currency: Default currency
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
              example:
                id: ded95315-6c77-51a0-b8ea-66b76fada21a
                platform: META
                name: Acme · Meta EU
                external_account_id: act_1092884411
                status: CONNECTED
                capabilities:
                - AUDIENCES
                - CONVERSIONS
                - SPEND
                conversion_endpoint: META_CAPI
                default_currency: EUR
                match_rate_last: 0.61
                last_sync_at: '2026-11-05T15:48:00Z'
                last_spend_import_at: '2026-11-05T10:00:00Z'
                last_error: Last error
                connected_by: alex
                created_at: '2026-07-08T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      description: Rename, change the default conversion event names, pause. Changes only the fields sent; the change is audited
        with before and after values. 404 when the record does not exist in this workspace.
    delete:
      operationId: disconnect_ad_account
      summary: Disconnect; audiences on it stop syncing (platform-side audiences are left in place)
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      description: Disconnect; audiences on it stop syncing (platform-side audiences are left in place). Audited. 404 when
        the record does not exist in this workspace.
  /ads/accounts/{id}/import-spend:
    post:
      operationId: import_ad_spend
      summary: Pull spend, impressions and clicks per campaign / ad set / ad for a date range
      tags:
      - ad-tracking
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
            example:
              from: '2026-11-25'
              to: '2026-11-25'
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSpendImport'
              example:
                id: ded95315-6c77-51a0-b8ea-66b76fada21a
                status: QUEUED
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      description: Pull spend, impressions and clicks per campaign / ad set / ad for a date range. A state change on one resource;
        audited. 404 when the record does not exist in this workspace.
  /ads/accounts/{id}/reconnect:
    post:
      operationId: reconnect_ad_account
      summary: Re-run the OAuth flow after a token expiry
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account with `authorize_url`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
              example:
                id: ded95315-6c77-51a0-b8ea-66b76fada21a
                platform: META
                name: Acme · Meta EU
                external_account_id: act_1092884411
                status: CONNECTED
                capabilities:
                - AUDIENCES
                - CONVERSIONS
                - SPEND
                conversion_endpoint: META_CAPI
                default_currency: EUR
                match_rate_last: 0.61
                last_sync_at: '2026-11-05T15:48:00Z'
                last_spend_import_at: '2026-11-05T10:00:00Z'
                last_error: Last error
                connected_by: alex
                created_at: '2026-07-08T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      description: Re-run the OAuth flow after a token expiry. A state change on one resource; audited. 404 when the record
        does not exist in this workspace.
  /ads/adapters:
    get:
      operationId: list_ad_adapters
      summary: The buying adapters this deployment ships, with the capability matrix per platform (audiences, conversions,
        spend, campaign create / pause / budget / bid, creative upload, placements, frequency caps, deal ids)
      tags:
      - ad-buying
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Adapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdAdapter'
                required:
                - items
              example:
                items:
                - platform: META
                  kind: WALLED_GARDEN_API
                  capabilities:
                  - AUDIENCES
                  - LOOKALIKES
                  - CONVERSIONS
                  identity:
                  - hashed email
                  - phone
                  - MAID
                  minimums:
                    audience_matched: 100
                  status: SHIPPED
                  notes: Audience ≥ ~100 matched
                - platform: GOOGLE_ADS
                  kind: WALLED_GARDEN_API
                  capabilities:
                  - AUDIENCES
                  - CONVERSIONS
                  - SPEND
                  identity:
                  - hashed email (Customer Match)
                  - gclid
                  minimums:
                    audience_matched: 1000
                  status: SHIPPED
                  notes: Customer Match ≥ 1,000 · developer token
                - platform: LINKEDIN
                  kind: WALLED_GARDEN_API
                  capabilities:
                  - AUDIENCES
                  - CONVERSIONS
                  - SPEND
                  identity:
                  - hashed work email
                  - company lists
                  minimums: {}
                  status: SHIPPED
                  notes: No minimum · best B2B match
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: The buying adapters this deployment ships, with the capability matrix per platform (audiences, conversions,
        spend, campaign create / pause / budget / bid, creative upload, placements, frequency caps, deal ids).
  /ads/attribution:
    get:
      operationId: get_ad_attribution
      summary: Revenue, deals and leads by channel / campaign / ad under a model and window, with the ad-platform-reported
        figures beside them
      tags:
      - ad-attribution
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: model
        in: query
        schema:
          type: string
      - name: window_days
        in: query
        schema:
          type: integer
      - name: by
        in: query
        schema:
          type: string
          enum:
          - CHANNEL
          - ACCOUNT
          - CAMPAIGN
          - AD_SET
          - AD
          - SOURCE_MEDIUM
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAttributionReport'
              example:
                model: last_touch
                window_days: 30
                from: '2026-10-06'
                to: '2026-11-05'
                totals:
                  spend: '4120.00'
                  leads: 95
                  deals: 29
                  won: 36
                  revenue: '21400.00'
                  platform_reported_revenue: '38900.00'
                  unattributed_revenue: '14200.00'
                rows:
                - key: 262ac3c8-b3f1-5aff-a843-87613a514a9e
                  label: BF early access · warm-up
                  spend: '1460.00'
                  leads: 9
                  deals: 3
                  won: 1
                  revenue: '2400.00'
                  platform_reported_revenue: '9800.00'
                  roas: 1.6
                  cac: '1460.00'
                - key: f3cd6604-1b26-578c-b830-9a23140db612
                  label: Retarget · pricing visitors
                  spend: '620.00'
                  leads: 21
                  deals: 8
                  won: 5
                  revenue: '3900.00'
                  platform_reported_revenue: '12100.00'
                  roas: 6.3
                  cac: '124.00'
                - key: 88429ed5-a8b0-5109-affc-e41b18874962
                  label: Webinar invite · warm-up
                  spend: '600.00'
                  leads: 14
                  deals: 5
                  won: 2
                  revenue: '1400.00'
                  platform_reported_revenue: '4200.00'
                  roas: 2.3
                  cac: '300.00'
                warm_up_lift:
                  exposed:
                    contacts: 1804
                    open_rate: 0.412
                    click_rate: 0.079
                    reply_rate: 0.014
                    unsub_rate: 0.003
                  holdout:
                    contacts: 318
                    open_rate: 0.36
                    click_rate: 0.061
                    reply_rate: 0.011
                    unsub_rate: 0.003
                  relative_lift:
                    open_rate: 0.14
                    click_rate: 0.3
                    reply_rate: 0.27
                    unsub_rate: 0
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: 'Revenue, deals and leads by channel / campaign / ad under a model and window, with the ad-platform-reported
        figures beside them. Query: `model`, `window_days`, `by`, `from`, `to`.'
  /ads/attribution/models:
    get:
      operationId: list_attribution_models
      summary: Built-in and custom attribution models
      tags:
      - ad-attribution
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttributionModel'
                required:
                - items
              example:
                items:
                - name: Northwind Traders
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Built-in and custom attribution models.
    post:
      operationId: create_attribution_model
      summary: Add a custom model (weights per position, window, which touchpoint kinds count)
      tags:
      - ad-attribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionModel'
            example:
              id: Id
              name: Northwind Traders
              kind: FIRST_TOUCH
              weights:
                first: 12.5
                assists: 12.5
                last: 12.5
              half_life_days: 12.5
              window_days: 3
              count_kinds:
              - AD_CLICK
              is_default: true
              builtin: false
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionModel'
              example:
                id: last_touch
                name: Last touch
                kind: LAST_TOUCH
                weights:
                  first: 0
                  assists: 0
                  last: 1
                window_days: 30
                count_kinds:
                - AD_CLICK
                - EMAIL_CLICKED
                - SITE_VISIT
                is_default: true
                builtin: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      description: Add a custom model (weights per position, window, which touchpoint kinds count). Audited.
  /ads/attribution/models/{id}:
    patch:
      operationId: update_attribution_model
      summary: Change a custom model or make it the default
      tags:
      - ad-attribution
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionModelInput'
            example:
              name: Northwind Traders
              kind: FIRST_TOUCH
              weights:
                first: 12.5
                assists: 12.5
                last: 12.5
              half_life_days: 12.5
              window_days: 3
              count_kinds:
              - AD_CLICK
              is_default: true
              builtin: false
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionModel'
              example:
                id: last_touch
                name: Last touch
                kind: LAST_TOUCH
                weights:
                  first: 0
                  assists: 0
                  last: 1
                window_days: 30
                count_kinds:
                - AD_CLICK
                - EMAIL_CLICKED
                - SITE_VISIT
                is_default: true
                builtin: true
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      description: Change a custom model or make it the default. Changes only the fields sent; the change is audited with
        before and after values. 404 when the record does not exist in this workspace.
    delete:
      operationId: delete_attribution_model
      summary: Remove a custom model
      tags:
      - ad-attribution
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      description: Remove a custom model. Audited. 404 when the record does not exist in this workspace.
  /ads/audiences:
    get:
      operationId: list_ad_audiences
      summary: Audience bindings (a segment, list or tag kept in step with a platform custom audience)
      tags:
      - ad-audiences
      parameters:
