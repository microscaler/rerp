openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Automation
  version: v1.0.0
  description: 'What happens next: workflows and their versioned step graphs, the trigger and action catalogue, recipes, enrolments
    with step history and durable timers.'
  x-api-docs:
    service: automation
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/automation
  description: Local development (port from port-registry)
- url: /api/v1/crm/automation
  description: CRM Automation API
tags:
- name: actions
  description: Scheduled and manual actions
- name: automation-execution
  description: Workflow execution and run history
- name: enrolments
  description: Contacts moving through workflows
- name: rules
  description: Condition-action rules within workflows
- name: triggers
  description: Event hooks that fire workflows
- name: workflow-steps
  description: The step graph of a workflow (wait, if/else, split, goal)
- name: workflows
  description: Workflow definitions and management
paths:
  /actions/recurring:
    post:
      operationId: schedule_recurring_action
      summary: Schedule a recurring action
      tags:
      - actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringActionRequest'
            example:
              workflow_id: 7008f5a1-8ead-5a4f-8cd3-a3deab21a548
              schedule: Schedule
              action_config: {}
        description: Schedule a recurring action with a defined interval
      responses:
        '201':
          description: Recurring action scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledAction'
              example:
                id: c9e18116-9fea-5e6e-ac32-52580d2450b8
                workflow_id: 7008f5a1-8ead-5a4f-8cd3-a3deab21a548
                scheduled_at: '2026-11-05T16:00:00Z'
                status: PENDING
                action_config: {}
                executed_at: '2026-11-05T16:00:00Z'
                created_at: '2026-11-05T16:00:00Z'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new actions
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /actions/schedule:
    post:
      operationId: schedule_action
      summary: Schedule a one-time action
      tags:
      - actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleActionRequest'
            example:
              workflow_id: 7008f5a1-8ead-5a4f-8cd3-a3deab21a548
              scheduled_at: '2026-11-05T16:00:00Z'
              action_config: {}
        description: Schedule a one-time action at a specific time
      responses:
        '201':
          description: Action scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledAction'
              example:
                id: c9e18116-9fea-5e6e-ac32-52580d2450b8
                workflow_id: 7008f5a1-8ead-5a4f-8cd3-a3deab21a548
                scheduled_at: '2026-11-05T16:00:00Z'
                status: PENDING
                action_config: {}
                executed_at: '2026-11-05T16:00:00Z'
                created_at: '2026-11-05T16:00:00Z'
        '500':
          $ref: '#/components/responses/InternalError'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Schedule a report to run on a recurring basis
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
  /actions/upcoming:
    get:
      operationId: list_upcoming_actions
      summary: List upcoming scheduled actions
      tags:
      - actions
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Upcoming actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledActionPage'
              example:
                items:
                - id: c9e18116-9fea-5e6e-ac32-52580d2450b8
                  scheduled_at: '2026-11-05T16:00:00Z'
                  status: PENDING
                total: 2
                page: 1
                limit: 25
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: List all actions
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /catalog:
    get:
      operationId: get_automation_catalog
      summary: Triggers and actions
      tags:
      - workflows
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationCatalog'
              example:
                triggers:
                - type: TIME_BASED
                  label: On a schedule
                  group: Behaviors
                - type: SUBSCRIBED_TO_LIST
                  label: Subscribes to a list
                  group: Email & messages
                - type: UNSUBSCRIBED_FROM_LIST
                  label: Unsubscribes from a list
                  group: Email & messages
                actions:
                - type: SEND_MESSAGE
                  label: Send email
                  group: Sending
                  kind: ACTION
                - type: SEND_SMS
                  label: Send SMS
                  group: Sending
                  kind: ACTION
                - type: SEND_1TO1_EMAIL
                  label: Send 1:1 email
                  group: Sending
                  kind: ACTION
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Triggers and actions.
  /contacts/{id}/enrolments:
    get:
      operationId: list_contact_enrolments
      summary: Every workflow a contact is or was in
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Enrolments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enrolment'
                required:
                - items
              example:
                items:
                - id: 7579e087-fd2f-568e-8835-12a76256ad3e
                  workflow_id: 22e49987-c27c-538a-9688-56d9ca17a7ec
                  workflow_name: Welcome series (7 days)
                  contact_id: af512c4f-0beb-50b6-bf61-7a9d8bd417b5
                  contact_email: priya.natarajan@northwindtraders.example
                  status: WAITING
                  current_step_id: 6987f07d-c099-529a-bb28-e900ce5e5d00
                  next_run_at: '2026-11-06T16:00:00Z'
                  entered_by: alex
                  history:
                  - step_id: f1189b89-3e27-5826-bc93-e33f7450d394
                    kind: ACTION
                    label: Send email
                    at: '2026-11-03T16:00:00Z'
                    outcome: DONE
                  entered_at: '2026-11-03T16:00:00Z'
                  ended_at: '2026-11-05T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Every workflow a contact is or was in. 404 when the record does not exist in this workspace.
  /deals/{id}/enrolments:
    get:
      operationId: list_deal_enrolments
      summary: Automations a deal is in
      tags:
      - enrolments
      responses:
        '200':
          description: Page of enrolments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentPage'
              example:
                items:
                - id: 47ac623d-96a0-57aa-b8c2-0b8a230023a6
                  workflow_id: f1f1bd07-238b-520a-b007-7846dac00c19
                  workflow_name: Hot lead handoff
                  contact_id: af512c4f-0beb-50b6-bf61-7a9d8bd417b5
                  status: COMPLETED
                  entered_at: '2026-11-01T16:00:00Z'
                - id: 3b209ba1-4c06-5235-a6e7-0c74f4d40366
                  workflow_id: b36c0bc7-7dae-56b4-af7f-9c1ef4673496
                  workflow_name: Stalled deal nudge
                  contact_id: af512c4f-0beb-50b6-bf61-7a9d8bd417b5
                  status: WAITING
                  entered_at: '2026-11-02T16:00:00Z'
                total: 2
                page: 1
                limit: 25
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Id'
      x-brrtrouter-impl: true
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Automations a deal is in. Paged (`page`, `limit` ≤ 100). 404 when the record does not exist in this workspace.
  /enrolments/{id}:
    get:
      operationId: get_enrolment
      summary: One contact's progress through a workflow
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Enrolment with its step history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
              example:
                id: 7579e087-fd2f-568e-8835-12a76256ad3e
                workflow_id: 22e49987-c27c-538a-9688-56d9ca17a7ec
                workflow_name: Welcome series (7 days)
                contact_id: af512c4f-0beb-50b6-bf61-7a9d8bd417b5
                contact_email: priya.natarajan@northwindtraders.example
                status: WAITING
                current_step_id: 6987f07d-c099-529a-bb28-e900ce5e5d00
                next_run_at: '2026-11-06T16:00:00Z'
                entered_by: alex
                history:
                - step_id: f1189b89-3e27-5826-bc93-e33f7450d394
                  kind: ACTION
                  label: Send email
                  at: '2026-11-03T16:00:00Z'
                  outcome: DONE
                entered_at: '2026-11-03T16:00:00Z'
                ended_at: '2026-11-05T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: One contact's progress through a workflow. 404 when the record does not exist in this workspace.
  /enrolments/{id}/jump:
    post:
      operationId: jump_enrolment
      summary: Move a contact to a given step now
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - step_id
              properties:
                step_id:
                  type: string
                  format: uuid
            example:
              step_id: cd9627a9-c1de-5aef-9be3-a38c1d7460bd
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
              example:
                id: 7579e087-fd2f-568e-8835-12a76256ad3e
                workflow_id: 22e49987-c27c-538a-9688-56d9ca17a7ec
                workflow_name: Welcome series (7 days)
                contact_id: af512c4f-0beb-50b6-bf61-7a9d8bd417b5
                contact_email: priya.natarajan@northwindtraders.example
                status: WAITING
                current_step_id: 6987f07d-c099-529a-bb28-e900ce5e5d00
                next_run_at: '2026-11-06T16:00:00Z'
                entered_by: alex
                history:
                - step_id: f1189b89-3e27-5826-bc93-e33f7450d394
                  kind: ACTION
                  label: Send email
                  at: '2026-11-03T16:00:00Z'
                  outcome: DONE
                entered_at: '2026-11-03T16:00:00Z'
                ended_at: '2026-11-05T16:00:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      description: Move a contact to a given step now. A state change on one resource; audited. 404 when the record does not
        exist in this workspace.
  /enrolments/{id}/retry:
    post:
      operationId: retry_enrolment
      summary: Retry a failed enrolment from its failing step
      tags:
      - enrolments
      responses:
        '202':
          description: Retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
              example:
                id: c9e18116-9fea-5e6e-ac32-52580d2450b8
                workflow_id: 7008f5a1-8ead-5a4f-8cd3-a3deab21a548
                workflow_name: Workflow name
                contact_id: 7970f5e9-e936-5cd5-b2cf-883a6f1433fc
                contact_email: Contact email
                status: ACTIVE
                current_step_id: e73c31c1-5129-50f1-ad4a-d05281d2a22a
                next_run_at: '2026-11-05T16:00:00Z'
                entered_by: Entered by
                trigger_id: 848ded80-ea6f-57b1-a733-796a8102a816
                trigger_type: STAGE_CHANGE
                trigger_subject: Trigger subject
                exit_reason: UNSUBSCRIBED
                split_paths: {}
                goal_step_id: e9a62b94-9bdb-56da-9a42-0eacb6e57d28
                history:
                - step_id: cd9627a9-c1de-5aef-9be3-a38c1d7460bd
                  kind: ACTION
                  at: '2026-11-05T16:00:00Z'
                  outcome: DONE
                entered_at: '2026-11-05T16:00:00Z'
                ended_at: '2026-11-05T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: 409 unless the enrolment is FAILED. Earlier steps are not repeated.
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
  /enrolments/{id}/stop:
    post:
      operationId: stop_enrolment
      summary: Remove a contact from the workflow
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
              example:
                id: 7579e087-fd2f-568e-8835-12a76256ad3e
                workflow_id: 22e49987-c27c-538a-9688-56d9ca17a7ec
                workflow_name: Welcome series (7 days)
                contact_id: af512c4f-0beb-50b6-bf61-7a9d8bd417b5
                contact_email: priya.natarajan@northwindtraders.example
                status: WAITING
                current_step_id: 6987f07d-c099-529a-bb28-e900ce5e5d00
                next_run_at: '2026-11-06T16:00:00Z'
                entered_by: alex
                history:
                - step_id: f1189b89-3e27-5826-bc93-e33f7450d394
                  kind: ACTION
                  label: Send email
                  at: '2026-11-03T16:00:00Z'
                  outcome: DONE
                entered_at: '2026-11-03T16:00:00Z'
                ended_at: '2026-11-05T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      description: 'Remove a contact from the workflow. A state change on one resource; audited. 404 when the record does
        not exist in this workspace.


        Publishes `enrolment.stopped` on `crm.automation.v1`.'
      x-events:
      - enrolment.stopped
  /recipes:
    get:
      operationId: list_workflow_recipes
      summary: Starter workflows (welcome series, abandoned signup, re-engagement, post-purchase)
      tags:
      - workflows
      responses:
        '200':
          description: Recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowRecipe'
                required:
                - items
              example:
                items:
                - id: c9e18116-9fea-5e6e-ac32-52580d2450b8
                  name: Northwind Traders
                  category: WELCOME
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Starter workflows (welcome series, abandoned signup, re-engagement, post-purchase).
  /recipes/import:
    post:
      operationId: import_workflow_recipe
      summary: Add a recipe to the workspace's library from a URL or an uploaded definition
      tags:
      - workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                definition:
                  type: object
            example:
              url: https://northwindtraders.example/pricing
              definition: {}
      responses:
        '201':
          description: Recipe added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRecipe'
              example:
                id: c9e18116-9fea-5e6e-ac32-52580d2450b8
                name: Northwind Traders
                description: Example
                category: WELCOME
                trigger_types:
                - STAGE_CHANGE
                trigger_type: STAGE_CHANGE
                parameters:
                - key: snippet.signature
                  kind: LIST
                  label: Primary
                source_url: https://northwindtraders.example/pricing
                industry: Industry
                definition: {}
                step_count: 3
                needs_templates: 3
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
      description: Add a recipe to the workspace's library from a URL or an uploaded definition. Audited.
  /recipes/{id}/instantiate:
    post:
      operationId: instantiate_workflow_recipe
      summary: Create an inactive workflow from a recipe
      tags:
      - workflows
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                bindings:
                  type: object
                  additionalProperties:
                    type: string
                  description: Parameter key -> value; any parameter left out stays unbound (see /workflows/{id}/setup)
                list_id:
                  type: string
                  format: uuid
                  deprecated: true
                  description: Shorthand for bindings.list
            example:
              name: Northwind Traders
              bindings:
                key: Value
              list_id: 1f3cd179-64de-54d4-a396-6cda091ad1ed
      responses:
        '201':
          description: Workflow created from the recipe
          content:
