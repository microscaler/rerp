        pipeline_id:
          type: string
          format: uuid
        currency:
          type: string
        basis:
          $ref: '#/components/schemas/ForecastBasis'
        granularity:
          type: string
          enum:
          - WEEK
          - MONTH
          - QUARTER
        periods:
          type: array
          items:
            $ref: '#/components/schemas/ForecastPeriod'
        accuracy:
          type: array
          items:
