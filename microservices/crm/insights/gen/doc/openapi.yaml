        top_lists:
          type: array
          items:
            $ref: '#/components/schemas/ContactGroupRow'
        top_tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactGroupRow'
      required:
      - current
      - previous
      - trend
      - top_lists
      - top_tags
      description: Total / active / inactive contacts vs the previous period, trend lines (`trend` keys total, active, inactive)
        and the top-5 lists and tags.
    ConversionRate:
      type: object
      properties:
        period:
          type: string
        leads_created:
          type: integer
          format: int32
        opportunities_created:
          type: integer
          format: int32
        opportunities_won:
          type: integer
          format: int32
        opportunities_lost:
          type: integer
          format: int32
        lead_to_opp_rate:
          type: number
          format: float
        opp_to_won_rate:
          type: number
          format: float
        overall_conversion_rate:
          type: number
          format: float
        total_won_revenue:
          type: string
          format: decimal
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          description: Decimal string in the currency of the record.
      required:
      - period
      - leads_created
      - opportunities_created
      - opportunities_won
      - opportunities_lost
      - lead_to_opp_rate
      - opp_to_won_rate
      - overall_conversion_rate
      - total_won_revenue
      description: Conversion rate analytics with breakdown by source
    Dashboard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          maxLength: 64
          description: Sesame user id (the sub claim of the access token)
        name:
          type: string
        is_default:
          type: boolean
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
