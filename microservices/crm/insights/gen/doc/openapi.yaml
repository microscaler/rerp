components:
  schemas:
    AutomationAnalytics:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              workflow_id:
                type: string
                format: uuid
              name:
                type: string
              entered_30d:
                type: integer
                format: int64
              completed_30d:
                type: integer
                format: int64
              goal_rate:
                type: number
                format: double
                minimum: 0
                maximum: 1
              messages_30d:
                type: integer
                format: int64
              open_rate:
                type: number
                format: double
                minimum: 0
                maximum: 1
              deals_created:
                type: integer
                format: int64
              revenue:
                type: string
                format: decimal
                pattern: ^-?\d{1,15}(\.\d{1,4})?$
                description: Decimal string in the currency of the record.
      required:
      - items
    AutomationContactRow:
      type: object
      properties:
        contact_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - EXITED
          - PAUSED
        entered_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        current_step_id:
          type: string
          format: uuid
        current_step:
          type:
          - string
          - 'null'
          readOnly: true
      required:
      - contact_id
      - status
      - entered_at
    AutomationContactsReport:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        contacts_entered:
          type: integer
        completion_rate:
          type: number
          format: float
          description: 0-100
        completion_rate_change_30d:
          type: number
          format: float
          description: 0-100
        avg_seconds_to_complete:
          type: integer
        top_tags:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        top_lists:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        completion_times:
          type: array
          items:
            $ref: '#/components/schemas/CompletionBucket'
        contacts:
          $ref: '#/components/schemas/AutomationContactRowPage'
      required:
      - workflow_id
      - contacts_entered
      - completion_rate
      description: 'Per-automation contacts: completion KPIs, which tags/lists complete best, completion-time histogram, and
        the contact list (filter by status, search).'
    AutomationGoalRow:
      type: object
      properties:
        step_id:
          type: string
          format: uuid
        name:
          type: string
        contacts_achieved:
          type: integer
        contacts_skipped:
          type: integer
          description: Passed the goal without meeting it (if_not_met = CONTINUE)
        contacts_waiting:
          type: integer
        achieved_rate:
          type: number
          format: float
          description: 0-100
        avg_seconds_to_achieve:
          type: integer
        condition:
          type: string
          readOnly: true
      required:
      - step_id
      - name
      - contacts_achieved
      - achieved_rate
    AutomationGoalsReport:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        goals:
          type: array
          items:
            $ref: '#/components/schemas/AutomationGoalRow'
      required:
      - workflow_id
      - goals
    AutomationListRow:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        name:
          type: string
        folder_id:
          type: string
          format: uuid
        status:
          type: string
        contacts_entered:
          type: integer
        contacts_active:
          type: integer
        contacts_completed:
          type: integer
        message_count:
          type: integer
          description: SEND_MESSAGE steps in the graph
      required:
      - workflow_id
      - name
      - contacts_entered
    AutomationMessageRow:
      type: object
      properties:
        step_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        name:
          type: string
        last_sent_at:
          type: string
          format: date-time
        sends:
          type: integer
        unique_opens:
          type: integer
        unique_clicks:
          type: integer
        open_rate:
          type: number
          format: float
          description: 0-100
        click_rate:
          type: number
          format: float
          description: 0-100
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          description: Decimal string in the currency of the record.
      required:
      - step_id
      - name
      - sends
    AutomationOverviewReport:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        name:
          type: string
        contacts_total:
          type: integer
        contacts_finished:
          type: integer
        completion_rate:
          type: number
          format: float
          description: 0-100
        emails_sent:
          type: integer
        email_sent_rate:
          type: number
          format: float
          description: 0-100
        unique_opens:
          type: integer
        open_rate:
          type: number
          format: float
          description: 0-100
        unique_clicks:
          type: integer
        click_rate:
          type: number
          format: float
          description: 0-100
        revenue:
          type: string
          format: decimal
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          description: Decimal string in the currency of the record.
        series:
          type: array
          items:
            $ref: '#/components/schemas/NamedSeries'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AutomationMessageRow'
        contacts_active:
          type: integer
          format: int64
          readOnly: true
      required:
      - workflow_id
      - name
      - contacts_total
      - contacts_finished
      - completion_rate
      - emails_sent
      - messages
      description: 'Per-automation overview: tiles, sends/opens/clicks over time (`series` keys sends, opens, clicks), and
        one row per message step.'
    CompletionBucket:
      type: object
      properties:
        label:
          type: string
          examples:
          - < 1 day
          - 1-3 days
        min_seconds:
          type: integer
        max_seconds:
          type: integer
        count:
          type: integer
      required:
      - label
      - count
    ContactCounts:
      type: object
      properties:
        total:
          type: integer
