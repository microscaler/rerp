openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Insights
  version: v1.0.0
  description: 'What it adds up to: report read models (deals, contacts, email, automations, revenue, analytics), dashboards
    and prompt-built widgets, and rule-based named scores with their explanations.'
  x-api-docs:
    service: insights
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/insights
  description: Local development (port from port-registry)
- url: /api/v1/crm/insights
  description: CRM Insights API
tags:
- name: analytics
  description: Analytics
- name: automation-reports
  description: 'Automation reports: all automations, per-automation overview / goals / contacts, jump-to tracking, automated
    1:1 emails'
- name: contact-reports
  description: 'Contact reports: performance (active / inactive, trends, top lists and tags), field breakdown, nearby contacts,
    tag trends'
- name: conversion
  description: Lead-to-revenue conversion analytics
- name: dashboards
  description: Per-user dashboards of widgets (a saved metric query each), with per-widget scheduled email
- name: deal-reports
  description: 'Deal reports: overview, owner overview, funnel, sales performance, forecast (crm/pipeline deals)'
- name: email-reports
  description: 'Email engagement reports across campaigns and automations: client trends, open/read trends by weekday and
    hour, predictive-content variants'
- name: forecast
  description: Revenue forecasting
- name: performance
  description: Rep and team performance metrics
- name: pipeline
  description: Pipeline health and revenue summary
- name: reports
  description: Custom report builder and scheduling
- name: revenue-reports
  description: Marketing revenue attributed to campaigns and automation emails from conversions (crm/marketing) within an
    attribution window
- name: scores
  description: Scores
- name: task-reports
  description: 'Task overview: load, completion and outcome sentiment per rep (crm/tasks)'
- name: win-loss
  description: Win rate and loss analysis
paths:
  /analytics/automations:
    get:
      operationId: get_automation_analytics
      summary: Automations over the period
      tags:
      - analytics
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationAnalytics'
              example:
                items:
                - workflow_id: 22e49987-c27c-538a-9688-56d9ca17a7ec
                  name: Welcome series (7 days)
                  entered_30d: 1640
                  completed_30d: 1402
                  goal_rate: 0.23
                  messages_30d: 6120
                  open_rate: 0.52
                  deals_created: 0
                  revenue: '0.00'
                - workflow_id: 1114e157-f1ec-5dda-9063-79abf0255ee3
                  name: Abandoned signup
                  entered_30d: 902
                  completed_30d: 611
                  goal_rate: 0.11
                  messages_30d: 2406
                  open_rate: 0.34
                  deals_created: 0
                  revenue: '0.00'
                - workflow_id: b36c0bc7-7dae-56b4-af7f-9c1ef4673496
                  name: Re-engage · 90 days quiet
                  entered_30d: 2077
                  completed_30d: 1800
                  goal_rate: 0.06
                  messages_30d: 2077
                  open_rate: 0.21
                  deals_created: 0
                  revenue: '0.00'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      x-brrtrouter-impl: true
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: 'Automations over the period. Query: `from`, `to`.'
  /analytics/conversion-rates:
    get:
      operationId: get_conversion_rates
      summary: Get conversion rates by period
      tags:
      - conversion
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - WEEK
          - MONTH
          - QUARTER
          - YEAR
          default: MONTH
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Conversion rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionRatePage'
              example:
                items:
                - period: Period
                  leads_created: 3
                  opportunities_created: 3
                  opportunities_won: 3
                  opportunities_lost: 3
                  lead_to_opp_rate: 12.5
                  opp_to_won_rate: 12.5
                  overall_conversion_rate: 12.5
                  total_won_revenue: '1250.00'
                total: 2
                page: 1
                limit: 25
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Get conversion rate analytics
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
