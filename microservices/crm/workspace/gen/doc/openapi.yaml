        integration_id:
          type: string
          format: uuid
        options:
          $ref: '#/components/schemas/JobOptions'
        total_rows:
          type: integer
        processed_rows:
          type: integer
        created_rows:
          type: integer
        updated_rows:
          type: integer
        skipped_rows:
          type: integer
        error_rows:
          type: integer
        progress_pct:
