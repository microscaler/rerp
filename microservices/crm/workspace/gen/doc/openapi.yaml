      type: string
      enum:
      - PENDING
      - SUCCESS
      - FAILED
      - RETRYING
      description: Enum of webhook delivery statuses (pending, sent, failed, retrying)
    Workspace:
      type: object
      properties:
        id:
          type: string
          format: uuid
        organisation_id:
          type: string
          format: uuid
          description: The Sesame organisation (tenant)
        name:
          type: string
        slug:
          type: string
          pattern: ^[a-z0-9-]+$
        brand_domain:
          type: string
        default_currency:
          type: string
          pattern: ^[A-Z]{3}$
        timezone:
          type: string
        my_role:
          type: string
          enum:
          - owner
          - admin
          - marketer
          - sales
          - read-only
        created_at:
          type: string
          format: date-time
      required:
      - id
      - organisation_id
      - name
      description: One brand. Every CRM record belongs to exactly one workspace (ADR 004).
    WorkspacePage:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
