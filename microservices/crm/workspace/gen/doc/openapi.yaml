components:
  schemas:
    AddMemberRequest:
      type: object
      properties:
        user_id:
          type: string
        email:
          type: string
          format: email
          description: Invite by email when the user is not yet known
        role:
          $ref: '#/components/schemas/WorkspaceRole'
      required:
      - role
    ApiKey:
      type: object
      required:
      - id
      - name
      - is_active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        key_hash:
          type: string
          readOnly: true
        scopes:
          type: object
          description: Allowed scopes per entity
        rate_limit:
          type: integer
          format: int32
        ip_whitelist:
          type: array
          items:
            type: string
        is_active:
          type: boolean
        last_used:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        expires_at:
          type: string
          format: date-time
      description: An API key used for authentication and authorization
    AuditAction:
      type: string
      enum:
      - CREATE
      - UPDATE
      - DELETE
      - READ
      - EXPORT
      - IMPORT
      description: Enum of audit action types (create, update, delete, login, logout)
    AuditLogEntry:
      type: object
      required:
      - id
      - entity
      - entity_id
      - action
      - user_id
      - created_at
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
          maxLength: 64
        entity_id:
          type: string
        action:
          $ref: '#/components/schemas/AuditAction'
        user_id:
          type: string
          format: uuid
        changes:
          type: object
          description: Field changes before/after
        ip_address:
          type: string
        user_agent:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
      description: An audit log entry recording a system action
    BrandKit:
      type: object
      properties:
        id:
          type: string
          format: uuid
        logo_url:
          type: string
          format: uri
        colors:
          type: object
          properties:
            accent:
              type: string
            ink:
              type: string
            ground:
              type: string
            positive:
              type: string
        heading_font:
          type: string
        body_font:
          type: string
        button_style:
          type: string
          enum:
          - ROUNDED_FILLED
          - SQUARE_FILLED
          - OUTLINE
          - PILL
        social_links:
          type: array
          items:
            type: string
      required:
      - id
    ComplianceSettings:
      type: object
      properties:
        double_opt_in_default:
          type: boolean
        double_opt_in_regions:
          type: array
          items:
            type: string
          description: Regions where every subscription needs confirmation
        legitimate_interest_allowed:
          type: boolean
        require_unsubscribe_links:
          type: boolean
        one_click_unsubscribe:
          type: boolean
        anonymous_retention_days:
          type: integer
          format: int32
        pending_signup_expiry_days:
          type: integer
          format: int32
          description: Intake keeps unconfirmed sign-ups this long (ADR 004)
          default: 7
        cookie_consent_mode:
          type: string
          enum:
          - ALWAYS
          - AFTER_CONSENT
          - REGION
        footer_postal_address:
          type: string
        updated_at:
          type: string
          format: date-time
    CreateApiKeyRequest:
      type: object
      required:
      - name
      - scopes
      properties:
        name:
          type: string
          maxLength: 128
        scopes:
          type: object
          description: Permissions object
        rate_limit:
          type: integer
          format: int32
        ip_whitelist:
          type: array
          items:
            type: string
        expires_at:
          type: string
          format: date-time
      description: Request body for creating an API key
    CreateCustomFieldRequest:
      type: object
      required:
      - entity
      - name
      - label
      - field_type
      properties:
        entity:
          type: string
          enum:
          - crm.lead
          - crm.contact
          - crm.account
          - crm.stage
          - crm.team
          - crm.opportunity
          - crm.deal
          - crm.task
        name:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldType'
        options:
          type: object
        required:
          type: boolean
        visible:
          type: boolean
          default: true
        searchable:
          type: boolean
          default: false
        default_value:
          type: string
        group:
          type: string
          maxLength: 128
          description: Field group shown as a section on the record (e.g. "Deal information")
        sequence:
          type: integer
          description: Order within the group
        show_on_card:
          type: boolean
          description: 'Deals: show on the kanban card'
        personalization_tag:
          type: string
          description: Merge tag (%FIELD%) usable in templates
      description: Request body for creating a custom field definition
    CreateDataRequestRequest:
      type: object
      properties:
        kind:
          type: string
          enum:
          - ACCESS
          - ERASURE
        contact_email:
          type: string
          format: email
        note:
          type: string
      required:
      - kind
      - contact_email
    CreateIntegrationRequest:
      type: object
      required:
      - name
      - type
      properties:
        name:
          type: string
        type:
          $ref: '#/components/schemas/IntegrationType'
        config:
          type: object
        sync_direction:
          $ref: '#/components/schemas/SyncDirection'
      description: Request body for creating a third-party integration
    CreateWebhookRequest:
      type: object
      required:
      - name
      - url
      - events
      properties:
        name:
          type: string
        url:
          type: string
          format: uri
        events:
          type: array
          items:
            type: string
        secret:
          type: string
        headers:
          type: object
        retry_count:
          type: integer
          format: int32
      description: Request body for creating a webhook endpoint
    CustomField:
      type: object
      required:
      - id
      - entity
      - name
      - label
      - field_type
      - visible
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
          maxLength: 64
        name:
          type: string
          maxLength: 128
        label:
          type: string
          maxLength: 255
        field_type:
          $ref: '#/components/schemas/FieldType'
        options:
          type: object
          description: Type-specific options (e.g., select values)
        required:
          type: boolean
        visible:
          type: boolean
        searchable:
          type: boolean
        default_value:
          type: string
        created_by:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time
          readOnly: true
        group:
          type: string
          maxLength: 128
          description: Field group shown as a section on the record (e.g. "Deal information")
        sequence:
          type: integer
          description: Order within the group
        show_on_card:
          type: boolean
          description: 'Deals: show on the kanban card'
        personalization_tag:
          type: string
          description: Merge tag (%FIELD%) usable in templates
      description: A custom field definition for extending entity schemas
    DataRequest:
      type: object
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - ACCESS
          - ERASURE
        subject_hash:
          type: string
          description: SHA-256 of the normalised email
        contact_email:
          type: string
          format: email
          description: Shown to staff until the request is done
        requested_by:
          type: string
        source:
          type: string
          enum:
          - PREFERENCE_PAGE
          - EMAIL
          - STAFF
          - API
        status:
          type: string
          enum:
          - PENDING_REVIEW
          - RUNNING
          - DONE
          - REJECTED
        note:
          type: string
        steps:
          type: array
          items:
            type: object
            properties:
              service:
                type: string
              confirmed_at:
                type: string
                format: date-time
          description: Each CRM service's confirmation
        created_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
      required:
      - id
      - kind
      - status
      - created_at
    DataRequestPage:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/DataRequest'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    ExportRequest:
      type: object
      properties:
        entity:
          $ref: '#/components/schemas/JobEntity'
        options:
          $ref: '#/components/schemas/JobOptions'
        notify_email:
          type: boolean
          description: Email the requester a download link when done
      required:
      - entity
    FieldGroup:
      type: object
      properties:
        id:
          type: string
          format: uuid
        entity:
          type: string
          enum:
          - contact
          - organisation
          - deal
          - task
        name:
          type: string
        sequence:
          type: integer
          format: int32
      required:
      - id
      - entity
      - name
    FieldGroupPage:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FieldGroup'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    FieldGroupRequest:
      type: object
      properties:
        entity:
          type: string
          enum:
          - contact
          - organisation
          - deal
          - task
        name:
          type: string
        sequence:
          type: integer
          format: int32
      required:
      - entity
      - name
    FieldType:
      type: string
      enum:
      - STRING
      - INTEGER
      - FLOAT
      - BOOLEAN
      - DATE
      - DATETIME
      - EMAIL
      - PHONE
      - URL
      - TEXT
      - HTML
      - SELECT
      - MANY2ONE
      - MANY2MANY
      - MONEY
      - MULTISELECT
      - TEXTAREA
      description: Custom field types. MONEY carries a currency in options.currency; SELECT/MULTISELECT (AC dropdown/listbox)
        list options.values; TEXTAREA is multi-line text.
    Integration:
      type: object
      required:
      - id
      - name
      - type
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        type:
          $ref: '#/components/schemas/IntegrationType'
        config:
          type: object
          description: Configuration including credentials
        is_active:
          type: boolean
        sync_direction:
          $ref: '#/components/schemas/SyncDirection'
        last_sync:
          type: string
          format: date-time
        sync_status:
          $ref: '#/components/schemas/SyncStatus'
        created_at:
          type: string
          format: date-time
          readOnly: true
      description: A third-party integration configuration
    IntegrationType:
      type: string
      enum:
      - ERP
      - ACCOUNTING
      - MARKETING
      - SUPPORT
      - CUSTOM
      description: Enum of integration types (email, calendar, crm, accounting)
    Job:
      type: object
