        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    WorkspaceRequest:
      type: object
      properties:
        name:
          type: string
        slug:
          type: string
        brand_domain:
          type: string
        default_currency:
          type: string
        timezone:
          type: string
      required:
      - name
    WorkspaceRole:
      type: string
      enum:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    ErrorResponse:
      type: object
      required:
      - code
      - message
      description: Every error, from every CRM service.
      properties:
        code:
          type: integer
          format: int32
          description: HTTP status code
        message:
          type: string
          description: Human-readable message, safe to show
        details:
          type: string
          description: Additional detail
        request_id:
          type: string
          description: Same value as the X-Request-Id header
        fields:
          type: array
          description: Per-field validation errors (422)
          items:
            type: object
            required:
            - field
            - message
            properties:
              field:
                type: string
              message:
                type: string
    BrandKitInput:
      type: object
      properties:
        logo_url:
          type: string
          format: uri
        colors:
          type: object
          properties:
            accent:
              type: string
            ink:
              type: string
            ground:
              type: string
            positive:
              type: string
        heading_font:
          type: string
        body_font:
          type: string
        button_style:
          type: string
          enum:
          - ROUNDED_FILLED
          - SQUARE_FILLED
          - OUTLINE
          - PILL
        social_links:
          type: array
          items:
            type: string
      description: BrandKit (request body; id come from the path or headers)
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Id:
      name: id
      in: path
      required: true
      description: Resource id
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      description: 'The workspace (brand) the call acts in. Checked against the caller''s memberships: a foreign workspace
        is 403, a record in another workspace is 404 (ADR 004).'
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a retried request return the first response without repeating the side effect (kept 24 hours).
      schema:
        type: string
        maxLength: 128
  responses:
    BadRequest:
      description: Malformed request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Not allowed: the role, or a workspace the caller is not a member of'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found (or in another workspace)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicts with the current state
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Validation failed; see fields
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    RequestId:
      description: Correlates the request across the gateway, the service and its logs and traces.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
