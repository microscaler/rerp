openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Workspace
  version: v1.0.0
  description: 'How a workspace is run: workspaces (one per brand) and memberships with a role per workspace, custom field
    definitions and groups, API keys, outgoing webhooks, notification rules, compliance settings, data requests (access and
    erasure), brand kit, integrations, import / export jobs and the audit log.'
  x-api-docs:
    service: workspace
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/workspace
  description: Local development (port from port-registry)
- url: /api/v1/crm/workspace
  description: CRM Workspace API
tags:
- name: api-keys
  description: API key management and authentication
- name: audit-log
  description: Immutable audit trail of all operations
- name: brand
  description: Brand
- name: compliance
  description: Compliance
- name: custom-fields
  description: Custom field definitions per entity
- name: data-requests
  description: Data requests
- name: integrations
  description: Third-party integration configuration
- name: jobs
  description: 'Import / export job status: progress, row counts, per-row errors, result download'
- name: notifications
  description: Notifications
- name: team
  description: Team
- name: webhooks
  description: Webhook delivery for entity events
- name: workspaces
  description: Workspaces
paths:
  /api-keys:
    get:
      operationId: list_api_keys
      summary: List all API keys
      tags:
      - api-keys
      responses:
        '200':
          description: List of API keys
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedApiKey'
              examples:
                default:
                  items:
                  - id: 00000000-0000-0000-0000-000000000023
                    name: Production API
                    key: sk_test_00000000000000000000
                    enabled: true
                    created_at: '2024-01-15T10:30:00Z'
                    updated_at: '2024-01-15T10:30:00Z'
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: List all api-keys
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: create_api_key
      summary: Generate a new API key
      tags:
      - api-keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateApiKeyRequest'
            examples:
              default:
                name: Production API
                enabled: true
        description: Create a new API key
      responses:
        '201':
          description: API key created
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                  name:
                    type: string
                  key:
                    type: string
                    description: This key will only be shown once — save it now.
                  key_hash:
                    type: string
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000004
                  name: Discovery
                  order: 1
                  pipeline_id: 00000000-0000-0000-0000-000000000005
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new api-keys
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
  /audit-log:
    get:
      operationId: list_audit_log
      summary: Get audit log entries
      tags:
      - audit-log
