      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: filter_entity
        in: query
        schema:
          type: string
      - name: filter_action
        in: query
        schema:
          type: string
          enum:
          - CREATE
          - UPDATE
          - DELETE
          - READ
          - EXPORT
          - IMPORT
      - name: filter_user_id
        in: query
        schema:
          type: string
          format: uuid
      - name: filter_date_from
        in: query
        schema:
          type: string
          format: date-time
      - name: filter_date_to
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Audit log entries
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogEntry'
              examples:
                default:
                  items:
                  - id: 00000000-0000-0000-0000-000000000038
                    entity: lead
                    entity_id: 00000000-0000-0000-0000-000000000001
                    action: updated
                    timestamp: '2024-01-15T10:30:00Z'
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: List all audit-log
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /audit-log/{entity}/{entity_id}:
    get:
      operationId: get_entity_audit_log
      summary: Get audit log for a specific entity record
      tags:
      - audit-log
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: entity
        in: path
        required: true
        schema:
          type: string
      - name: entity_id
        in: path
        required: true
        schema:
          type: string
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Entity audit log
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AuditLogEntry'
                  total:
                    type: integer
                    format: int64
                required:
                - items
              examples:
                default:
                  entity: lead
                  entity_id: 00000000-0000-0000-0000-000000000003
                  log_entries: []
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Get audit-log by ID
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /auth/validate:
    post:
      operationId: validate_api_key
      summary: Validate an API key and return permissions
      tags:
      - api-keys
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - key
              properties:
                key:
                  type: string
                  description: API key (plain text, not hashed)
        description: Validate an API key or bearer token for access
      responses:
        '200':
          description: Validation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  scope:
                    type: object
                  rate_limit_remaining:
                    type: integer
                    format: int32
              examples:
                default:
                  valid: true
                  user_id: u001
                  permissions:
                  - crm:read
                  - crm:write
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '201':
          description: POST /auth/validate - Created
          content:
            application/json:
              schema:
                type: object
                properties:
                  valid:
                    type: boolean
                  scope:
                    type: object
                  rate_limit_remaining:
                    type: integer
                    format: int32
              examples:
                default:
                  valid: true
                  user_id: u001
                  permissions:
                  - crm:read
                  - crm:write
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Validate an API key or token
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
