[package]
name = "rerp_accounting_invoice"
version = "0.1.23"
edition = "2021"
build = "build.rs"

[lib]
name = "rerp_accounting_invoice"
path = "src/lib.rs"

[[bin]]
name = "invoice"
path = "src/main.rs"

[features]
default = ["jemalloc"]
jemalloc = ["tikv-jemallocator"]

[dependencies]
tracing = { workspace = true }
# Entities generated by build script
rerp_accounting_invoice_gen = { path = "../gen" }

# Accounting domain kernel and document signing/storage support
rerp-accounting-core = { path = "../../core" }
hmac = "0.13"
sha2 = "0.11"
url = "2"
http_legacy = { workspace = true }

# Lifeguard ORM
lifeguard = { workspace = true }
lifeguard-derive = { workspace = true }
rerp_entities = { workspace = true }

# lifeguard-migrate used by generated entity_registry.rs
lifeguard-migrate = { workspace = true }

# BRRTRouter (re-exported from gen crate, but may need direct access)
brrtrouter = { workspace = true }
brrtrouter_macros = { workspace = true }
sesame-idam-client = { workspace = true }

# Sea-query for LifeModel derive macros
sea-query = { version = "1.0.0-rc.29", features = ["with-json"] }

# Standard dependencies
serde = { workspace = true }
serde_json = { workspace = true }
serde_yaml = { workspace = true }
config = { workspace = true }
http = { workspace = true }
may = { workspace = true }
may_minihttp = { workspace = true }
anyhow = { workspace = true }
clap = { workspace = true }
arc-swap = { workspace = true }
rust_decimal = { workspace = true }
tikv-jemallocator = { workspace = true, optional = true }
chrono = { workspace = true }
uuid = { version = "1.0", features = ["v4", "serde"] }

[dev-dependencies]
# E3 live-HTTPS consumer proof (tests/e2e_https.rs): boots the real invoice
# binary, drives it through a test-only rustls edge with jsonwebtoken-minted
# Sesame-shaped HS256 tokens served by a mock JWKS endpoint.
base64 = "0.22"
jsonwebtoken = "11.1"
rcgen = "0.14"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }

[build-dependencies]
lifeguard-migrate = { workspace = true }

[lints]
workspace = true
