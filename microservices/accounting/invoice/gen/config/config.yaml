# BRRTRouter application configuration (YAML)
# This file is generated alongside the example application.
# Adjust values per environment and reload/restart the app.

security:
  # PropelAuth integration (recommended as first provider)
  # See PropelAuth docs: https://docs.propelauth.com/
  propelauth:
    # auth_url: "https://auth.yourdomain.com"   # REQUIRED - your PropelAuth Auth URL
    # audience: "your-api-audience"             # OPTIONAL - set if configured in PropelAuth
    # issuer: "https://auth.yourdomain.com/"    # OPTIONAL - defaults to auth_url
    # jwks_url: "https://auth.yourdomain.com/.well-known/jwks.json"  # OPTIONAL - derived from auth_url by default
    # leeway_secs: 30
    # cache_ttl_secs: 300

  # Static API keys bound to specific OpenAPI security scheme names
  # Example: 'ApiKeyAuth' corresponds to components.securitySchemes.ApiKeyAuth
  api_keys:
    # Development default for Pet Store example: OpenAPI scheme name is 'ApiKeyHeader'
    ApiKeyHeader:
      key: "test123"
      # header_name: "X-API-Key"  # optional override for header-based schemes

  # Remote API key verification by scheme name
  remote_api_keys:
    # ApiKeyAuth:
    #   verify_url: "https://auth.example/verify"
    #   timeout_ms: 500
    #   header_name: "X-API-Key"
    #   cache_ttl_secs: 60

  # Simple bearer signature (dev only) and optional cookie name
  bearer:
    # signature: "sig"
    # cookie_name: "auth_token"

  # Simple oauth2 signature (dev only) and optional cookie name
  oauth2:
    # signature: "sig"
    # cookie_name: "oauth_token"

  # Per-scheme JWKS configuration (production)
  jwks:
    # BearerAuth:
    #   jwks_url: "https://issuer.example/.well-known/jwks.json"
    #   iss: "https://issuer.example/"
    #   aud: "my-audience"
    #   leeway_secs: 30
    #   cache_ttl_secs: 300

http:
  # Enable HTTP/1.1 keep-alive (default true in generated apps for testing)
  keep_alive: true
  timeout_secs: 5
  max_requests: 5000
  # Handler wait deadline in ms (Epic 13.6). Omit / 0 = disabled (legacy wait).
  # Env override when unset here: BRRTR_HANDLER_DEADLINE_MS. See docs/HANDLER_DEADLINES.md.
  # handler_deadline_ms: 5000

# Rate limiting (Epic 13.2) — omitted / enabled: false → no-op (safe default).
# rate_limit:
#   enabled: true
#   requests: 100          # tokens per window (global)
#   window_secs: 60
#   max_keys: 10000        # soft cap on distinct client keys
#   key: subject_then_ip   # subject_then_ip | subject | ip
#   skip_options: false    # true = CORS preflight does not consume tokens
#   routes:
#     list_pets: 20        # optional per-handler tighter limit

# Response gzip (Epic 13.8) — omitted / enabled: false → identity (safe default).
# compression:
#   enabled: true
#   min_bytes: 256         # skip smaller bodies
#   level: 6               # gzip 0–9
# Never compresses text/event-stream or image/*; requires Accept-Encoding: gzip.

cors:
  # Allowed Origins for browser clients — not listed in openapi.yaml; set here per environment.
  # OpenAPI: per-operation `x-cors` (inherit | false | object); see info.description in openapi.yaml.
  # Route-specific CORS settings (methods, headers, credentials) can be defined in OpenAPI x-cors extension
  #
  # IMPORTANT: If any route has allowCredentials: true in OpenAPI x-cors extension,
  # you MUST configure at least one origin here (wildcard "*" is not allowed with credentials).
  # For development, you can use localhost origins. For production, use your actual domain.
  origins:
    - "http://localhost:3000"  # Align with sample-ui / integration tests (ui_scenarios_pet_store)
    # - "https://example.com"   # Production origin (uncomment and set for production)
    # - "https://api.example.com"
    # Use "*" to allow all origins (insecure, not recommended for production)
    # NOTE: "*" cannot be used with allowCredentials: true (CORS spec requirement)
    # - "*"
  # Global CORS settings (can be overridden per-route via OpenAPI x-cors)
  allowed_headers:
    - "Content-Type"
    - "Authorization"
  allowed_methods:
    - "GET"
    - "POST"
    - "PUT"
    - "DELETE"
    - "OPTIONS"
    # RFC 10008 QUERY — required for browser preflight (Epic 11 / Story 11.1).
    # Do not remove: gen/config is overwritten from this template on every regen.
    - "QUERY"
  allow_credentials: false
  expose_headers: []
  max_age: null  # Preflight cache duration in seconds (null = no caching)