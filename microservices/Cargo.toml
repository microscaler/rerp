[workspace]
members = [
    # Accounting suite-owned libraries
    "accounting/core",
    "accounting/entities",
    
    # Generated library crates (gen/) and implementation binary crates (impl/)
    "accounting/general-ledger/gen",
    "accounting/general-ledger/impl",
    "accounting/invoice/gen",
    "accounting/invoice/impl",
    "accounting/accounts-receivable/gen",
    "accounting/accounts-receivable/impl",
    "accounting/accounts-payable/gen",
    "accounting/accounts-payable/impl",
    "accounting/bank-sync/gen",
    "accounting/bank-sync/impl",
    "accounting/asset/gen",
    "accounting/asset/impl",
    "accounting/budget/gen",
    "accounting/budget/impl",
    "accounting/edi/gen",
    "accounting/edi/impl",
    "accounting/financial-reports/gen",
    "accounting/financial-reports/impl",
    "accounting/bff/gen",
    "accounting/bff/impl",
    "accounting/tax-compliance/gen",
    "accounting/tax-compliance/impl",
    "accounting/documents-extraction/gen",
    "accounting/documents-extraction/impl",
    "accounting/treasury/gen",
    "accounting/treasury/impl",
    "accounting/consolidation/gen",
    "accounting/consolidation/impl",
    "accounting/revenue-recognition/gen",
    "accounting/revenue-recognition/impl",
    "accounting/lease-accounting/gen",
    "accounting/lease-accounting/impl",
    "accounting/audit-controls/gen",
    "accounting/audit-controls/impl",

    # Documents suite
    "documents/render/gen",
    "documents/render/impl",

    # CRM suite (pipeline is the first live service — backs the PriceWhisperer
    # platform portal's just-enough CRM against the Supabase marketing DB)
    "crm/pipeline/gen",
    "crm/pipeline/impl",
    # The conversion contract between the funnel and RERP (ADR 003)
    "crm/conversion",
    # CRM accounts: the customer record; created only from conversions (ADR 003)
    "crm/accounts/gen",
    "crm/accounts/impl",

    # Centralized migration generation
    "migrator",
]
resolver = "2"
# What a bare `cargo build` (the octopilot pipeline's release build) compiles: the services that build today. The
# accounting crates do not compile on main yet (skaffold.yaml BP_RUST_PACKAGES); add them here when they do.
# `--workspace` (rerp build workspace, ci.yml) still builds every member.
default-members = [
    "crm/pipeline/gen",
    "crm/pipeline/impl",
    "crm/conversion",
    "crm/accounts/gen",
    "crm/accounts/impl",
]

[workspace.package]
version = "0.1.16"
edition = "2021"

[workspace.dependencies]
# Release builds (CI, the buildpack) use these git revisions: the same revs PriceWhisperer pins. Local dev
# overrides them with sibling checkouts from [workspace.metadata.local-deps] below (RERP_LOCAL_DEPS=1, which Tilt sets).
# BRRTRouter: default-features = false so arm7 cross build does not pull in jemalloc (__ffsdi2 link error)
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "10c18e203762dc93157a897711551bdfa6ca51b0", default-features = false }
brrtrouter_macros = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "10c18e203762dc93157a897711551bdfa6ca51b0" }
sesame-idam-client = { git = "https://github.com/microscaler/sesame-idam-client.git", rev = "f5e95db4a0baed387f35d040037ab4ce99184ff4" }
# Gen crate dependencies (from brrtrouter-gen Phase 1)
arc-swap = "1.7"
may_http = { git = "https://github.com/rust-may/may_http.git" }
http_legacy = { package = "http", version = "0.2" }

# Lifeguard ORM
lifeguard = { git = "https://github.com/microscaler/lifeguard.git", rev = "75e0e5fa57e585b4345f7b0e9da49e381c5bf44f" }
lifeguard-derive = { git = "https://github.com/microscaler/lifeguard.git", rev = "75e0e5fa57e585b4345f7b0e9da49e381c5bf44f" }
lifeguard-migrate = { git = "https://github.com/microscaler/lifeguard.git", rev = "75e0e5fa57e585b4345f7b0e9da49e381c5bf44f" }
rerp_entities = { package = "rerp-entities", path = "accounting/entities" }

# Standard dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.14"
http = "1.0"
may = "0.3"
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork", features = ["client"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# 0.7 with "profiling": one jemalloc-sys across the graph with microscaler-observability's heap profiler
# (jemalloc_pprof), and heap profiles to Cloud Profiler in pp (_RJEM_MALLOC_CONF, BRRTRouter ADR 005).
tikv-jemallocator = { version = "0.7", features = ["profiling"] }

# Database
may-postgres = "0.1"
rust_decimal = "1.33"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Sibling paths for local dev. Cargo does not read this table. Tilt sets RERP_LOCAL_DEPS=1, which writes
# microservices/.cargo/local-deps.config (gitignored) and points the build at it through OCTOPILOT_CARGO_CONFIG;
# CI never sets it, so CI and the buildpack use the git revs above. Paths are relative to microservices/.
[workspace.metadata.local-deps]
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", path = "../../BRRTRouter" }
brrtrouter_macros = { git = "https://github.com/microscaler/BRRTRouter.git", path = "../../BRRTRouter/brrtrouter_macros" }
sesame-idam-client = { git = "https://github.com/microscaler/sesame-idam-client.git", path = "../../sesame-idam-client" }
lifeguard = { git = "https://github.com/microscaler/lifeguard.git", path = "../../lifeguard" }
lifeguard-derive = { git = "https://github.com/microscaler/lifeguard.git", path = "../../lifeguard/lifeguard-derive" }
lifeguard-migrate = { git = "https://github.com/microscaler/lifeguard.git", path = "../../lifeguard/lifeguard-migrate" }

[patch.crates-io]
# sea-query 1.0.2 emits a bounded window-frame offset with no separator
# ("$1PRECEDING") that Postgres rejects; the fix + regression tests live on
# the microscaler fork (still version 1.0.2; PR to SeaQL pending). Aligns
# this workspace with lifeguard + PriceWhisperer.
sea-query = { git = "https://github.com/microscaler/sea-query.git", branch = "master" }
# Keep Lifeguard and other transitive users on the same rustls-capable client.
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork" }
