[workspace.package]
version = "0.1.23"
edition = "2021"


# Lints for hand-written crates (opt in with `[lints] workspace = true`; generated gen/ crates do not). CI runs clippy
# with -D warnings. Policy: docs/RUST_LINTS.md; tests are relaxed in clippy.toml;
# the gate is tooling/scripts/lint_rust.py.
[workspace.lints.rust]
rust_2018_idioms = { level = "warn", priority = -1 }
unused_qualifications = "warn"

[workspace.lints.clippy]
pedantic = { level = "warn", priority = -1 }
# Pedantic lints that do not fit this codebase.
module_name_repetitions = "allow"
must_use_candidate = "allow"
missing_errors_doc = "allow"
missing_panics_doc = "allow"
needless_pass_by_value = "allow" # BRRTRouter fixes the handler signature: handle(req: TypedHandlerRequest<Request>)
pub_underscore_fields = "allow" # emitted by Lifeguard's LifeModel derive, not by our code
similar_names = "allow" # flags ordinary pairs such as router/routes and due_m5/due_p5
items_after_statements = "allow" # a const or static next to its only use reads better than one hoisted to the top
default_trait_access = "allow" # `Default::default()` as an argument is named by the parameter's type
# Restriction lints we hold production code to.
unwrap_used = "warn"
expect_used = "warn"
panic = "warn"
todo = "warn"
unimplemented = "warn"
dbg_macro = "warn"
float_arithmetic = "warn" # money is rust_decimal::Decimal; f64 arithmetic loses cents
let_underscore_must_use = "warn"
allow_attributes_without_reason = "warn"
undocumented_unsafe_blocks = "warn"
print_stdout = "warn" # use tracing
print_stderr = "warn"

[workspace.dependencies]
tracing = "0.1"
# Release builds (CI, the buildpack) use these git revisions: the same revs PriceWhisperer pins. Local dev
# overrides them with sibling checkouts from [workspace.metadata.local-deps] below (RERP_LOCAL_DEPS=1, which Tilt sets).
# BRRTRouter: default-features = false so arm7 cross build does not pull in jemalloc (__ffsdi2 link error)
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "cb10df40d46c83811aa5a3016388e5b92af8df6a", default-features = false }
brrtrouter_macros = { git = "https://github.com/microscaler/BRRTRouter.git", rev = "cb10df40d46c83811aa5a3016388e5b92af8df6a" }
sesame-idam-client = { git = "https://github.com/microscaler/sesame-idam-client.git", rev = "02ceb2bff70edb33fd5a98690aa7899fc0031f4e" }
# Gen crate dependencies (from brrtrouter-gen Phase 1)
arc-swap = "1.7"
may_http = { git = "https://github.com/rust-may/may_http.git" }
http_legacy = { package = "http", version = "0.2" }

# Lifeguard ORM
lifeguard = { git = "https://github.com/microscaler/lifeguard.git", rev = "44a2412232597d8b44c3b9f3d98689e7c9fa9547" }
lifeguard-derive = { git = "https://github.com/microscaler/lifeguard.git", rev = "44a2412232597d8b44c3b9f3d98689e7c9fa9547" }
lifeguard-migrate = { git = "https://github.com/microscaler/lifeguard.git", rev = "44a2412232597d8b44c3b9f3d98689e7c9fa9547" }
rerp_entities = { package = "rerp-entities", path = "accounting/entities" }

# Standard dependencies
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
serde_yaml = "0.9"
config = "0.15"
http = "1.0"
may = "0.3"
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork", features = ["client"] }
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
# 0.7 with "profiling": one jemalloc-sys across the graph with microscaler-observability's heap profiler
# (jemalloc_pprof), and heap profiles to Cloud Profiler in pp (_RJEM_MALLOC_CONF, BRRTRouter ADR 005).
tikv-jemallocator = { version = "0.7", features = ["profiling"] }

# Database
may-postgres = "0.1"
rust_decimal = "1.33"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

# Sibling paths for local dev. Cargo does not read this table. Tilt sets RERP_LOCAL_DEPS=1, which writes
# microservices/.cargo/local-deps.config (gitignored) and points the build at it through OCTOPILOT_CARGO_CONFIG;
# CI never sets it, so CI and the buildpack use the git revs above. Paths are relative to microservices/.
[workspace.metadata.local-deps]
brrtrouter = { git = "https://github.com/microscaler/BRRTRouter.git", path = "../../BRRTRouter" }
brrtrouter_macros = { git = "https://github.com/microscaler/BRRTRouter.git", path = "../../BRRTRouter/brrtrouter_macros" }
sesame-idam-client = { git = "https://github.com/microscaler/sesame-idam-client.git", path = "../../sesame-idam-client" }
lifeguard = { git = "https://github.com/microscaler/lifeguard.git", path = "../../lifeguard" }
lifeguard-derive = { git = "https://github.com/microscaler/lifeguard.git", path = "../../lifeguard/lifeguard-derive" }
lifeguard-migrate = { git = "https://github.com/microscaler/lifeguard.git", path = "../../lifeguard/lifeguard-migrate" }

[patch.crates-io]
# may fork master: sub-millisecond timeouts honoured (no rounding to 0 / busy spin), recv_timeout.
may = { git = "https://github.com/microscaler/may.git", rev = "2156e046291dfd568797f10630ffbc74694d33aa" }
# sea-query 1.0.2 emits a bounded window-frame offset with no separator
# ("$1PRECEDING") that Postgres rejects; the fix + regression tests live on
# the microscaler fork (still version 1.0.2; PR to SeaQL pending). Aligns
# this workspace with lifeguard + PriceWhisperer.
sea-query = { git = "https://github.com/microscaler/sea-query.git", branch = "master" }
# Keep Lifeguard and other transitive users on the same rustls-capable client.
may_minihttp = { git = "https://github.com/microscaler/may_minihttp.git", branch = "integration/microscaler-fork" }
