          type: string
          pattern: ^-?\d{1,13}\.\d{1,6}$
          description: Positive line amount as a NUMERIC(19,6) decimal string
        description:
          type: string
          minLength: 1
          maxLength: 500
    PostJournalEntryRequest:
      type: object
