        name:
          type: string
          minLength: 1
          maxLength: 100
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
    TransitionFiscalPeriodRequest:
      type: object
      required:
      - idempotency_key
      - target_state
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Unique per legal entity for period transitions.
        target_state:
          type: string
          enum:
          - CLOSED
          - REOPENED
          - POSTING_LOCKED
          - PERMANENTLY_CLOSED
        reason:
          type: string
          minLength: 3
          maxLength: 500
          description: Required when target_state is REOPENED; an explicit policy override of a prior
            close.
