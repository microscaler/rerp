openapi: 3.0.3
x-brrtrouter-stack-size: 128KiB
info:
  title: RERP General Ledger API
  version: 0.2.0
  description: Phase 1 read-only General Ledger contract over RERP's authoritative accounting foundation.
    Tenant, organization, and legal-entity scope come only from the validated Sesame identity, which must
    carry the accounting:ledger:read permission. This API does not expose generic journal posting or mutable
    ledger records.
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: ledger
  description: Tenant-safe inspection of the authoritative accounting books
paths:
  /v1/accounts:
    get:
      operationId: list_ledger_accounts
      x-brrtrouter-impl: true
      tags:
      - ledger
      summary: List configured posting accounts
      parameters:
      - name: account_type
        in: query
        schema:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
      - name: currency_code
        in: query
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: active
        in: query
        schema:
          type: boolean
          default: true
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Accounts visible to the authenticated legal entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AccountList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: create_ledger_account
      x-brrtrouter-impl: true
      tags:
      - ledger
      summary: Create a chart-of-accounts posting account
      description: 'Creates a tenant-scoped posting account for the caller''s active legal entity. Control
        accounts (AR/AP/bank/tax/retained-earnings roles) are system-managed: the request schema has no
        control_role field, so such roles can neither be requested nor reassigned through this operation.
        Requests are idempotent per (legal entity, idempotency_key): replaying an identical body returns
        the original account with 200; a different body under a used key returns 409 idempotency_conflict;
        a duplicate account code for the legal entity returns 409 duplicate_account_code.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLedgerAccountRequest'
      responses:
        '201':
          description: Account created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'
        '200':
          description: Replay of an earlier identical request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/accounts/{id}:
    patch:
      operationId: update_ledger_account
      x-brrtrouter-impl: true
      tags:
      - ledger
      summary: Update a chart-of-accounts posting account
      description: 'Mutates a tenant-scoped posting account. Identity fields (code, normal_side) and control
        roles are immutable through this API - the request schema omits them. Accounts carrying a control_role
        are system-managed and cannot be modified here at all (403). account_type and currency_code may
        only change while no journal line references the account; once posted they are immutable (409
        posted_account_immutable). Requests are idempotent per (legal entity, idempotency_key): a replay
        of an identical body returns the current account with 200; a different body under a used key returns
        409 idempotency_conflict.'
      parameters:
      - name: id
        in: path
        required: true
        description: Account identifier within the authenticated accounting scope.
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLedgerAccountRequest'
      responses:
        '200':
          description: Updated account (also returned for idempotent replays)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LedgerAccount'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/fiscal-periods:
    get:
      operationId: list_fiscal_periods
      x-brrtrouter-impl: true
      tags:
      - ledger
      summary: List fiscal periods
      parameters:
      - name: state
        in: query
        schema:
          type: string
          enum:
          - OPEN
          - CLOSED
          - HARD_LOCKED
      - name: from_date
        in: query
        description: Return periods ending on or after this date
        schema:
          type: string
          format: date
      - name: to_date
        in: query
        description: Return periods starting on or before this date
        schema:
          type: string
          format: date
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 50
      responses:
        '200':
          description: Fiscal periods visible to the authenticated legal entity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FiscalPeriodList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
    post:
      operationId: create_fiscal_period
      summary: Create a fiscal period
      description: 'Creates a fiscal period in state OPEN. The date range must not overlap any existing
        period of the legal entity; names are unique per legal entity. Idempotent per (legal entity, idempotency_key):
        replaying the identical payload returns the existing period, a changed payload returns 409.'
      x-brrtrouter-impl: true
      tags:
      - fiscal-periods
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateFiscalPeriodRequest'
      responses:
        '201':
          $ref: '#/components/responses/CreateFiscalPeriodCreatedResponse'
        '200':
          $ref: '#/components/responses/CreateFiscalPeriodCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/CreateFiscalPeriodConflictResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/journal-entries/{id}:
    get:
      operationId: get_journal_entry
      x-brrtrouter-impl: true
      tags:
      - ledger
      summary: Retrieve one immutable posted journal
      parameters:
      - $ref: '#/components/parameters/JournalEntryId'
      responses:
        '200':
          description: Posted journal and its one-sided lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/JournalEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/trial-balance:
    get:
      operationId: get_trial_balance
      x-brrtrouter-impl: true
      tags:
      - ledger
      summary: Derive a trial balance from immutable posted journal lines
      parameters:
      - name: as_of_date
        in: query
        required: true
        schema:
          type: string
          format: date
      - name: currency_code
        in: query
        required: true
        schema:
          type: string
          pattern: ^[A-Z]{3}$
      - name: include_zero_balance
        in: query
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: Trial balance derived at the requested accounting date
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrialBalance'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/fiscal-periods/{id}/transitions:
    post:
      operationId: transition_fiscal_period
      summary: Advance a fiscal period's lifecycle state
      description: 'Applies one transition of the period state machine: OPEN->CLOSED; CLOSED->REOPENED
        or POSTING_LOCKED; REOPENED->CLOSED or POSTING_LOCKED; POSTING_LOCKED->PERMANENTLY_CLOSED. Any
        other transition is 409. REOPENED additionally requires an explicit reason (policy override of
        a prior close). Posting into a period is allowed exactly when it is OPEN or REOPENED; every transition
        is an accounting audit fact. Idempotent per (legal entity, idempotency_key) with the same replay
        rules as creation.'
      x-brrtrouter-impl: true
      tags:
      - fiscal-periods
      parameters:
      - name: id
        in: path
        required: true
        description: Fiscal period identifier
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransitionFiscalPeriodRequest'
      responses:
        '201':
          $ref: '#/components/responses/TransitionFiscalPeriodCreatedResponse'
        '200':
          $ref: '#/components/responses/TransitionFiscalPeriodCreatedResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/TransitionFiscalPeriodConflictResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/journal-entries:
    post:
      operationId: post_journal_entry
      summary: Post a manual balanced journal entry
      description: 'Posts a manual journal entry: at least two lines, total debits must equal total credits,
        the entry date must fall in a period that is OPEN or REOPENED. Every line account must be active
        in the caller''s legal entity. Entry numbers are deterministic per legal entity and calendar year
        (JE-{year}-{n}), allocated under the same transaction-scoped advisory lock the invoice service
        uses, so numbering is collision-free across services. Idempotent per (legal entity, idempotency_key):
        replaying the identical payload returns the stored entry; a changed payload returns 409.'
      x-brrtrouter-impl: true
      tags:
      - journal-entries
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostJournalEntryRequest'
      responses:
        '201':
          $ref: '#/components/responses/PostJournalEntryResponse'
        '200':
          $ref: '#/components/responses/PostJournalEntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/PostJournalEntryConflictResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/journal-entries/{id}/reversals:
    post:
      operationId: reverse_journal_entry
      summary: Reverse a posted journal entry
      description: Creates a NEW balanced journal entry whose lines mirror the original with sides swapped;
        the original is never modified. Both audit histories are preserved and the reversal is linked
        via the original document id. The reversal is dated today and must land in an OPEN or REOPENED
        period. Reversing an entry that is already reversed is 409. Idempotent per (legal entity, idempotency_key)
        with the standard replay rules.
      x-brrtrouter-impl: true
      tags:
      - journal-entries
      parameters:
      - name: id
        in: path
        required: true
        description: Journal entry being reversed
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReverseJournalEntryRequest'
      responses:
        '201':
          $ref: '#/components/responses/ReverseJournalEntryResponse'
        '200':
          $ref: '#/components/responses/ReverseJournalEntryResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/ReverseJournalEntryConflictResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/opening-balances:
    post:
      operationId: set_opening_balances
      summary: Set opening balances for a fiscal year
      description: 'Posts the opening-balances journal entry for the fiscal year: one balanced entry dated
        at the start of the period covering January 1 of the fiscal year. It must be the FIRST posting
        in that period (any prior journal entry is 409) and can be set only once per period (a second
        opening-balances attempt is 409 opening_balances_already_set). Every account must be active in
        the caller''s legal entity with matching currency. Shares the transaction-scoped numbering lock
        with all other posting services. Idempotent per (legal entity, idempotency_key) with the standard
        replay rules. The retained-earnings close for year transition is a separate operation and is not
        implied by this endpoint.'
      x-brrtrouter-impl: true
      tags:
      - opening-balances
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SetOpeningBalancesRequest'
      responses:
        '201':
          $ref: '#/components/responses/SetOpeningBalancesResponse'
        '200':
          $ref: '#/components/responses/SetOpeningBalancesResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/SetOpeningBalancesConflictResponse'
        '500':
          $ref: '#/components/responses/InternalError'
  /v1/year-closes:
    post:
      operationId: close_fiscal_year
      summary: Close a fiscal year to retained earnings
      description: 'Posts the retained-earnings closing journal entry for a fiscal year: one balanced
        entry dated December 31 that moves the net result of every REVENUE and EXPENSE account posted
        in the calendar-year periods back to the designated EQUITY-role retained-earnings account (profit
        credits it, losses debit it). Aggregation covers journal entries in periods starting within the
        fiscal year and excludes prior closing entries. The period covering December 31 must be open for
        posting (OPEN or REOPENED). A year can be closed once (409 year_already_closed); a year without
        P&L activity cannot be closed (409 nothing_to_close). All touched accounts must share the retained-earnings
        account currency. Shares the transaction-scoped numbering lock with all other posting services.
        Idempotent per (legal entity, idempotency_key) with the standard replay rules.'
      x-brrtrouter-impl: true
      tags:
      - year-close
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CloseFiscalYearRequest'
      responses:
        '201':
          $ref: '#/components/responses/YearCloseResponse'
        '200':
          $ref: '#/components/responses/YearCloseResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/YearCloseConflictResponse'
        '500':
          $ref: '#/components/responses/InternalError'
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesame access token validated by BRRTRouter
  parameters:
    JournalEntryId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request parameter
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid authentication
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated identity lacks permission or cannot establish an accounting scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource not found in the authenticated accounting scope
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency payload conflict or duplicate account code
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    InternalError:
      description: Accounting query could not be completed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    CreateFiscalPeriodCreatedResponse:
      description: The fiscal period after the write
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FiscalPeriod'
    CreateFiscalPeriodConflictResponse:
      description: Idempotency key already used with a different payload, or the write violates a period
        invariant (overlap, illegal transition)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TransitionFiscalPeriodCreatedResponse:
      description: The fiscal period after the write
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/FiscalPeriod'
    TransitionFiscalPeriodConflictResponse:
      description: Idempotency key already used with a different payload, or the write violates a period
        invariant (overlap, illegal transition)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    PostJournalEntryResponse:
      description: The journal entry after the write
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JournalEntryResponse'
    PostJournalEntryConflictResponse:
      description: Idempotency key already used with a different payload, or the write violates a posting
        invariant (unbalanced, no open period, already reversed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    ReverseJournalEntryResponse:
      description: The journal entry after the write
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/JournalEntryResponse'
    ReverseJournalEntryConflictResponse:
      description: Idempotency key already used with a different payload, or the write violates a posting
        invariant (unbalanced, no open period, already reversed)
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    SetOpeningBalancesResponse:
      description: The opening-balances journal entry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/OpeningBalancesResponse'
    SetOpeningBalancesConflictResponse:
      description: Idempotency key already used with a different payload, opening balances already set
        for the period, the period already contains postings, or a period invariant failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    YearCloseResponse:
      description: The retained-earnings closing journal entry
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/YearCloseResponse'
    YearCloseConflictResponse:
      description: Idempotency key already used with a different payload, the year is already closed,
        the year has no profit and loss postings, the period covering December 31 is not open for posting,
        or a close invariant failed
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    ErrorResponse:
      type: object
      required:
      - code
      - message
      additionalProperties: false
      properties:
        code:
          type: string
        message:
          type: string
    LedgerAccount:
      type: object
      required:
      - id
      - code
      - name
      - account_type
      - normal_side
      - currency_code
      - active
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        code:
          type: string
        name:
          type: string
        account_type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
        normal_side:
          type: string
          enum:
          - DEBIT
          - CREDIT
        control_role:
          type: string
          nullable: true
        currency_code:
          type: string
          pattern: ^[A-Z]{3}$
        active:
          type: boolean
    AccountList:
      type: object
      required:
      - items
      - limit
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/LedgerAccount'
        limit:
          type: integer
    CreateLedgerAccountRequest:
      type: object
      additionalProperties: false
      required:
      - idempotency_key
      - code
      - name
      - account_type
      - normal_side
      - currency_code
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Client-generated key; replays of an identical body return the original account.
        code:
          type: string
          minLength: 1
          maxLength: 50
          pattern: ^[0-9][0-9A-Za-z._-]*$
          description: Account code, unique per legal entity (DB-enforced).
        name:
          type: string
          minLength: 1
          maxLength: 255
        account_type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
        normal_side:
          type: string
          enum:
          - DEBIT
          - CREDIT
        currency_code:
          type: string
          pattern: ^[A-Z]{3}$
    UpdateLedgerAccountRequest:
      type: object
      additionalProperties: false
      required:
      - idempotency_key
      minProperties: 2
      properties:
        idempotency_key:
          type: string
          minLength: 8
          maxLength: 200
          pattern: ^[A-Za-z0-9][A-Za-z0-9._:-]*$
          description: Client-generated key; replays of an identical body return the current account.
        name:
          type: string
          minLength: 1
          maxLength: 255
        is_active:
          type: boolean
        account_type:
          type: string
          enum:
          - ASSET
          - LIABILITY
          - EQUITY
          - REVENUE
          - EXPENSE
        currency_code:
          type: string
          pattern: ^[A-Z]{3}$
    FiscalPeriod:
      type: object
      required:
      - id
      - name
      - start_date
      - end_date
      - state
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        state:
          type: string
          enum:
          - OPEN
          - CLOSED
          - POSTING_LOCKED
          - REOPENED
          - PERMANENTLY_CLOSED
          description: Period lifecycle state; posting into a period is allowed exactly when it is OPEN
            or REOPENED
        closed_at:
          type: string
          format: date-time
          nullable: true
        closed_by:
          type: string
          format: uuid
          nullable: true
    FiscalPeriodList:
      type: object
      required:
      - items
      - limit
      additionalProperties: false
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/FiscalPeriod'
        limit:
          type: integer
    JournalLine:
      type: object
      required:
      - line_number
      - account_id
      - side
      - amount
      - description
      additionalProperties: false
      properties:
        line_number:
          type: integer
        account_id:
          type: string
          format: uuid
        side:
          type: string
          enum:
          - DEBIT
          - CREDIT
        amount:
          type: string
          pattern: ^[0-9]+(\.[0-9]+)?$
        description:
          type: string
    JournalEntry:
      type: object
      required:
      - id
      - entry_number
      - entry_date
      - fiscal_period_id
      - source_document_id
      - currency_code
      - total_debit
      - total_credit
      - posted_at
      - lines
      additionalProperties: false
      properties:
        id:
          type: string
          format: uuid
        entry_number:
          type: string
        entry_date:
          type: string
          format: date
        fiscal_period_id:
          type: string
          format: uuid
