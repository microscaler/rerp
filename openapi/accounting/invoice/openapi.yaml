openapi: 3.0.3
x-brrtrouter-stack-size: 128KiB
info:
  title: RERP Customer Invoicing API
  version: 0.2.0
  description: Canonical Phase 1 customer invoicing contract. Commands accept commercial facts only; authenticated
    tenant, legal entity, fiscal period, numbering, and GL account policy are resolved inside RERP.
servers:
- url: /
security:
- bearerAuth: []
tags:
- name: customer-invoices
paths:
  /v1/customer-invoices:
    get:
      operationId: list_customer_invoices
      tags:
      - customer-invoices
      summary: List posted customer invoices and credit notes
      description: The invoice service owns customer invoices and credit notes. Accounts receivable tracks
        their open balances (open items) by invoice id.
      x-brrtrouter-impl: true
      parameters:
      - name: customer_id
        in: query
        schema:
          type: string
          format: uuid
      - name: document_type
        in: query
        schema:
          type: string
          enum:
          - CUSTOMER_INVOICE
          - CUSTOMER_CREDIT_NOTE
      - name: invoice_date_from
        in: query
        schema:
          type: string
          format: date
      - name: invoice_date_to
        in: query
        schema:
          type: string
          format: date
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Posted invoices, newest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostedInvoices'
        '400': &id003
          $ref: '#/components/responses/BadRequest'
        '401': &id001
          $ref: '#/components/responses/Unauthorized'
        '403': &id002
          $ref: '#/components/responses/Forbidden'
    post:
      operationId: post_customer_invoice
      tags:
      - customer-invoices
      summary: Issue and post a customer invoice atomically
      x-brrtrouter-impl: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PostCustomerInvoiceRequest'
      responses:
        '201':
          description: A new invoice and balanced journal were committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '200':
          description: An identical idempotent request returned the committed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: 'Posting atomically stores a durable render-outbox instruction with the immutable render
        model (NFR-DOG-010): posting succeeds while the render pipeline or object storage is down and
        rendering remains durable, retryable and inspectable via GET /v1/render-outbox.'
  /v1/customer-invoices/{id}:
    parameters:
    - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: get_customer_invoice
      tags:
      - customer-invoices
      summary: Retrieve a posted customer invoice
      x-brrtrouter-impl: true
      responses:
        '200':
          description: Posted invoice with immutable line snapshots
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostedInvoice'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customer-invoices/{id}/journal:
    parameters:
    - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: get_customer_invoice_journal
      tags:
      - customer-invoices
      summary: Retrieve the balanced journal produced for an invoice
      x-brrtrouter-impl: true
      responses:
        '200':
          description: Balanced journal and immutable lines
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostedJournal'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /v1/customer-invoices/{id}/document:
    parameters:
    - $ref: '#/components/parameters/DocumentId'
    get:
      operationId: get_customer_invoice_document
      tags:
      - customer-invoices
      summary: Retrieve immutable PDF metadata and a short-lived download URL
      description: 'Materialises the deterministic PDF on first access, stores it in private content-addressed
        object storage and returns a five-minute signed URL. Rendering is driven by the durable render-outbox
        instruction captured at posting: the attempt counter and last error are recorded on the instruction,
        and if the render pipeline or object storage is unavailable the instruction stays durably queued
        for a later attempt (503 now, retry later).'
      x-brrtrouter-impl: true
      responses:
        '200':
          description: Immutable PDF artifact and temporary download capability
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedDocument'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '503':
          $ref: '#/components/responses/Unavailable'
  /v1/customer-invoices/{id}/credit-notes:
    parameters:
    - $ref: '#/components/parameters/DocumentId'
    post:
      operationId: credit_customer_invoice
      tags:
      - customer-invoices
      summary: Issue a full or partial credit note against a posted invoice
      x-brrtrouter-impl: true
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreditCustomerInvoiceRequest'
      responses:
        '201':
          description: Credit note and reversal journal committed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '200':
          description: Identical idempotent retry returned the committed result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PostingResult'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          $ref: '#/components/responses/Conflict'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: 'Issues a credit note as its own immutable posted document linked to the original;
        the original is never modified (explicit workflow only — no generic status mutation path exists).
        Without `lines` the credit note fully reverses the original posting. With `lines` the credit is
        partial: quantities per original line are validated against the remaining creditable quantities
        across all prior credit notes, an over-credit returns 422, and the credit note preserves the original
        line numbers so the remaining creditable balance stays computable. Idempotent per (legal entity,
        idempotency_key): replaying the same key with a different selection is 409. The credit-note document
        is queued for rendering through the same durable render outbox as customer invoices.'
  /v1/render-outbox:
    get:
      operationId: list_render_outbox
      tags:
      - render-outbox
      summary: Inspect durable render instructions (operator surface)
      description: Lists render-outbox instructions with status, attempt counts and last
        error for operator inspection and recovery. The immutable render model itself is
        captured at posting time but not returned here; entries exclude it to keep the
        surface small.
      x-brrtrouter-impl: true
      parameters:
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - DONE
      - name: document_id
        in: query
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Render-outbox instructions, oldest first
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedRenderOutbox'
        '401': *id001
        '403': *id002
        '400': *id003
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesame access token validated by BRRTRouter
  parameters:
    DocumentId:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  responses:
    BadRequest:
      description: Invalid request syntax or value
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unavailable:
      description: Rendered-document storage is temporarily unavailable
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Authentication is required
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: Authenticated identity context is incomplete or inconsistent
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Resource does not exist in the authenticated tenant
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Idempotency key or source reference conflicts with existing facts
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Accounting policy rejected the otherwise valid command
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  schemas:
    SourceReference:
      type: object
      required:
      - system
      - resource_type
      - resource_id
      properties:
        system:
          type: string
          minLength: 1
          maxLength: 100
          example: hauliage
        resource_type:
          type: string
          minLength: 1
          maxLength: 100
          example: delivery
        resource_id:
          type: string
          minLength: 1
          maxLength: 255
          example: delivery-123
    TaxFact:
      type: object
      required:
      - code
      - rate_percent
      properties:
        code:
          type: string
          minLength: 1
          maxLength: 100
        rate_percent:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
    CustomerInvoiceLine:
      type: object
      required:
      - description
      - quantity
      - unit_price
      properties:
        description:
          type: string
          minLength: 1
          maxLength: 1000
        quantity:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        unit_price:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        discount_percent:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
          default: '0'
        tax:
          allOf:
          - $ref: '#/components/schemas/TaxFact'
          nullable: true
    PostCustomerInvoiceRequest:
      type: object
      required:
      - idempotency_key
      - source
      - customer_id
      - invoice_date
      - due_date
      - currency_code
      - lines
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        source:
          $ref: '#/components/schemas/SourceReference'
        customer_id:
          type: string
          format: uuid
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        currency_code:
          type: string
          pattern: ^[A-Z]{3}$
        rounding_minor_units:
          type: integer
          minimum: 0
          maximum: 6
          default: 2
        lines:
          type: array
          minItems: 1
          maxItems: 1000
          items:
            $ref: '#/components/schemas/CustomerInvoiceLine'
    CreditCustomerInvoiceRequest:
      type: object
      required:
      - idempotency_key
      - source
      - reason
      properties:
        idempotency_key:
          type: string
          minLength: 1
          maxLength: 200
        source:
          $ref: '#/components/schemas/SourceReference'
        reason:
          type: string
          minLength: 1
          maxLength: 1000
        lines:
          type: array
          minItems: 1
          maxItems: 50
          items:
            $ref: '#/components/schemas/CreditLineInput'
          description: 'Explicit partial-credit selection (Epic E2). Omit for a full credit note. When
            present, exactly these quantities of these original lines are credited: unit price, discount
            and tax rate are inherited from the original line and amounts are recomputed with the invoice''s
            rounding policy. Quantities are validated against what previous credit notes (full or partial)
            have not yet consumed per line; exceeding the remainder is a 422 accounting_policy_error.
            The original document is never modified; partial credits accumulate until the line quantities
            are fully credited.'
    PostedInvoiceLine:
      type: object
      required:
      - line_number
      - description
      - quantity
      - unit_price
      - discount_percent
      - gross_amount
      - discount_amount
      - net_amount
      - tax_amount
      - total_amount
      properties:
        line_number:
          type: integer
        description:
          type: string
        quantity:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        unit_price:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        discount_percent:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        gross_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        discount_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        net_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        tax_code:
          type: string
          nullable: true
        tax_rate_percent:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
          nullable: true
        tax_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        total_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
    PostedInvoice:
      type: object
      required:
      - id
      - document_number
      - document_type
      - status
      - customer_id
      - source
      - invoice_date
      - due_date
      - currency_code
      - rounding_minor_units
      - subtotal
      - discount_amount
      - tax_amount
      - total_amount
      - posted_at
      - lines
      properties:
        id:
          type: string
          format: uuid
        document_number:
          type: string
        document_type:
          type: string
          enum:
          - CUSTOMER_INVOICE
          - CUSTOMER_CREDIT_NOTE
        status:
          type: string
          enum:
          - POSTED
        original_document_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
        source:
          $ref: '#/components/schemas/SourceReference'
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        currency_code:
          type: string
        rounding_minor_units:
          type: integer
        subtotal:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        discount_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        tax_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        total_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        posted_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/PostedInvoiceLine'
    PostedInvoiceSummary:
      type: object
      required:
      - id
      - document_number
      - document_type
      - customer_id
      - invoice_date
      - due_date
      - currency_code
      - total_amount
      - posted_at
      properties:
        id:
          type: string
          format: uuid
        document_number:
          type: string
        document_type:
          type: string
          enum:
          - CUSTOMER_INVOICE
          - CUSTOMER_CREDIT_NOTE
        original_document_id:
          type: string
          format: uuid
          nullable: true
        customer_id:
          type: string
          format: uuid
        invoice_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        currency_code:
          type: string
        tax_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        total_amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        posted_at:
          type: string
          format: date-time
    PaginatedPostedInvoices:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/PostedInvoiceSummary'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
        has_more:
          type: boolean
    JournalLine:
      type: object
      required:
      - line_number
      - account_id
      - description
      - side
      - amount
      properties:
        line_number:
          type: integer
        account_id:
          type: string
          format: uuid
        description:
          type: string
        side:
          type: string
          enum:
          - DEBIT
          - CREDIT
        amount:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
    PostedJournal:
      type: object
      required:
      - id
      - entry_number
      - entry_date
      - source_document_id
      - currency_code
      - total_debit
      - total_credit
      - posted_at
      - lines
      properties:
        id:
          type: string
          format: uuid
        entry_number:
          type: string
        entry_date:
          type: string
          format: date
        source_document_id:
          type: string
          format: uuid
        currency_code:
          type: string
        total_debit:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        total_credit:
          type: string
          pattern: ^-?[0-9]+(?:\.[0-9]{1,6})?$
        posted_at:
          type: string
          format: date-time
        lines:
          type: array
          items:
            $ref: '#/components/schemas/JournalLine'
    PostingResult:
      type: object
      required:
      - idempotency_key
      - request_fingerprint
      - invoice
      - journal
      properties:
        idempotency_key:
          type: string
        request_fingerprint:
          type: string
          pattern: ^[a-f0-9]{64}$
        invoice:
          $ref: '#/components/schemas/PostedInvoice'
        journal:
          $ref: '#/components/schemas/PostedJournal'
    RenderedDocument:
      type: object
      required:
      - document_id
      - media_type
      - sha256
      - size_bytes
      - renderer
      - renderer_version
      - rendered_at
      - download_url
      - expires_at
      properties:
        document_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum:
          - application/pdf
        sha256:
          type: string
          pattern: ^[a-f0-9]{64}$
        size_bytes:
          type: integer
          format: int64
          minimum: 1
        renderer:
          type: string
        renderer_version:
          type: string
        rendered_at:
          type: string
          format: date-time
        download_url:
          type: string
          format: uri
        expires_at:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: string
        message:
          type: string
        request_id:
          type: string
    RenderOutboxEntry:
      type: object
      required:
      - id
      - document_id
      - media_type
      - renderer
      - renderer_version
      - status
      - attempts
      - created_at
      - updated_at
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
        media_type:
          type: string
          enum:
          - application/pdf
        renderer:
          type: string
        renderer_version:
          type: string
        status:
          type: string
          enum:
          - PENDING
          - IN_PROGRESS
          - DONE
        attempts:
          type: integer
          minimum: 0
        last_error:
          type: string
          nullable: true
          description: Most recent render/storage failure, truncated; the instruction stays durably queued
            after every failure
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    PaginatedRenderOutbox:
      type: object
      required:
      - items
      - page
      - limit
      - total
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RenderOutboxEntry'
        page:
          type: integer
          minimum: 1
        limit:
          type: integer
          minimum: 1
          maximum: 100
        total:
          type: integer
          minimum: 0
    CreditLineInput:
      type: object
      required:
      - original_line_number
      - quantity
      properties:
        original_line_number:
          type: integer
          minimum: 1
          description: Line number on the original customer invoice
        quantity:
          type: string
          pattern: ^[0-9]{1,13}\.[0-9]{1,6}$
          description: Positive quantity to credit for this line as a NUMERIC(19,6) decimal string
