openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Reporting & BI
  version: v1.0.0
  description: Analytics, dashboards, forecasts, and reporting for CRM operations.
  x-api-version: CRM Reporting API v1.0.0
  x-crm-api-version: v1.0.0
  termsOfService: https://rerp.example.com/terms
  contact:
    name: RERP API Support
    url: https://docs.rerp.com/support
    email: api-support@rerp.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-api-docs:
    service: reporting
    openapi_version: 3.1.0
    brrtrouter_version: latest
servers:
- url: http://localhost:10352/api/v1/crm/reporting
  description: Local development (direct to service, port from port-registry)
- url: /api/v1/crm/reporting
  description: Reporting API
tags:
- name: conversion
  description: Lead-to-revenue conversion analytics
- name: forecast
  description: Revenue forecasting
- name: performance
  description: Rep and team performance metrics
- name: pipeline
  description: Pipeline health and revenue summary
- name: report-analytics
  description: Pipeline, conversion, and funnel analytics
- name: report-forecast
  description: Forecasting and accuracy tracking
- name: report-performance
  description: Rep and team performance metrics
- name: report-scheduling
  description: Report scheduling and export
- name: report-time-to-close
  description: Time-to-close analysis
- name: report-win-loss
  description: Win/loss analysis
- name: reports
  description: Custom report builder and scheduling
- name: win-loss
  description: Win rate and loss analysis
- name: deal-reports
  description: 'Deal reports: overview, owner overview, funnel, sales performance, forecast (crm/pipeline deals)'
- name: task-reports
  description: 'Task overview: load, completion and outcome sentiment per rep (crm/tasks)'
- name: automation-reports
  description: 'Automation reports: all automations, per-automation overview / goals / contacts, jump-to tracking, automated
    1:1 emails'
- name: contact-reports
  description: 'Contact reports: performance (active / inactive, trends, top lists and tags), field breakdown, nearby contacts,
    tag trends'
- name: email-reports
  description: 'Email engagement reports across campaigns and automations: client trends, open/read trends by weekday and
    hour, predictive-content variants'
- name: revenue-reports
  description: Marketing revenue attributed to campaigns and automation emails from conversions (crm/marketing) within an
    attribution window
- name: dashboards
  description: Per-user dashboards of widgets (a saved metric query each), with per-widget scheduled email
paths:
  /analytics/pipeline-summary:
    get:
      operationId: get_pipeline_summary
      summary: Get pipeline summary grouped by stage
      tags:
      - pipeline
      parameters:
      - name: team_id
        in: query
        schema:
          type: string
          format: uuid
      - name: start_date
        in: query
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Pipeline summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPipelinesummary'
              examples:
                default:
                  items:
                  - total_leads: 150
                    stage_breakdown:
                      discovery: 45
                      qualified: 35
                    weighted_value: 375000
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          description: Unauthorized
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get pipeline summary with stage breakdown
      x-operation-id: get_pipeline-summary
      x-controller: rerp_crm::reporting::controller::analytics::pipeline-summary
      x-handler-name: analytics_pipeline-summary
  /analytics/pipeline-weighted:
    get:
      operationId: get_weighted_pipeline
      summary: Get weighted pipeline by team/rep
      tags:
      - pipeline
      responses:
        '200':
          description: Weighted pipeline data
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WeightedPipeline'
              examples:
                default:
                  total_leads: 150
                  stage_breakdown:
                    discovery:
                      count: 45
                      value: 100000
                      probability: 0.2
                    qualified:
                      count: 35
                      value: 125000
                      probability: 0.4
                  weighted_value: 85000
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get weighted pipeline revenue
      x-operation-id: get_pipeline-weighted
      x-controller: rerp_crm::reporting::controller::analytics::pipeline-weighted
      x-handler-name: analytics_pipeline-weighted
