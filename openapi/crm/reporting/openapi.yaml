      - name: start_date
        in: query
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Conversion rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversionrate'
              examples:
                default:
                  items:
                  - period: monthly
                    total_leads: 500
                    converted: 62
                    rate: 12.4
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '403':
          description: Forbidden — insufficient permissions
