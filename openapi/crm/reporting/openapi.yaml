    PaginatedLeaderboardEntry:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/LeaderboardEntry'
      description: Paginated list of LeaderboardEntry records
    PaginatedForecastAccuracyEntry:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ForecastAccuracyEntry'
      description: Paginated list of ForecastAccuracyEntry records
    OwnerRef:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
      required:
