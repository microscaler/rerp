        min:
          type: number
          format: double
        max:
          oneOf:
          - type: number
            format: double
          - type: 'null'
          description: null = open-ended top bracket
        count:
          type: integer
        value:
          type: number
          format: double
      required:
      - label
      - count
      - value
      description: One bar of the deal-value histogram. Brackets are tenant settings (default 0-1k, 1k-5k, 5k-25k, 25k+).
    DealTotals:
      type: object
      properties:
        open_count:
          type: integer
        open_value:
          type: number
          format: double
        won_count:
          type: integer
        won_value:
          type: number
          format: double
        lost_count:
          type: integer
        lost_value:
          type: number
          format: double
        win_rate:
          type: number
          format: float
          description: 0-100
        avg_deal_value:
          type: number
          format: double
        avg_days_to_close:
          type: number
          format: float
      required:
      - open_count
      - open_value
      - won_count
      - won_value
      - lost_count
      - lost_value
      - win_rate
    DealOwnerRow:
      allOf:
      - $ref: '#/components/schemas/OwnerRef'
      - $ref: '#/components/schemas/DealTotals'
      - type: object
        properties:
          deals_created:
            type: integer
          tasks_completed:
            type: integer
          last_activity_at:
            type: string
            format: date-time
      description: One owner's line in the overview / owner-overview tables
    DealStageRow:
      type: object
      properties:
        stage_id:
          type: string
          format: uuid
        name:
          type: string
        count:
          type: integer
        value:
          type: number
          format: double
        weighted_value:
          type: number
          format: double
      required:
      - stage_id
      - name
      - count
      - value
    DealOverviewReport:
      type: object
      properties:
        currency:
          type: string
        totals:
          $ref: '#/components/schemas/DealTotals'
        value_brackets:
          type: array
          items:
            $ref: '#/components/schemas/DealValueBracket'
        by_owner:
          type: array
          items:
            $ref: '#/components/schemas/DealOwnerRow'
        by_stage:
          type: array
          items:
            $ref: '#/components/schemas/DealStageRow'
        created_per_period:
          type: array
          items:
            $ref: '#/components/schemas/PeriodCount'
      required:
      - currency
      - totals
      - value_brackets
      - by_owner
      - by_stage
      description: 'Deal Overview report: totals, deal-value histogram, owner table, stage table, deals created over time.'
    PeriodCount:
      type: object
      properties:
        period:
          type: string
          examples:
          - 2026-11
        count:
          type: integer
        value:
          type: number
          format: double
      required:
      - period
      - count
    DealOwnerOverviewReport:
      type: object
      properties:
        currency:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/DealOwnerRow'
        period:
          type: string
      required:
      - currency
      - owners
      description: 'Deal Owner Overview: one row per owner with created/won/lost/value/avg/time-to-close/tasks completed.'
    FunnelStage:
      type: object
      properties:
        stage_id:
          type: string
          format: uuid
        name:
          type: string
        sequence:
          type: integer
        entered:
          type: integer
          description: Deals that have ever been in this stage in the window
        current:
          type: integer
          description: Deals in the stage now
        value:
          type: number
          format: double
        progressed:
          type: integer
          description: Entered deals that moved to a later stage or won
        progression_pct:
          type: number
          format: float
          description: 0-100
        avg_days_in_stage:
          type: number
          format: float
        lost_from_stage:
          type: integer
      required:
      - stage_id
      - name
      - sequence
      - entered
      - current
      - progressed
      - progression_pct
    DealFunnelReport:
      type: object
      properties:
        pipeline_id:
          type: string
          format: uuid
        currency:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStage'
        won_count:
          type: integer
        won_value:
          type: number
          format: double
        lost_count:
          type: integer
        overall_conversion_pct:
          type: number
          format: float
          description: 0-100
      required:
      - pipeline_id
      - stages
      - won_count
      - lost_count
      - overall_conversion_pct
      description: 'Funnel report for one pipeline: stage-to-stage progression percentages and time in stage.'
    SalesPerformanceRow:
      allOf:
      - $ref: '#/components/schemas/OwnerRef'
      - type: object
        properties:
          stages:
            type: array
            items:
              $ref: '#/components/schemas/DealStageRow'
          won_count:
            type: integer
          won_value:
            type: number
            format: double
          lost_count:
            type: integer
    SalesPerformanceReport:
      type: object
      properties:
        pipeline_id:
          type: string
          format: uuid
        currency:
          type: string
        period:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/DealStageRow'
        owners:
          type: array
          items:
            $ref: '#/components/schemas/SalesPerformanceRow'
      required:
      - pipeline_id
      - stages
      - owners
      description: 'Sales Performance: deals by stage per owner (matrix), plus won/lost per owner.'
    ForecastBasis:
      type: string
      enum:
      - STAGE_PROBABILITY
      - DEAL_PROBABILITY
      - OPEN_VALUE
      description: 'How weighted value is computed: stage probability (Stage.probability), per-deal win probability (ML /
        manual), or unweighted open value'
    ForecastPeriod:
      type: object
      properties:
        period:
          type: string
        open_count:
          type: integer
        open_value:
          type: number
          format: double
        weighted_value:
          type: number
          format: double
        won_value:
          type: number
          format: double
        forecast:
          type: number
          format: double
        quota:
          type: number
          format: double
        deals:
          type: array
          items:
            $ref: '#/components/schemas/ForecastDeal'
      required:
      - period
      - open_count
      - open_value
      - weighted_value
      - won_value
      - forecast
    ForecastDeal:
      type: object
      properties:
        deal_id:
          type: string
          format: uuid
        title:
          type: string
        owner_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        value:
          type: number
          format: double
        probability:
          type: number
          format: float
          description: 0-100
        weighted_value:
          type: number
          format: double
        expected_close_date:
          type: string
          format: date
      required:
      - deal_id
      - title
      - value
      - probability
      - weighted_value
    DealForecastReport:
      type: object
      properties:
        pipeline_id:
          type: string
          format: uuid
        currency:
          type: string
        basis:
          $ref: '#/components/schemas/ForecastBasis'
        granularity:
          type: string
          enum:
          - WEEK
          - MONTH
          - QUARTER
        periods:
          type: array
          items:
            $ref: '#/components/schemas/ForecastPeriod'
        accuracy:
          type: array
          items:
            $ref: '#/components/schemas/ForecastAccuracyEntry'
        generated_at:
          type: string
          format: date-time
      required:
      - pipeline_id
      - basis
      - granularity
      - periods
      description: 'Deal Forecast: expected revenue per period bucketed by expected close date and weighted by the chosen
        basis; `accuracy` compares past forecasts with what closed.'
    SentimentCounts:
      type: object
      properties:
        positive:
          type: integer
        neutral:
          type: integer
        negative:
          type: integer
      required:
      - positive
      - neutral
      - negative
    TaskTotals:
      type: object
      properties:
        open:
          type: integer
        overdue:
          type: integer
        due_today:
          type: integer
        completed:
          type: integer
        completion_rate:
          type: number
          format: float
          description: 0-100
        avg_hours_to_complete:
          type: number
          format: float
      required:
      - open
      - overdue
      - completed
      - completion_rate
    TaskOwnerRow:
      allOf:
      - $ref: '#/components/schemas/OwnerRef'
      - $ref: '#/components/schemas/TaskTotals'
      - type: object
        properties:
          outcomes:
            $ref: '#/components/schemas/SentimentCounts'
    TaskTypeRow:
      allOf:
      - type: object
        properties:
          task_type_id:
            type: string
            format: uuid
          name:
            type: string
        required:
        - task_type_id
        - name
      - $ref: '#/components/schemas/TaskTotals'
    TaskOutcomeRow:
      type: object
      properties:
        outcome_id:
          type: string
          format: uuid
        label:
          type: string
        sentiment:
          type: string
          enum:
          - POSITIVE
          - NEUTRAL
          - NEGATIVE
        count:
          type: integer
      required:
      - outcome_id
      - label
      - sentiment
      - count
    TaskOverviewReport:
      type: object
      properties:
        totals:
          $ref: '#/components/schemas/TaskTotals'
        by_owner:
          type: array
          items:
            $ref: '#/components/schemas/TaskOwnerRow'
        by_type:
          type: array
          items:
            $ref: '#/components/schemas/TaskTypeRow'
        by_outcome:
          type: array
          items:
            $ref: '#/components/schemas/TaskOutcomeRow'
        completed_per_period:
          type: array
          items:
            $ref: '#/components/schemas/PeriodCount'
      required:
      - totals
      - by_owner
      - by_type
      - by_outcome
      description: 'Task Overview: load and completion per rep and per type, outcome sentiment per rep (crm/tasks outcomes).'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Reporting API Reference
  url: https://docs.rerp.com/crm/reporting/api-reference
