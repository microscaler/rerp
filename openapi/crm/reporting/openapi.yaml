      required:
      - client
      - opens
    EmailClientTrendsReport:
      type: object
      properties:
        total_opens:
          type: integer
        clients:
          type: array
          items:
            $ref: '#/components/schemas/EmailClientRow'
        by_family:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
      required:
      - total_opens
      - clients
    OpenTrendsReport:
      type: object
      properties:
        timezone:
          type: string
        by_weekday:
          type: array
          items:
            type: object
            properties:
              weekday:
                type: integer
                minimum: 0
                maximum: 6
                description: 0 = Monday
              opens:
                type: integer
        by_hour:
          type: array
          items:
            type: object
            properties:
              hour:
                type: integer
                minimum: 0
                maximum: 23
              opens:
                type: integer
      required:
      - by_weekday
      - by_hour
      description: 'When contacts open mail: counts per weekday and per hour of day, in the chosen timezone.'
    VariantRow:
      type: object
      properties:
        campaign_id:
          type: string
          format: uuid
        campaign_name:
          type: string
        sent_at:
          type: string
          format: date-time
        variant_id:
          type: string
          format: uuid
        variant_name:
          type: string
        sent:
          type: integer
        unique_opens:
          type: integer
        unique_clicks:
          type: integer
        click_to_open_rate:
          type: number
          format: float
          description: 0-100
        benchmark_click_to_open_rate:
          type: number
          format: float
          description: 0-100
      required:
      - campaign_id
      - variant_id
      - sent
    PredictiveContentReport:
      type: object
      properties:
        total_sent:
          type: integer
        total_unique_clicks:
          type: integer
        click_to_open_rate:
          type: number
          format: float
          description: 0-100
        sent_by_variant:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        clicks_by_variant:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        variants:
          type: array
          items:
            $ref: '#/components/schemas/VariantRow'
      required:
      - total_sent
      - total_unique_clicks
      - variants
    RevenueSourceRow:
      type: object
      properties:
        kind:
          type: string
          enum:
          - CAMPAIGN
          - AUTOMATION_MESSAGE
        id:
          type: string
          format: uuid
        name:
          type: string
        revenue:
          type: number
          format: double
        conversions:
          type: integer
      required:
      - kind
      - id
      - name
      - revenue
    MarketingRevenueReport:
      type: object
      properties:
        currency:
          type: string
        attribution_window_days:
          type: integer
        total_revenue:
          type: number
          format: double
        from_campaigns:
          type: number
          format: double
        from_automation_messages:
          type: number
          format: double
        series:
          type: array
          items:
            $ref: '#/components/schemas/NamedSeries'
        top_campaigns:
          type: array
          items:
            $ref: '#/components/schemas/RevenueSourceRow'
        top_automation_messages:
          type: array
          items:
            $ref: '#/components/schemas/RevenueSourceRow'
      required:
      - currency
      - attribution_window_days
      - total_revenue
      - from_campaigns
      - from_automation_messages
      description: Revenue from crm/marketing conversions with a value that occurred within `attribution_window_days` of a
        send, credited to that campaign or automation message (last touch).
    WidgetQuery:
      type: object
      properties:
        metric:
          type: string
          examples:
          - campaigns_sent
          - open_rate
          - click_rate
          - total_contacts
          - contacts_growth
          - automation_entries
          - tag_count
          - list_count
          - deals_won_value
        dimension:
          type: string
          description: Group-by (campaign, tag, list, automation, owner, period…); omit for a single number
        range:
          type: string
          enum:
          - LAST_7_DAYS
          - LAST_30_DAYS
          - LAST_90_DAYS
          - LAST_12_MONTHS
          - ALL_TIME
          - CUSTOM
        start_date:
          type: string
          format: date
        end_date:
          type: string
          format: date
        granularity:
          type: string
          enum:
          - DAY
          - WEEK
          - MONTH
        filters:
          type: object
        limit:
          type: integer
      required:
      - metric
      - range
    DashboardWidget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum:
          - NUMBER
          - NUMBERS
          - LINE
          - BAR
          - TABLE
        query:
          $ref: '#/components/schemas/WidgetQuery'
        prompt:
          type: string
          description: The natural-language ask the widget was built from, if any
        position:
          type: integer
        width:
          type: integer
          enum:
          - 1
          - 2
        schedule:
          $ref: '#/components/schemas/ReportSchedule'
        refreshed_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - kind
      - query
    Dashboard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - widgets
    DashboardRequest:
      type: object
      properties:
        name:
          type: string
        is_default:
          type: boolean
    WidgetRequest:
      type: object
      properties:
        title:
          type: string
        kind:
          type: string
          enum:
          - NUMBER
          - NUMBERS
          - LINE
          - BAR
          - TABLE
        query:
          $ref: '#/components/schemas/WidgetQuery'
        prompt:
          type: string
        position:
          type: integer
        width:
          type: integer
          enum:
          - 1
          - 2
    WidgetData:
      type: object
      properties:
        widget_id:
          type: string
          format: uuid
        refreshed_at:
          type: string
          format: date-time
        values:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        series:
          type: array
          items:
            $ref: '#/components/schemas/NamedSeries'
        rows:
          type: array
          items:
            type: object
      required:
      - widget_id
      - refreshed_at
    PaginatedDashboard:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Dashboard'
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Reporting API Reference
  url: https://docs.rerp.com/crm/reporting/api-reference
