  /reports/build:
    post:
      operationId: build_report
      summary: Build a custom report with filters
      tags:
      - reports
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReportBuildRequest'
            examples:
              default:
                name: Monthly Pipeline Report
                type: pipeline
                schedule: monthly
        description: Build a report with current filters and parameters
      responses:
        '200':
          description: Report results
          content:
            application/json:
              schema:
                type: object
                properties:
                  report_id:
                    type: string
                    format: uuid
                  data:
                    type: object
                  saved:
                    type: boolean
              examples:
                default:
                  report_id: 00000000-0000-0000-0000-000000000019
                  data:
                    total_opportunities: 50
                    total_revenue: 250000
                  saved: true
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              examples:
                default:
                  report_id: 00000000-0000-0000-0000-000000000019
                  data:
                    total_opportunities: 50
                    total_revenue: 250000
                  saved: true
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '400':
          description: Bad request - Invalid request body or parameters
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Build a custom report
      x-operation-id: post_build
      x-controller: rerp_crm::reporting::controller::reports::build
      x-handler-name: reports_build
  /reports/{id}:
