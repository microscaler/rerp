components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Page number for pagination (1-indexed)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      description: 'Maximum number of items per page (default: 20, max: 100)'
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Search query string for filtering resources
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier for the resource
  schemas:
    WeightedPipeline:
      type: object
      properties:
        by_team:
          type: array
          items:
            type: object
            properties:
              team_id:
                type: string
                format: uuid
              team_name:
                type: string
              count:
                type: integer
                format: int32
              weighted_revenue:
                type: number
                format: double
        by_user:
          type: array
          items:
            type: object
            properties:
              user_id:
                type: string
                format: uuid
              user_name:
                type: string
              weighted_revenue:
                type: number
                format: double
      required:
      - by_team
      - by_user
      description: Pipeline data with weighted values by stage
    ConversionRate:
      type: object
      properties:
        period:
          type: string
        leads_created:
          type: integer
          format: int32
        opportunities_created:
          type: integer
          format: int32
        opportunities_won:
          type: integer
          format: int32
        opportunities_lost:
          type: integer
          format: int32
        lead_to_opp_rate:
          type: number
          format: float
        opp_to_won_rate:
          type: number
          format: float
        overall_conversion_rate:
          type: number
          format: float
        total_won_revenue:
          type: number
          format: double
      required:
      - period
      - leads_created
      - opportunities_created
      - opportunities_won
      - opportunities_lost
      - lead_to_opp_rate
      - opp_to_won_rate
      - overall_conversion_rate
      - total_won_revenue
      description: Conversion rate analytics with breakdown by source
    FunnelData:
      type: object
      properties:
        stages:
          type: array
          items:
            type: object
            properties:
              name:
                type: string
              count:
                type: integer
                format: int32
              revenue:
                type: number
                format: double
              conversion_from_previous:
                type: number
                format: float
      required:
      - stages
      description: Sales funnel data showing conversion between stages
    RepPerformance:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
          type: string
        team_id:
          type: string
          format: uuid
        period:
          type: string
        leads_created:
          type: integer
          format: int32
        opportunities_active:
          type: integer
          format: int32
        opportunities_won:
          type: integer
          format: int32
        opportunities_lost:
          type: integer
          format: int32
        revenue_expected:
          type: number
          format: double
        revenue_won:
          type: number
          format: double
        weighted_pipeline:
          type: number
          format: double
        avg_deal_size:
          type: number
          format: double
        avg_sales_cycle_days:
          type: number
          format: float
        quota_attainment:
          type: number
          format: float
        activity_count:
          type: integer
          format: int32
      required:
      - user_id
      - user_name
      - team_id
      - period
      - leads_created
      - opportunities_active
      - opportunities_won
      - opportunities_lost
      - revenue_expected
      - revenue_won
      - weighted_pipeline
      - avg_deal_size
      - avg_sales_cycle_days
      - quota_attainment
      - activity_count
      description: Sales representative performance metrics
    TeamPerformance:
      type: object
      properties:
        team_id:
          type: string
          format: uuid
        team_name:
          type: string
        member_count:
          type: integer
          format: int32
        total_opportunities:
          type: integer
          format: int32
        total_revenue:
          type: number
          format: double
        weighted_revenue:
          type: number
          format: double
        win_rate:
          type: number
          format: float
      required:
      - team_id
      - team_name
      - member_count
      - total_opportunities
      - total_revenue
      - weighted_revenue
      - win_rate
      description: Team-level performance metrics
    WinLossAnalysis:
      type: object
      properties:
        period:
          type: string
        total_closed:
          type: integer
          format: int32
        won_count:
          type: integer
          format: int32
        lost_count:
          type: integer
          format: int32
        win_rate:
          type: number
          format: float
        revenue_won:
          type: number
          format: double
        lost_reasons:
          type: array
          items:
            type: object
            properties:
              reason_name:
                type: string
              count:
                type: integer
                format: int32
              percentage:
                type: number
                format: float
              revenue_impact:
                type: number
                format: double
      required:
      - period
      - total_closed
      - won_count
      - lost_count
      - win_rate
      - revenue_won
      - lost_reasons
      description: Win/loss analysis with breakdown by reason
    TimeToCloseAnalysis:
      type: object
      properties:
        overall_avg_days:
          type: number
          format: float
        by_stage:
          type: array
          items:
            type: object
            properties:
              stage_name:
                type: string
                avg_days:
                  type: number
                  format: float
        by_source:
          type: array
          items:
            type: object
            properties:
              source_name:
                type: string
              avg_days:
                type: number
                format: float
      required:
      - overall_avg_days
      - by_stage
      - by_source
      description: Time-to-close analysis by pipeline stage
    ForecastEntry:
      type: object
      properties:
        period:
          type: string
          description: Month/quarter string (e.g., "2026-06")
        weighted_pipeline:
          type: number
          format: double
        expected_close_revenue:
          type: number
          format: double
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
        actual_close_revenue:
          type: number
          format: double
        variance:
          type: number
          format: double
      required:
      - period
      - weighted_pipeline
      - expected_close_revenue
      - confidence
      - actual_close_revenue
      - variance
      description: A single forecast entry for a period
    ReportBuildRequest:
      type: object
      required:
      - type
      properties:
        type:
          type: string
          enum:
          - PIPELINE
          - CONVERSION
          - PERFORMANCE
          - WIN_LOSS
          - FORECAST
          - CUSTOM
        filters:
          type: object
          description: Filter criteria
        group_by:
          type: array
          items:
            type: string
        saved:
          type: boolean
          default: false
      description: Request body for building a report with filters and groupings
    SavedReport:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        type:
          type: string
        filters:
          type: object
        data:
          type: object
        created_at:
          type: string
          format: date-time
      required:
      - name
      - type
      description: Saved report with configuration and cached results
    ReportScheduleRequest:
      type: object
      required:
      - frequency
      - recipient_ids
      properties:
        frequency:
          type: string
          enum:
          - DAILY
          - WEEKLY
          - MONTHLY
        recipient_ids:
          type: array
          items:
            type: string
            format: uuid
        schedule:
          type: string
          description: Cron expression
      description: Request body for scheduling a report
    ReportSchedule:
      type: object
      properties:
        id:
          type: string
          format: uuid
        report_id:
          type: string
          format: uuid
        frequency:
          type: string
        recipient_ids:
          type: array
          items:
            type: string
            format: uuid
        is_active:
          type: boolean
        last_sent:
          type: string
          format: date-time
      required:
      - report_id
      - frequency
      - recipient_ids
      - is_active
      - last_sent
      description: Schedule configuration for automated report generation
    PaginatedResponse:
      type: object
      required:
      - total
      - page
      - limit
      properties:
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
      description: A generic paginated response wrapper with items and pagination metadata
    ErrorResponse:
      type: object
      required:
      - code
      - message
      properties:
        code:
          type: integer
          format: int32
          description: HTTP error code
        message:
          type: string
          description: Human-readable error message
        details:
          type: string
          description: Additional error details
      description: An error response with code, message, and optional details
    PaginatedPipelinesummary:
      type: object
      required:
      - total_opportunities
      - total_revenue
      - total_weighted_revenue
      - stages
      properties:
        total_opportunities:
          type: integer
          format: int32
        total_revenue:
          type: number
          format: double
        total_weighted_revenue:
          type: number
          format: double
        stages:
          type: array
          items:
            type: object
            properties:
              stage_id:
                type: string
                format: uuid
              stage_name:
                type: string
              count:
                type: integer
                format: int32
              total_revenue:
                type: number
                format: double
              weighted_revenue:
                type: number
                format: double
              avg_days_in_stage:
                type: number
                format: float
      description: Paginated list of PipelineSummary records
    PaginatedConversionrate:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ConversionRate'
      description: Paginated list of ConversionRate records
    PaginatedForecastentry:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/ForecastEntry'
      description: Paginated list of ForecastEntry records
    LeadSourceReport:
      type: object
      required:
      - source_id
      - source_name
      - lead_count
      - opportunities
      - won_deals
      - revenue
      - win_rate
      properties:
        source_id:
          type: string
          format: uuid
        source_name:
          type: string
        lead_count:
          type: integer
          format: int32
        opportunities:
          type: integer
          format: int32
        won_deals:
          type: integer
          format: int32
        revenue:
          type: number
          format: double
        win_rate:
          type: number
          format: float
      description: Lead source attribution report with counts by channel
    LeaderboardEntry:
      type: object
      required:
      - user_id
      - user_name
      - rank
      - value
      properties:
        user_id:
          type: string
          format: uuid
        user_name:
