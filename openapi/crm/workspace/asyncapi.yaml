      workspaceCreated:
        $ref: '#/components/messages/workspaceCreated'
      memberChanged:
        $ref: '#/components/messages/memberChanged'
  from_every_service:
    address: crm.<service>.v1
    title: crm.<service>.v1
    description: Subscription `workspace-all` (with a dead-letter topic) filtered on the event types below.
    messages:
      erasureCompleted:
        $ref: '#/components/messages/erasureCompleted'
operations:
  publish:
    action: send
    channel:
      $ref: '#/channels/published'
    summary: crm/workspace publishes its events
    messages:
