components:
  schemas:
    Lead:
      type: object
      required:
        - id
        - name
        - type
        - create_date
        - active
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        type:
          type: string
          enum:
            - LEAD
            - OPPORTUNITY
          description: LEAD = qualification, OPPORTUNITY = pipeline
        email_from:
          type: string
          format: email
          maxLength: 255
        email_normalized:
          type: string
          maxLength: 255
        phone:
          type: string
          maxLength: 64
        phone_sanitized:
          type: string
          maxLength: 64
        mobile:
          type: string
          maxLength: 64
        title:
          type: string
          enum:
            - MR
            - MRS
            - MME
          description: Salutation
        function:
          type: string
          maxLength: 128
        contact_name:
          type: string
          maxLength: 255
        company_name:
          type: string
          maxLength: 255
        website:
          type: string
          format: uri
          maxLength: 255
        description:
          type: string
        referred_by:
          type: string
          maxLength: 255
        priority:
          type: string
          enum:
            - LOW
            - NORMAL
            - HIGH
            - URGENT
        active:
          type: boolean
        is_blacklisted:
          type: boolean
        color:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        stage_id:
          type: string
          format: uuid
          description: Current pipeline stage
        tag_ids:
          type: array
          items:
            type: string
            format: uuid
        probability:
          type: number
          format: float
          minimum: 0
          maximum: 100
        automated_probability:
          type: number
          format: float
          minimum: 0
          maximum: 100
        is_automated_probability:
          type: boolean
        date_deadline:
          type: string
          format: date
        date_open:
          type: string
          format: date-time
          readOnly: true
        date_closed:
          type: string
          format: date-time
          readOnly: true
        date_last_stage_update:
          type: string
          format: date-time
          readOnly: true
        day_open:
          type: number
          format: float
          readOnly: true
        day_close:
          type: number
          format: float
          readOnly: true
        expected_revenue:
          type: number
          format: double
