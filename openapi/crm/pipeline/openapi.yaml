openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: Pipeline
  version: v1.0.0
  description: Pipeline service - pipelines and stages, deals (contacts with roles, notes, files, activity, 1:1 email), leads
    (the earlier Odoo-shaped lead model, still served), lead conversion, pipeline summary.
  x-api-version: CRM Pipeline API v1.0.0
  x-crm-api-version: v1.0.0
  termsOfService: https://rerp.example.com/terms
  contact:
    name: RERP API Support
    url: https://docs.rerp.com/support
    email: api-support@rerp.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-api-docs:
    service: pipeline
    openapi_version: 3.1.0
    brrtrouter_version: latest
servers:
  - url: http://localhost:10352/api/v1/crm/pipeline
    description: Local development (direct to service, port from port-registry)
  - url: /api/v1/crm/pipeline
    description: Pipeline API
tags:
  - name: lead-conversion
    description: Lead-to-contact/account conversion
  - name: lead-deduplication
    description: Lead duplicate detection and merge
  - name: lead-stages
    description: Lead stage transitions
  - name: leads
    description: Lead and opportunity lifecycle
  - name: pipeline-analytics
    description: Pipeline summary and weighted forecasting
  - name: pipeline-stage
    description: Pipeline stage definitions
  - name: stages
    description: Pipeline stage management
  - name: pipelines
    description: Pipelines, their summary and settings
  - name: deals
    description: 'Deals: contacts and roles, stage and status, notes, files, activity, 1:1 email'
  - name: deal-roles
    description: Roles a contact plays on a deal
paths:
  /leads:
    get:
      operationId: list_leads
      summary: List leads and opportunities
      tags:
        - leads
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 20
        - name: search
          in: query
          schema:
            type: string
        - name: filter_type
          in: query
          schema:
            type: string
            enum:
              - LEAD
              - OPPORTUNITY
        - name: filter_stage_id
          in: query
          schema:
            type: string
            format: uuid
        - name: filter_user_id
          in: query
          schema:
            type: string
            format: uuid
        - name: filter_team_id
          in: query
          schema:
            type: string
            format: uuid
        - name: filter_probability_gt
          in: query
          schema:
            type: number
            format: float
        - name: filter_active
          in: query
          schema:
            type: boolean
        - name: filter_won_status
          in: query
          schema:
            type: string
            enum:
              - PENDING
              - WON
              - LOST
      responses:
        '200':
          description: List of leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedLead'
              examples:
                default:
                  items:
                    - id: 00000000-0000-0000-0000-000000000001
                      name: John Doe
                      email: john@example.com
                      phone: +1-555-0123
                      company: Acme Corp
                      status: new
                      stage: discovery
                      score: 45
                      source: website
                      assigned_to: 00000000-0000-0000-0000-000000000010
                      created_at: '2024-01-15T10:30:00Z'
                      updated_at: '2024-01-15T10:30:00Z'
                      properties: {}
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '404':
          description: Resource not found
      security:
        - bearerAuth: []
      description: Get leads associated with a campaign
      x-operation-id: get_leads_list
      x-controller: rerp_crm::pipeline::controller::leads
      x-handler-name: leads
    post:
      operationId: create_lead
      summary: Create a new lead or opportunity
      tags:
        - leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateLeadRequest'
            examples:
              default:
                name: John Doe
                email: john@example.com
                phone: +1-555-0123
                company: Acme Corp
                source: website
        description: Create a new lead
      responses:
        '201':
          description: Lead created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000001
                  name: John Doe
                  email: john@example.com
                  phone: +1-555-0123
                  company: Acme Corp
                  status: new
                  stage: discovery
                  score: 45
                  source: website
                  assigned_to: 00000000-0000-0000-0000-000000000010
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
                  properties: {}
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
      security:
        - bearerAuth: []
      description: Get leads associated with a campaign
      x-operation-id: post_leads_list
      x-controller: rerp_crm::pipeline::controller::leads
      x-handler-name: leads
  /leads/{id}:
    get:
      operationId: get_lead
      summary: Get lead by id
      tags:
        - leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Lead details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000001
                  name: John Doe
                  email: john@example.com
                  phone: +1-555-0123
                  company: Acme Corp
                  status: new
                  stage: discovery
                  score: 45
                  source: website
                  assigned_to: 00000000-0000-0000-0000-000000000010
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
                  properties: {}
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
        - bearerAuth: []
      description: Get leads by ID
      x-operation-id: get_id_by_id
      x-controller: rerp_crm::pipeline::controller::leads::id
      x-handler-name: leads_id
    put:
      operationId: update_lead
      summary: Update lead fields
      tags:
        - leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateLeadRequest'
            examples:
              default:
                name: John Doe
                email: john@example.com
                phone: +1-555-0123
                company: Acme Corp
                source: website
        description: Update an existing lead
      responses:
        '200':
          description: Lead updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000001
                  name: John Doe
                  email: john@example.com
                  phone: +1-555-0123
                  company: Acme Corp
                  status: new
                  stage: discovery
                  score: 45
                  source: website
                  assigned_to: 00000000-0000-0000-0000-000000000010
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
                  properties: {}
        '400':
          description: Invalid request
        '404':
          description: Not found
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Resource updated successfully
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
        - bearerAuth: []
      x-brrtrouter-impl: true
      description: Update leads by ID
      x-operation-id: put_id_by_id
      x-controller: rerp_crm::pipeline::controller::leads::id
      x-handler-name: leads_id
    delete:
      operationId: delete_lead
      summary: Soft-delete lead
      tags:
        - leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Lead deleted
        '404':
          description: Not found
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
        - bearerAuth: []
      description: Delete leads by ID
      x-operation-id: delete_id_by_id
      x-controller: rerp_crm::pipeline::controller::leads::id
      x-handler-name: leads_id
  /leads/{id}/stage:
    patch:
      operationId: change_stage
      summary: Move lead to a new pipeline stage
      tags:
        - leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StageChangeRequest'
            examples:
              default:
                name: Discovery
                order: 1
                pipeline_id: 00000000-0000-0000-0000-000000000005
        description: Change lead to a new pipeline stage
      responses:
        '200':
          description: Lead stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Lead'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000001
                  name: John Doe
                  email: john@example.com
                  phone: +1-555-0123
                  company: Acme Corp
                  status: new
                  stage: discovery
                  score: 45
                  source: website
                  assigned_to: 00000000-0000-0000-0000-000000000010
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
                  properties: {}
        '400':
          description: Invalid stage transition
        '404':
          description: Not found
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Resource updated successfully
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
        - bearerAuth: []
      x-brrtrouter-impl: true
      description: Partially update leads by ID
      x-operation-id: patch_stage_by_id
      x-controller: rerp_crm::pipeline::controller::leads::id::stage
      x-handler-name: leads_id_stage
  /leads/{id}/convert:
    post:
      operationId: convert_lead
      summary: 'Convert a lead: it crosses into RERP as a customer'
      tags:
        - leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        description: Why the lead converted, and the billing details RERP needs
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConvertLeadRequest'
      responses:
        '202':
          description: 'Converted: the conversion is published and the lead marked converted'
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConversionResult'
        '400':
          description: Invalid billing details or reason
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '403':
          description: Forbidden - the token lacks crm.editor
        '404':
          description: Lead not found
        '503':
          description: Conversion could not be published; nothing was marked, safe to retry
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-brrtrouter-impl: true
      description: Marks the lead won and publishes a signed conversion to RERP (ADR 003). Only a converted customer crosses
        from the marketing funnel; RERP creates the customer (a CRM account) when it pulls the conversion, so the crossing
        is asynchronous. Converting the same lead again republishes the same conversion and creates nothing new.
      x-operation-id: post_leads_convert
      x-controller: rerp_crm::pipeline::controller::leads::id::convert
      x-handler-name: leads_id_convert
  /leads/detect-duplicates:
    post:
      operationId: detect_duplicates
      summary: Detect duplicate leads by email/phone/name
      tags:
        - leads
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DuplicateDetectionRequest'
        description: Check for duplicate leads
      responses:
        '200':
          description: Duplicate lead IDs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DuplicateDetectionResult'
              examples:
                default:
                  lead_id: 00000000-0000-0000-0000-000000000001
                  duplicates_found: 2
                  duplicate_ids:
                    - 00000000-0000-0000-0000-000000000030
                    - 00000000-0000-0000-0000-000000000031
                  confidence: 0.92
        '400':
          description: Invalid request
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              examples:
                default:
                  is_duplicate: true
                  matches:
                    - id: 00000000-0000-0000-0000-000000000004
                      confidence: 0.95
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Not found
        '409':
          description: Conflict - resource conflict or cannot complete action
      security:
        - bearerAuth: []
      description: Create a new leads
      x-operation-id: post_detect-duplicates
      x-controller: rerp_crm::pipeline::controller::leads::detect-duplicates
      x-handler-name: leads_detect-duplicates
  /leads/{id}/merge:
    post:
      operationId: merge_leads
      summary: Merge two leads (keep one, archive other, combine data)
      tags:
        - leads
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeLeadsRequest'
            examples:
              default:
                name: John Doe
                email: john@example.com
                phone: +1-555-0123
                company: Acme Corp
                source: website
        description: Merge duplicate leads
      responses:
        '200':
          description: Merge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
              examples:
                default:
                  primary_id: 00000000-0000-0000-0000-000000000002
                  merged_from:
                    - 00000000-0000-0000-0000-000000000032
                    - 00000000-0000-0000-0000-000000000033
                  fields_merged:
                    - email
                    - phone
                    - company
        '400':
          description: Invalid request
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              examples:
                default:
                  success: true
                  kept_id: 00000000-0000-0000-0000-000000000001
                  merged_id: 00000000-0000-0000-0000-000000000004
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Not found
        '409':
          description: Conflict - resource conflict or cannot complete action
      security:
        - bearerAuth: []
      description: Perform an action on leads
      x-operation-id: post_leads_merge
      x-controller: rerp_crm::pipeline::controller::leads::id::merge
      x-handler-name: leads_id_merge
  /pipeline/summary:
    get:
      operationId: pipeline_summary
      summary: Get pipeline summary grouped by stage
      tags:
        - leads
      parameters:
        - name: team_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Pipeline summary
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPipelineSummary'
              examples:
                default:
                  items:
                    - total_leads: 150
                      stage_breakdown:
                        discovery: 45
                        qualified: 35
                        proposal: 25
                        negotiation: 30
                      weighted_value: 375000
                      forecast: 420000
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
        - bearerAuth: []
      description: List all pipeline
      x-operation-id: get_summary
      x-controller: rerp_crm::pipeline::controller::pipeline::summary
      x-handler-name: pipeline_summary
  /stages:
    get:
      operationId: list_stages
      summary: List pipeline stages ordered by sequence
      tags:
        - stages
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - name: filter_team_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of stages
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedStage'
              examples:
                default:
                  items:
                    - id: 00000000-0000-0000-0000-000000000004
                      name: Discovery
                      order: 1
                      pipeline_id: 00000000-0000-0000-0000-000000000005
                      created_at: '2024-01-15T10:30:00Z'
                      updated_at: '2024-01-15T10:30:00Z'
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          description: Unauthorized
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
        - bearerAuth: []
      description: List all stages
      x-operation-id: get_stages_list
      x-controller: rerp_crm::pipeline::controller::stages
      x-handler-name: stages
    post:
      operationId: create_stage
      summary: Create a new pipeline stage
      tags:
        - stages
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateStageRequest'
            examples:
              default:
                name: Discovery
                order: 1
                pipeline_id: 00000000-0000-0000-0000-000000000005
        description: Create a new pipeline stage
      responses:
        '201':
          description: Stage created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000004
                  name: Discovery
                  order: 1
                  pipeline_id: 00000000-0000-0000-0000-000000000005
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          description: Invalid request
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Not found
      security:
        - bearerAuth: []
      description: Create a new stages
      x-operation-id: post_stages_list
      x-controller: rerp_crm::pipeline::controller::stages
      x-handler-name: stages
  /stages/{id}:
    get:
      operationId: get_stage
      summary: Get stage by id
      tags:
        - stages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Stage details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000004
                  name: Discovery
                  order: 1
                  pipeline_id: 00000000-0000-0000-0000-000000000005
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
        - bearerAuth: []
      description: Get stages by ID
      x-operation-id: get_id_by_id
      x-controller: rerp_crm::pipeline::controller::stages::id
      x-handler-name: stages_id
    put:
      operationId: update_stage
      summary: Update stage fields
      tags:
        - stages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateStageRequest'
            examples:
              default:
                name: Discovery
                order: 1
                pipeline_id: 00000000-0000-0000-0000-000000000005
        description: Update a pipeline stage
      responses:
        '200':
          description: Stage updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Stage'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000004
                  name: Discovery
                  order: 1
                  pipeline_id: 00000000-0000-0000-0000-000000000005
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          description: Invalid request
        '404':
          description: Not found
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Resource updated successfully
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
        - bearerAuth: []
      description: Update stages by ID
      x-operation-id: put_id_by_id
      x-controller: rerp_crm::pipeline::controller::stages::id
      x-handler-name: stages_id
    delete:
      operationId: delete_stage
      summary: Delete stage (only if no leads in it)
      tags:
        - stages
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '204':
          description: Stage deleted
        '404':
          description: Not found
        '409':
          description: Stage is in use
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
