    ConversionAddress:
      type: object
      additionalProperties: false
      required:
        - line1
        - city
        - country
      properties:
        line1:
          type: string
          minLength: 1
          maxLength: 200
        line2:
          type: string
          minLength: 1
          maxLength: 200
        city:
          type: string
          minLength: 1
          maxLength: 100
        postal_code:
          type: string
          minLength: 1
          maxLength: 20
        region:
          type: string
          minLength: 1
          maxLength: 100
        country:
          type: string
          pattern: ^[A-Z]{2}$
          description: ISO 3166-1 alpha-2
      description: Billing address
    ConversionCustomer:
      type: object
      additionalProperties: false
      required:
        - name
        - email
        - address
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
          description: Legal or company name (a person for an individual)
        contact_name:
          type: string
          minLength: 1
          maxLength: 200
        email:
          type: string
          minLength: 3
          maxLength: 254
          format: email
          description: Billing email
        phone:
          type: string
          minLength: 1
          maxLength: 40
          description: Phone, as the customer gave it
        address:
          $ref: '#/components/schemas/ConversionAddress'
        tax_id:
          type: string
          minLength: 1
          maxLength: 50
          description: VAT or tax id, when known
      description: The billing details that cross into RERP
    DealStatus:
      type: string
      enum:
        - OPEN
        - WON
        - LOST
    Pipeline:
      type: object
      required:
        - id
        - name
        - currency
        - created_at
      description: 'A pipeline (AC: deal group): its own stages, currency, visibility and auto-assignment. Won and Lost are
        statuses, not stages.'
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        currency:
          type: string
          minLength: 3
          maxLength: 3
        visibility:
          type: string
          enum:
            - ALL
            - GROUPS
          default: ALL
        group_ids:
          type: array
          items:
            type: string
            format: uuid
          description: crm/teams groups that see it when visibility is GROUPS
        auto_assign:
          type: string
          enum:
            - 'OFF'
            - ROUND_ROBIN
            - BY_STAGE
          default: 'OFF'
        auto_assign_user_ids:
          type: array
          items:
            type: string
        forecast_mode:
          type: string
          enum:
            - STAGE_PROBABILITY
            - LEARNED
          default: STAGE_PROBABILITY
          description: LEARNED needs enough closed deals (win-probability model); until then the service reports NOT_ENOUGH_DATA
            and falls back
        sequence:
          type: integer
          format: int32
        open_deals:
          type: integer
          format: int64
          readOnly: true
        open_value:
          type: number
          format: double
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    PipelineRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        currency:
          type: string
        visibility:
          type: string
          enum:
            - ALL
            - GROUPS
        group_ids:
          type: array
          items:
            type: string
            format: uuid
        auto_assign:
          type: string
          enum:
            - 'OFF'
            - ROUND_ROBIN
            - BY_STAGE
        auto_assign_user_ids:
          type: array
          items:
            type: string
        forecast_mode:
          type: string
          enum:
            - STAGE_PROBABILITY
            - LEARNED
        sequence:
          type: integer
          format: int32
        clone_stages_from:
          type: string
          format: uuid
          description: Copy another pipeline's stages on create
