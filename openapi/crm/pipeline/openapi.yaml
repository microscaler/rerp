          type: number
          format: double
          readOnly: true
        recurring_revenue:
          type: number
          format: double
        recurring_plan_id:
          type: string
          format: uuid
        recurring_revenue_monthly:
          type: number
          format: double
          readOnly: true
        partner_id:
          type: string
          format: uuid
          description: Linked contact record
        company_id:
          type: string
          format: uuid
          description: Parent company/account
        user_id:
          type: string
          format: uuid
          description: Assigned salesperson
        team_id:
          type: string
          format: uuid
          description: Sales team
        campaign_id:
          type: string
          format: uuid
        medium_id:
          type: string
          format: uuid
        source_id:
          type: string
          format: uuid
