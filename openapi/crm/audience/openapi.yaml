  /contacts/import:
    post:
      operationId: import_contacts
      summary: Bulk import from CSV
      description: 'Multipart CSV with a column mapping. Rows are validated and deduplicated by email; the response is a job
        the client polls. Consent for list subscription is recorded as IMPORT with the stated source.


        Publishes `contact.created` on `crm.audience.v1`.'
      tags:
      - contacts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - mapping
              properties:
                file:
                  type: string
                  format: binary
                mapping:
                  type: string
                  description: JSON object column -> contact field or custom field key
                tag_names:
                  type: string
                  description: JSON array of tags to add to every imported contact
                list_id:
                  type: string
                  format: uuid
                consent_note:
                  type: string
                update_existing:
                  type: boolean
      responses:
        '202':
          description: Import job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
              example:
                id: 44f5daeb-faac-5a53-81fb-ac8b5f267d2c
