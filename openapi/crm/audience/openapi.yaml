openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Audience
  version: v1.0.0
  description: 'Who we can reach: contacts with custom field values, organisations (prospect companies), tags, segments and
    the shared condition tree, lists, subscriptions with their consent history, suppressions, notes, the contact timeline
    and bulk jobs. Owns every "can we contact this person?" fact. Admits confirmed sign-ups from crm/intake (ADR 004).'
  x-api-docs:
    service: audience
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/audience
  description: Local development (port from port-registry)
- url: /api/v1/crm/audience
  description: CRM Audience API
tags:
- name: bulk-jobs
  description: Bulk jobs
- name: contacts
  description: Contact CRUD
- name: lists
  description: Mailing lists and their subscription state
- name: organisations
  description: Organisations
- name: segments
  description: Saved condition trees that select contacts
- name: subscriptions
  description: Contact x list subscription state and consent history
- name: suppressions
  description: Addresses that must never be sent to
- name: tags
  description: Tags on contacts
paths:
  /bulk-jobs:
    get:
      operationId: list_bulk_jobs
      summary: Bulk jobs, newest first
      tags:
      - bulk-jobs
      responses:
        '200':
          description: Page of bulk jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Id'
      x-brrtrouter-impl: true
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: create_bulk_job
      summary: Change many contacts at once
      tags:
      - bulk-jobs
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: Runs in the background on a segment or an explicit list of contacts.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkJobRequest'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /bulk-jobs/{id}/undo:
    post:
      operationId: undo_bulk_job
      summary: Undo a bulk job
      tags:
      - bulk-jobs
      responses:
        '202':
          description: Undo accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: Restores the before-values. 409 when the job is not undoable or older than 7 days.
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /contacts:
    get:
      operationId: list_contacts
      summary: List contacts
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        schema:
          type: string
      - name: filter_company_id
        in: query
        schema:
          type: string
          format: uuid
      - name: filter_parent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: filter_email
        in: query
        schema:
          type: string
          format: email
      - name: filter_active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: List all contacts
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: create_contact
      summary: Create a new contact
      tags:
      - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
            examples:
              default:
                first_name: Jane
                last_name: Smith
                email: jane@example.com
                phone: +1-555-0124
                title: Marketing Director
                account_id: 00000000-0000-0000-0000-000000000003
        description: Create a new contact person
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000002
                  first_name: Jane
                  last_name: Smith
                  email: jane@example.com
                  phone: +1-555-0124
                  title: Marketing Director
                  account_id: 00000000-0000-0000-0000-000000000003
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /contacts/counts:
    get:
      operationId: get_contact_counts
      summary: Contact counts for the aside
      tags:
      - contacts
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactCountsSummary'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /contacts/export:
    post:
      operationId: export_contacts
      summary: Export contacts matching a segment as CSV
      tags:
      - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segment_id:
                  type: string
                  format: uuid
                conditions:
                  type: object
                fields:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Export job started; the job carries the download URL when done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /contacts/import:
    post:
      operationId: import_contacts
      summary: Bulk import from CSV
      description: Multipart CSV with a column mapping. Rows are validated and deduplicated by email; the response is a job
        the client polls. Consent for list subscription is recorded as IMPORT with the stated source.
      tags:
      - contacts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - mapping
              properties:
                file:
                  type: string
                  format: binary
                mapping:
                  type: string
                  description: JSON object column -> contact field or custom field key
                tag_names:
                  type: string
                  description: JSON array of tags to add to every imported contact
                list_id:
                  type: string
                  format: uuid
                consent_note:
                  type: string
                update_existing:
                  type: boolean
      responses:
        '202':
          description: Import job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /contacts/import/{id}:
    get:
      operationId: get_import_job
      summary: Import job progress
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /contacts/merge:
    post:
      operationId: merge_contacts
      summary: Merge two contacts (keep one, delete other, update references)
      tags:
      - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeContactsRequest'
            examples:
              default:
                first_name: Jane
                last_name: Smith
                email: jane@example.com
                phone: +1-555-0124
                title: Marketing Director
                account_id: 00000000-0000-0000-0000-000000000003
        description: Merge two duplicate contacts, keeping the better data
      responses:
        '200':
          description: Merge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
              examples:
                default:
                  primary_id: 00000000-0000-0000-0000-000000000002
                  merged_from:
                  - 00000000-0000-0000-0000-000000000032
                  - 00000000-0000-0000-0000-000000000033
                  fields_merged:
                  - email
                  - phone
                  - company
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              examples:
                default:
                  success: true
                  kept_id: 00000000-0000-0000-0000-000000000001
                  merged_id: 00000000-0000-0000-0000-000000000002
        '401':
          $ref: '#/components/responses/Unauthorized'
        '409':
          $ref: '#/components/responses/Conflict'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /contacts/search-by-email:
    get:
      operationId: search_contacts_by_email
      summary: Find contacts matching an email address
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Matching contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContactPage'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Search contacts by email address
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /contacts/{id}:
    get:
      operationId: get_contact
      summary: Get contact by id
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000002
                  first_name: Jane
                  last_name: Smith
                  email: jane@example.com
                  phone: +1-555-0124
                  title: Marketing Director
                  account_id: 00000000-0000-0000-0000-000000000003
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Get contacts by ID
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    put:
      operationId: update_contact
      summary: Update contact fields
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
            examples:
              default:
                first_name: Jane
                last_name: Smith
                email: jane@example.com
                phone: +1-555-0124
                title: Marketing Director
                account_id: 00000000-0000-0000-0000-000000000003
        description: Update an existing contact
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000002
                  first_name: Jane
                  last_name: Smith
                  email: jane@example.com
                  phone: +1-555-0124
                  title: Marketing Director
                  account_id: 00000000-0000-0000-0000-000000000003
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Resource updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Update contacts by ID
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
    delete:
      operationId: delete_contact
      summary: Soft-delete contact
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Contact deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Delete contacts by ID
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
    patch:
      operationId: patch_contact
      summary: Update some of a contact's fields
      tags:
      - contacts
      responses:
        '200':
          description: Updated contact
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: Only the fields sent change; the change is audited with before and after values.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
  /contacts/{id}/accounts:
    get:
      operationId: get_contact_accounts
      summary: Get accounts associated with a contact
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Related accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OrganisationPage'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  limit: 20
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Get contacts by ID
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /contacts/{id}/activity:
    get:
      operationId: get_contact_activity
      summary: The contact's timeline
      description: Merged, newest first, from every CRM service - sends and opens (outreach), enrolment steps (automation),
        form submissions and page views (marketing), stage changes (pipeline), notes and tag changes.
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: kinds
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActivityKind'
        style: form
        explode: false
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivity'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /contacts/{id}/notes:
    post:
      operationId: add_contact_note
      summary: Add a note to the timeline
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
