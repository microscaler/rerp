components:
  schemas:
    Activity:
      type: object
      required:
      - id
      - contact_id
      - kind
      - at
      - summary
      properties:
        id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ActivityKind'
        at:
          type: string
          format: date-time
        summary:
          type: string
          description: One line for the timeline
        actor:
          type: string
          description: Staff user id, workflow id, 'contact' or 'system'
        ref_service:
          type: string
          description: Which CRM service owns the underlying record
        ref_id:
          type: string
          format: uuid
        data:
          type: object
          description: Kind-specific detail (template name, link url, form fields, from/to stage)
    ActivityKind:
      type: string
      enum:
      - MESSAGE_SENT
      - MESSAGE_OPENED
      - MESSAGE_CLICKED
      - MESSAGE_BOUNCED
      - UNSUBSCRIBED
      - SUBSCRIBED
      - FORM_SUBMITTED
      - PAGE_VIEW
      - SITE_EVENT
      - WORKFLOW_ENTERED
      - WORKFLOW_STEP
      - WORKFLOW_ENDED
      - TAG_ADDED
      - TAG_REMOVED
