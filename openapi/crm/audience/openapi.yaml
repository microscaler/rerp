components:
  schemas:
    Activity:
      type: object
      required:
      - id
      - contact_id
      - kind
      - at
      - summary
      properties:
        id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ActivityKind'
        at:
          type: string
          format: date-time
        summary:
          type: string
          description: One line for the timeline
        actor:
          type: string
          description: Staff user id, workflow id, 'contact' or 'system'
        ref_service:
          type: string
          description: Which CRM service owns the underlying record
        ref_id:
          type: string
          format: uuid
        data:
          type: object
          description: Kind-specific detail (template name, link url, form fields, from/to stage)
    ActivityKind:
      type: string
      enum:
      - MESSAGE_SENT
      - MESSAGE_OPENED
      - MESSAGE_CLICKED
      - MESSAGE_BOUNCED
      - UNSUBSCRIBED
      - SUBSCRIBED
      - FORM_SUBMITTED
      - PAGE_VIEW
      - SITE_EVENT
      - WORKFLOW_ENTERED
      - WORKFLOW_STEP
      - WORKFLOW_ENDED
      - TAG_ADDED
      - TAG_REMOVED
      - FIELD_CHANGED
      - SCORE_CHANGED
      - DEAL_CREATED
      - DEAL_STAGE_CHANGED
      - NOTE
      - CHAT
    BulkJob:
      type: object
      properties:
        id:
          type: string
          format: uuid
        label:
          type: string
        action:
          $ref: '#/components/schemas/BulkJobAction'
        value:
          type: string
        field_key:
          type: string
        list_id:
          type: string
          format: uuid
        segment_id:
          type: string
          format: uuid
        contacts:
          type: integer
          format: int64
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - DONE
          - FAILED
          - UNDONE
        by:
          type: string
          description: Who started it
        undoable:
          type: boolean
        undo_until:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
      required:
      - id
      - action
      - status
      - created_at
      description: A change applied to many contacts at once; the before-values are kept so it can be undone for 7 days.
    BulkJobAction:
      type: string
      enum:
      - ADD_TAG
      - REMOVE_TAG
      - SUBSCRIBE
      - UNSUBSCRIBE
      - SET_FIELD
      - ARCHIVE
    BulkJobPage:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/BulkJob'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    Channel:
      type: string
      enum:
      - EMAIL
      - SMS
      - WHATSAPP
      description: Delivery channel. EMAIL is delivered; SMS and WHATSAPP need a provider adapter.
    Condition:
      type: object
      required:
      - subject
      - operator
      properties:
        subject:
          type: string
          description: 'What is tested: field:<name>, custom:<key>, tag, list:<id>, score, engagement:opened:<days>,

            engagement:clicked:<days>, engagement:any:<days>, deal:stage, deal:value, site:visited:<path>,

            event:<name>, form:<id>, created_at, last_activity_at, timezone, country

            '
        operator:
          type: string
          enum:
          - EQ
          - NEQ
          - CONTAINS
          - NOT_CONTAINS
          - STARTS_WITH
          - GT
          - GTE
          - LT
          - LTE
          - IN
          - NOT_IN
          - IS_SET
          - IS_NOT_SET
          - HAS
          - HAS_NOT
          - BEFORE
          - AFTER
          - WITHIN_DAYS
          - NOT_WITHIN_DAYS
        value:
          description: String, number, boolean, ISO date or array as the operator requires
    ConditionGroup:
      type: object
      required:
      - op
      - items
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        items:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ConditionGroup'
            - $ref: '#/components/schemas/Condition'
      description: Recursive AND/OR tree shared by segments, automation IF_ELSE/GOAL steps and campaign audiences
    ConsentEvent:
      type: object
      required:
      - at
      - status
      - source
      properties:
        at:
          type: string
          format: date-time
        status:
          $ref: '#/components/schemas/SubscriptionStatus'
        source:
          $ref: '#/components/schemas/ConsentSource'
        actor:
          type: string
          description: Staff user id, automation id, or 'contact'
        note:
          type: string
    ConsentSource:
      type: string
      enum:
      - WEB_FORM
      - DOUBLE_OPT_IN
      - IMPORT
      - STAFF
      - API
      - PREFERENCE_PAGE
      - CHECKOUT
      description: Where the consent came from; stored on every subscription change
    Contact:
      type: object
      required:
      - id
      - name
      - create_date
      properties:
        tags:
          type: array
          items:
            type: string
          description: Tag names (see /tags)
        custom_fields:
          type: object
          additionalProperties: true
          description: Values for crm/platform custom fields, keyed by field key
        score:
          type: integer
          format: int32
          readOnly: true
          description: Current crm/intelligence score
        timezone:
          type: string
          description: IANA zone, for send-in-contact-timezone and send windows
        last_activity_at:
          type: string
          format: date-time
          readOnly: true
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 255
        email:
          type: string
          format: email
          maxLength: 255
        phone:
          type: string
          maxLength: 64
        mobile:
          type: string
          maxLength: 64
        title:
          type: string
          enum:
          - MR
          - MRS
          - MME
          description: Salutation
        function:
          type: string
          maxLength: 128
        department:
          type: string
          maxLength: 128
        company_id:
          type: string
          format: uuid
          description: Parent company/account
        is_company:
          type: boolean
          default: false
        parent_id:
          type: string
          format: uuid
          description: Parent contact for org structure
        street:
          type: string
          maxLength: 255
        street2:
          type: string
          maxLength: 255
        city:
          type: string
          maxLength: 128
        state_id:
          type: string
          format: uuid
        zip:
          type: string
          maxLength: 32
        country_id:
          type: string
          format: uuid
        user_ids:
          type: array
          items:
            type: string
            format: uuid
        active:
          type: boolean
          default: true
        color:
          type: integer
          format: int32
          minimum: 1
          maximum: 16
        create_date:
          type: string
          format: date-time
          readOnly: true
        write_date:
          type: string
          format: date-time
          readOnly: true
        child_contact_ids:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
        lead_count:
          type: integer
          format: int32
          readOnly: true
        opportunity_count:
          type: integer
          format: int32
          readOnly: true
      description: An individual person associated with an account or lead
    ContactCountsSummary:
      type: object
      properties:
        total:
          type: integer
          format: int64
        subscribed:
          type: integer
          format: int64
        unsubscribed:
          type: integer
          format: int64
        bounced:
          type: integer
          format: int64
        pending:
          type: integer
          format: int64
        segments:
          type: array
          items:
            type: object
            properties:
              segment_id:
                type: string
                format: uuid
              name:
                type: string
              count:
                type: integer
                format: int64
            required:
            - segment_id
            - count
      required:
      - total
      description: 'Counts for the contacts aside: all contacts by status and each saved segment.'
    ContactPage:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Contact'
        total:
          type: integer
          format: int64
        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
    CreateBulkJobRequest:
      type: object
      properties:
        label:
          type: string
        action:
          $ref: '#/components/schemas/BulkJobAction'
        value:
          type: string
          description: Tag name, field value, ...
        field_key:
          type: string
        list_id:
          type: string
          format: uuid
        segment_id:
          type: string
          format: uuid
        contact_ids:
          type: array
