openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Audience
  version: v1.0.0
  description: 'Who we can reach: contacts with custom field values, organisations (prospect companies), tags, segments and
    the shared condition tree, lists, subscriptions with their consent history, suppressions, notes, the contact timeline
    and bulk jobs. Owns every "can we contact this person?" fact. Admits confirmed sign-ups from crm/intake (ADR 004).'
  x-api-docs:
    service: audience
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/audience
  description: Local development (port from port-registry)
- url: /api/v1/crm/audience
  description: CRM Audience API
tags:
- name: bulk-jobs
  description: Bulk jobs
- name: contacts
  description: Contact CRUD
- name: lists
  description: Mailing lists and their subscription state
- name: organisations
  description: Organisations
- name: segments
  description: Saved condition trees that select contacts
- name: subscriptions
  description: Contact x list subscription state and consent history
- name: suppressions
  description: Addresses that must never be sent to
- name: tags
  description: Tags on contacts
paths:
  /bulk-jobs:
    get:
      operationId: list_bulk_jobs
      summary: Bulk jobs, newest first
      tags:
      - bulk-jobs
      responses:
        '200':
          description: Page of bulk jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJobPage'
              example:
                items:
                - id: c16c46aa-99a8-54ba-a51c-952111d137c1
                  label: Add tag webinar-oct
                  action: ADD_TAG
                  value: webinar-oct
                  contacts: 418
                  status: DONE
                  by: Riya Kapoor
                  undoable: true
                  created_at: '2026-10-23T16:00:00Z'
                - id: 8ce6b7ec-d07d-5cb6-adbd-b95e66a7a596
                  label: Set field plan = Team
                  action: SET_FIELD
                  value: plan = Team
                  contacts: 96
                  status: DONE
                  by: Import · partners.csv
                  undoable: false
                  created_at: '2026-09-14T16:00:00Z'
                total: 2
                page: 1
                limit: 25
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      x-brrtrouter-impl: true
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
      description: Bulk jobs, newest first. Paged (`page`, `limit` ≤ 100).
    post:
      operationId: create_bulk_job
      summary: Change many contacts at once
      tags:
      - bulk-jobs
      responses:
        '202':
          description: Accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BulkJob'
              example:
                id: c16c46aa-99a8-54ba-a51c-952111d137c1
                label: Add tag webinar-oct
                action: ADD_TAG
                value: webinar-oct
                contacts: 418
                status: DONE
                by: Riya Kapoor
                undoable: true
                created_at: '2026-10-23T16:00:00Z'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: 'Runs in the background on a segment or an explicit list of contacts.


        Publishes `contact.updated`, `subscription.changed`, `tag.added`, `tag.removed` on `crm.audience.v1`.'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateBulkJobRequest'
            example:
              label: Primary
              action: ADD_TAG
              value: Value
              field_key: Field key
              list_id: 217107c2-57c1-5880-b574-99c272405f82
              segment_id: 39b23dbc-b404-5494-99d8-c3aaea9a4923
              contact_ids:
              - 55fa986d-a0de-54ab-b509-ffddaebe8568
              consent_source: Consent source
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      x-events:
      - contact.updated
      - subscription.changed
      - tag.added
      - tag.removed
  /bulk-jobs/{id}/undo:
    post:
      operationId: undo_bulk_job
