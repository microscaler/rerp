      type: string
      enum:
      - EMAIL
      - SMS
      - WHATSAPP
      description: Delivery channel. EMAIL is delivered; SMS and WHATSAPP need a provider adapter.
    Condition:
      type: object
      required:
      - subject
      - operator
      properties:
        subject:
          type: string
          description: 'What is tested: field:<name>, custom:<key>, tag, list:<id>, score, engagement:opened:<days>,

            engagement:clicked:<days>, engagement:any:<days>, deal:stage, deal:value, site:visited:<path>,

            event:<name>, form:<id>, created_at, last_activity_at, timezone, country

            '
        operator:
          type: string
          enum:
          - EQ
          - NEQ
          - CONTAINS
          - NOT_CONTAINS
          - STARTS_WITH
          - GT
          - GTE
          - LT
          - LTE
          - IN
          - NOT_IN
          - IS_SET
          - IS_NOT_SET
          - HAS
          - HAS_NOT
          - BEFORE
          - AFTER
          - WITHIN_DAYS
          - NOT_WITHIN_DAYS
        value:
          description: String, number, boolean, ISO date or array as the operator requires
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
    ConditionGroup:
      type: object
      required:
      - op
      - items
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        items:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Condition'
            - $ref: '#/components/schemas/ConditionSubgroup'
      description: 'AND/OR tree shared by segments, automation IF_ELSE/GOAL steps and campaign audiences: a group holds conditions
        and sub-groups, a sub-group holds conditions (two levels).'
    ConditionSubgroup:
      type: object
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        items:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
      required:
      - op
      - items
      description: A nested AND/OR group of conditions inside a ConditionGroup.
