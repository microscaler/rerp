          - MME
        function:
          type: string
        department:
          type: string
        company_id:
          type: string
          format: uuid
        parent_id:
          type: string
          format: uuid
        street:
          type: string
        street2:
          type: string
        city:
          type: string
        state_id:
          type: string
          format: uuid
