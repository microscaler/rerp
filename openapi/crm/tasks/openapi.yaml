                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: update_task
    patch:
      operationId: patch_task
      summary: Update part of a task
      tags:
        - tasks
      parameters:
        - *id003
