openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation.
x-brrtrouter-stack-size: 128KiB
info:
  title: Tasks
  version: v1.0.0
  description: Tasks service - calls, emails, meetings and to-dos on contacts and deals, with task types, an outcome catalogue
    (label + sentiment), reminders, a hook that starts a workflow when a task is added or completed, calendar (iCal) feeds
    and saved responses. Completing a task fires crm/automation TASK_COMPLETED.
  x-api-version: CRM Tasks API v1.0.0
  x-crm-api-version: v1.0.0
  termsOfService: https://rerp.example.com/terms
  contact:
    name: RERP API Support
    url: https://docs.rerp.com/support
    email: api-support@rerp.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-api-docs:
    service: tasks
    openapi_version: 3.1.0
    brrtrouter_version: latest
servers:
  - url: http://localhost:10352/api/v1/crm/tasks
    description: Local development (direct to service, port from port-registry)
  - url: /api/v1/crm/tasks
    description: Tasks API
tags:
  - name: tasks
    description: Tasks on contacts and deals
  - name: task-types
    description: Task types and their outcomes
  - name: outcomes
    description: The outcome catalogue
  - name: calendars
    description: iCal feeds of tasks
  - name: saved-responses
    description: Reusable 1:1 email responses
  - name: settings
    description: Task settings
paths:
  /tasks:
    get:
      operationId: list_tasks
      summary: List tasks
      tags:
        - tasks
      parameters:
        - &id004
          name: page
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            default: 1
        - &id005
          name: limit
          in: query
          schema:
            type: integer
            format: int32
            minimum: 1
            maximum: 100
            default: 50
        - &id006
          name: search
          in: query
          schema:
            type: string
        - name: status
          in: query
          schema:
            $ref: '#/components/schemas/TaskStatus'
        - name: related_kind
          in: query
          schema:
            $ref: '#/components/schemas/RelatedKind'
        - name: related_id
          in: query
          schema: &id001
            type: string
            format: uuid
        - name: contact_id
          in: query
          schema: *id001
        - name: deal_id
          in: query
          schema: *id001
        - name: type_id
          in: query
          schema: *id001
        - name: assignee_id
          in: query
          schema:
            type: string
        - name: outcome_id
          in: query
          schema: *id001
        - name: sentiment
          in: query
          schema:
            $ref: '#/components/schemas/Sentiment'
        - name: due_from
          in: query
          schema: &id002
            type: string
            format: date-time
        - name: due_to
          in: query
          schema: *id002
        - name: overdue
          in: query
          schema:
            type: boolean
        - name: sort
          in: query
          schema:
            type: string
            enum:
              - due_at
              - created_at
              - title
            default: due_at
        - name: dir
          in: query
          schema:
            type: string
            enum:
              - asc
              - desc
            default: asc
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTask'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: list_tasks
    post:
      operationId: create_task
      summary: Create a task
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTaskRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: create_task
  /tasks/{id}:
    get:
      operationId: get_task
      summary: Get a task
