      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: patch_task
    delete:
      operationId: delete_task
      summary: Delete a task
      tags:
        - tasks
      parameters:
        - *id003
      responses:
        '204':
          description: No content
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: delete_task
  /tasks/{id}/complete:
    post:
      operationId: complete_task
      summary: Complete a task with an outcome; fires TASK_COMPLETED and the task's COMPLETED automation hook
      tags:
        - tasks
      description: 422 OUTCOME_REQUIRED when settings.require_outcomes is on and no outcome_id is given; 422 OUTCOME_NOT_ALLOWED
        when the outcome is not one of the task type's.
      parameters:
        - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CompleteTaskRequest'
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: complete_task
  /tasks/{id}/reopen:
    post:
      operationId: reopen_task
      summary: Reopen a completed task (clears the outcome)
      tags:
        - tasks
      parameters:
        - *id003
      responses:
        '200':
          description: OK
