components:
  schemas:
    ErrorResponse:
      type: object
      required:
        - code
        - message
      properties:
        code:
          type: integer
          format: int32
        message:
          type: string
        details:
          type: object
    TaskStatus:
      type: string
      enum:
        - OPEN
        - COMPLETED
        - CANCELLED
    RelatedKind:
      type: string
      enum:
        - CONTACT
        - DEAL
        - ACCOUNT
    Sentiment:
      type: string
      enum:
        - POSITIVE
        - NEUTRAL
        - NEGATIVE
    Reminder:
      type: object
      required:
        - unit
      description: When to remind the assignee before the due time; AT_DUE sends at the due time
      properties:
        id: *id001
        unit:
          type: string
          enum:
            - AT_DUE
            - MINUTES
            - HOURS
            - DAYS
        amount:
          type: integer
          format: int32
          minimum: 1
        channel:
          type: string
          enum:
            - EMAIL
            - IN_APP
            - BOTH
          default: BOTH
        sent_at: &id007
          type: string
          format: date-time
          readOnly: true
    AutomationHook:
      type: object
      required:
        - workflow_id
        - 'on'
      description: Start a crm/automation workflow for the task's contact when the task is added or completed
      properties:
        workflow_id: *id001
        'on':
          type: string
          enum:
            - ADDED
            - COMPLETED
    Task:
      type: object
      required:
        - id
        - title
        - related_kind
        - related_id
        - type_id
        - status
        - created_at
      properties:
        id: *id001
        title:
          type: string
          maxLength: 255
        description:
          type: string
        related_kind:
          $ref: '#/components/schemas/RelatedKind'
        related_id: *id001
        contact_id:
          type: string
          format: uuid
          description: The contact the task is on, or the deal's primary contact
        contact_name:
          type: string
          readOnly: true
        deal_id: *id001
        deal_title:
          type: string
          readOnly: true
        type_id: *id001
        type:
          type: string
          readOnly: true
          description: The type's title
        status:
          $ref: '#/components/schemas/TaskStatus'
        assignee_id:
          type: string
          description: Staff user id; absent = unassigned
        owner_name:
          type: string
          readOnly: true
        due_at: *id002
        overdue:
          type: boolean
          readOnly: true
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
        automation:
          $ref: '#/components/schemas/AutomationHook'
        outcome_id: *id001
        outcome:
          type: string
          readOnly: true
        outcome_sentiment:
          $ref: '#/components/schemas/Sentiment'
          readOnly: true
        completed_at: *id007
        completed_by:
          type: string
          readOnly: true
          description: A staff user id, or WORKFLOW
        created_by:
          type: string
          readOnly: true
          description: A staff user id, WORKFLOW, FORM or IMPORT
        created_at: *id007
        updated_at: *id007
    CreateTaskRequest:
      type: object
      required:
        - title
        - related_kind
        - related_id
        - type_id
      properties:
        title:
          type: string
          maxLength: 255
        description:
          type: string
        related_kind:
          $ref: '#/components/schemas/RelatedKind'
        related_id: *id001
        type_id: *id001
        assignee_id:
          type: string
        due_at: *id002
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
        automation:
          $ref: '#/components/schemas/AutomationHook'
        completed:
          type: boolean
          default: false
          description: Create it already complete (needs outcome_id when outcomes are required)
        outcome_id: *id001
    UpdateTaskRequest:
      type: object
      properties:
        title:
          type: string
        description:
          type: string
        type_id: *id001
        assignee_id:
          type: string
        due_at: *id002
        reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
        automation:
          $ref: '#/components/schemas/AutomationHook'
        related_kind:
          $ref: '#/components/schemas/RelatedKind'
        related_id: *id001
    CompleteTaskRequest:
      type: object
      properties:
        outcome_id:
          type: string
          format: uuid
          description: Required when settings.require_outcomes is true
        note:
          type: string
    TaskType:
      type: object
      required:
        - id
        - title
        - active
      properties:
        id: *id001
        title:
          type: string
          maxLength: 64
        default_minutes:
          type: integer
          format: int32
          description: Default duration for calendar feeds
        outcome_ids:
          type: array
          items: *id001
          description: The outcomes offered for this type, in order (at least one when outcomes are required)
        outcomes:
          type: array
          items:
            type: string
          readOnly: true
          description: Their labels
        sequence:
          type: integer
          format: int32
        active:
          type: boolean
          description: Hidden types keep their history but cannot be picked
        open_count:
          type: integer
          format: int64
          readOnly: true
        created_at: *id007
    TaskTypeRequest:
      type: object
      required:
        - title
      properties:
        title:
          type: string
        default_minutes:
          type: integer
          format: int32
        outcome_ids:
          type: array
          items: *id001
        sequence:
          type: integer
          format: int32
        active:
          type: boolean
    Outcome:
      type: object
      required:
        - id
        - label
        - sentiment
      description: One entry of the workspace's outcome catalogue; task types pick from it
      properties:
        id: *id001
        label:
          type: string
          maxLength: 64
        sentiment:
          $ref: '#/components/schemas/Sentiment'
        used_by_type_ids:
          type: array
          items: *id001
          readOnly: true
        count_30d:
          type: integer
          format: int64
          readOnly: true
    OutcomeRequest:
      type: object
      required:
        - label
        - sentiment
      properties:
        label:
          type: string
        sentiment:
          $ref: '#/components/schemas/Sentiment'
    TaskSettings:
      type: object
      properties:
        require_outcomes:
          type: boolean
          default: false
          description: Completing a task needs an outcome, and every active type needs at least one outcome before this can
            be turned on
        default_due_offset_minutes:
          type: integer
          format: int32
          default: 0
        default_reminders:
          type: array
          items:
            $ref: '#/components/schemas/Reminder'
    CalendarFeed:
      type: object
      required:
        - id
        - name
        - scope
        - created_at
      description: An iCal feed of tasks, by scope, pipelines and assignees; the URL carries a token and is served by GET
        /calendars/{token}.ics
      properties:
        id: *id001
        name:
          type: string
          maxLength: 128
        scope:
          type: string
          enum:
            - ALL
            - DEALS
            - CONTACTS
        pipeline_ids:
          type: array
          items: *id001
          description: 'DEALS/ALL: limit to these pipelines; empty = all'
        assignee_ids:
          type: array
          items:
            type: string
          description: Empty = everyone
        include_alerts:
          type: boolean
          default: false
          description: Add VALARM entries from the tasks' reminders
        url:
          type: string
          format: uri
          readOnly: true
        token:
          type: string
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at: *id007
    CalendarFeedRequest:
      type: object
      required:
        - name
        - scope
      properties:
        name:
          type: string
        scope:
          type: string
          enum:
            - ALL
            - DEALS
            - CONTACTS
        pipeline_ids:
          type: array
          items: *id001
        assignee_ids:
          type: array
          items:
            type: string
        include_alerts:
          type: boolean
    SavedResponse:
      type: object
      required:
        - id
        - name
        - subject
        - body
      description: A reusable 1:1 email (subject + body with %MERGE% fields), picked when a user emails a contact or deal
      properties:
        id: *id001
        name:
          type: string
          maxLength: 128
        category_id: *id001
        category:
          type: string
          readOnly: true
        subject:
          type: string
          maxLength: 255
        body:
          type: string
          description: HTML with merge fields
        last_sent_at: *id007
        last_sent_by:
          type: string
          readOnly: true
        send_count:
          type: integer
          format: int64
          readOnly: true
        created_by:
          type: string
          readOnly: true
        created_at: *id007
        updated_at: *id007
    SavedResponseRequest:
      type: object
      required:
        - name
        - subject
        - body
      properties:
        name:
          type: string
        category_id: *id001
        subject:
          type: string
        body:
          type: string
    SavedResponseCategory:
      type: object
      required:
        - id
        - name
      properties:
        id: *id001
        name:
          type: string
          maxLength: 64
        response_count:
          type: integer
          format: int32
          readOnly: true
    TaskOverview:
      type: object
      description: The task overview report
      properties:
        total:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
        overdue:
          type: integer
          format: int64
        open:
          type: integer
          format: int64
        series:
          type: array
          items:
            type: object
            properties:
              date:
                type: string
                format: date
              open:
                type: integer
              completed:
                type: integer
              due:
                type: integer
              overdue:
                type: integer
              completed_late:
                type: integer
              completed_on_time:
                type: integer
        by_status:
          type: object
