      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: reopen_task
  /tasks/bulk:
    post:
      operationId: bulk_update_tasks
      summary: Complete, reassign, reschedule or delete many tasks
      tags:
        - tasks
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - task_ids
                - action
              properties:
                task_ids:
                  type: array
                  items: *id001
                action:
                  type: string
                  enum:
                    - COMPLETE
                    - REASSIGN
                    - RESCHEDULE
                    - DELETE
                outcome_id: *id001
                assignee_id:
                  type: string
                due_at: *id002
      responses:
        '200':
          description: OK
          content:
            application/json:
              schema:
                type: object
                properties:
                  updated:
                    type: integer
                  skipped:
                    type: array
                    items:
                      type: object
                      properties:
                        task_id: *id001
                        reason:
                          type: string
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '422':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
        - bearerAuth: []
      x-controller: rerp_crm::tasks::controller::tasks
      x-handler-name: bulk_update_tasks
