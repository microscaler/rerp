    summary: crm/acquisition consumes track.received, ad_click.received, ad_call.received, ad_webhook.received, oauth.completed
    messages:
    - $ref: '#/channels/from_edge/messages/trackReceived'
    - $ref: '#/channels/from_edge/messages/adClickReceived'
    - $ref: '#/channels/from_edge/messages/adCallReceived'
    - $ref: '#/channels/from_edge/messages/adWebhookReceived'
    - $ref: '#/channels/from_edge/messages/oauthCompleted'
