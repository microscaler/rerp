# Generated with the OpenAPI document from the CRM event catalogue (openapi/crm/docs/10-events.md).
asyncapi: 3.0.0
info:
  title: CRM Acquisition events
  version: 1.0.0
  description: 'Events crm/acquisition publishes on Pub/Sub topic `crm.acquisition.v1` and the events it consumes from other
    CRM services. Every message is an envelope (event id, type, workspace, time, actor) around `data`. Delivery is at least
    once: consumers are idempotent on `event_id`. Catalogue: openapi/crm/docs/10-events.md; decisions: ADR 003, ADR 004.'
defaultContentType: application/json
servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub in the CRM plane project (topics and subscriptions are created by gcp-infrastructure
      through Crossplane).
channels:
  published:
    address: crm.acquisition.v1
    title: crm.acquisition.v1
    description: Everything crm/acquisition publishes.
    messages:
