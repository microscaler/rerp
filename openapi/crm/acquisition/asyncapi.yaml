    summary: crm/acquisition consumes deal.won
    messages:
    - $ref: '#/channels/from_sales/messages/dealWon'
  consume_workspace:
    action: receive
    channel:
      $ref: '#/channels/from_workspace'
    summary: crm/acquisition consumes field.defined, field.changed, erasure.requested, workspace.created
    messages:
