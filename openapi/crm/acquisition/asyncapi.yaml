operations:
  publish:
    action: send
    channel:
      $ref: '#/channels/published'
    summary: crm/acquisition publishes its events
    messages:
    - $ref: '#/channels/published/messages/formSubmitted'
    - $ref: '#/channels/published/messages/siteVisited'
