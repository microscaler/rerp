      erasureCompleted:
        $ref: '#/components/messages/erasureCompleted'
  from_audience:
    address: crm.audience.v1
    title: crm.audience.v1
    description: Subscription `acquisition-audience` (with a dead-letter topic) filtered on the event types below.
    messages:
