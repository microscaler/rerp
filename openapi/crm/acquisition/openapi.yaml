    AdTrackingSettings:
      type: object
      properties:
        cookie:
          type: object
          description: The first-party visitor cookie set on the tracking domain
          properties:
            name:
              type: string
              default: _pw_vid
            ttl_days:
              type: integer
              format: int32
              default: 400
              description: Chrome caps at 400 days; Safari caps script-set cookies at 7 days, server-set at the full TTL
            server_set:
              type: boolean
              default: true
              description: Set via `Set-Cookie` from `/ads/clicks` on the tracking domain (CNAME, same registrable domain
                as the site) so ITP keeps it
            same_site:
              type: string
              enum:
              - Lax
              - Strict
              - None
              default: Lax
            localstorage_mirror:
              type: boolean
              default: true
              description: Mirror the id into localStorage and restore the cookie when it is cleared
        click_id_params:
          type: array
          items:
            type: string
          default:
          - gclid
          - wbraid
          - gbraid
