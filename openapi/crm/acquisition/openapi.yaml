          type: string
          default: pw_cid
          description: The workspace's own click id, stamped on every outbound link by the link-tag rules
        capture_utm:
          type: boolean
          default: true
        capture_referrer:
          type: boolean
          default: true
        fingerprint:
          type: object
          description: Soft identifiers used only to join sessions, never sent to a platform
          properties:
            enabled:
              type: boolean
              default: true
            signals:
              type: array
              items:
                type: string
                enum:
                - IP_PREFIX
                - USER_AGENT
                - SCREEN
                - TIMEZONE
                - LANGUAGE
            ip_truncation:
              type: string
              enum:
              - NONE
              - LAST_OCTET
              - LAST_TWO_OCTETS
              default: LAST_OCTET
        identify_on:
          type: array
          items:
            type: string
            enum:
            - FORM_SUBMIT
            - EMAIL_LINK
            - SMS_LINK
            - LOGIN
            - CHECKOUT
            - CALL
          description: 'Moments at which the anonymous visitor is joined to a contact (deterministic: email, phone, contact
            id in the link)'
        consent:
