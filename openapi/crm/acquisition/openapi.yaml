openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Acquisition
  version: v1.0.0
  description: 'Where contacts come from and what they are worth: forms, tracked sites and events, UTM, conversions and business
    goals, surveys and events, ad accounts and adapters, ad audiences, creatives and buys, ad tracking settings and link decoration,
    the conversion relay and attribution.'
  x-api-docs:
    service: acquisition
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/acquisition
  description: Local development (port from port-registry)
- url: /api/v1/crm/acquisition
  description: CRM Acquisition API
tags:
- name: ad-attribution
  description: 'Ad attribution: journeys, models, spend vs attributed revenue, LTV cohorts'
- name: ad-audiences
  description: 'Ad audiences: connected ad accounts and segments / lists / tags kept in step with platform custom audiences
    (hashed server-side), warm-up sequences, lookalikes'
- name: ad-buying
  description: 'Ad buying: one platform-agnostic buy spec pushed through adapters (walled-garden APIs, self-serve DSP APIs,
    bidder-as-a-service, own OpenRTB bidder), creatives, delivery, recommendations applied'
- name: ad-tracking
  description: 'Ad tracking: first-party click capture, link decoration, server-side conversion relay (Meta CAPI, Google offline
    / enhanced, LinkedIn, TikTok), call touchpoints'
- name: campaigns
  description: Campaign reporting and attribution
- name: conversions
  description: Conversions
- name: events
  description: Event registration tracking
- name: forms
  description: Public web form capture
- name: goals
  description: Goals
- name: marketing-analytics
  description: Visitor tracking and analytics
- name: marketing-campaigns
  description: Campaign lead and revenue attribution
- name: marketing-forms
  description: Marketing form management
- name: utm
  description: Campaign, medium, and source tracking
- name: visitors
  description: Anonymous visitor tracking
paths:
  /ads/accounts:
    get:
      operationId: list_ad_accounts
      summary: Connected ad platforms
      tags:
      - ad-audiences
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Accounts
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: connect_ad_account
      summary: Connect an ad platform account (OAuth or API key)
      tags:
      - ad-audiences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConnectAdAccountRequest'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Account; OAuth flows return `authorize_url` and status AUTHORIZING
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/accounts/{id}:
    get:
      operationId: get_ad_account
      summary: One ad account with its capabilities and last sync
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    patch:
      operationId: update_ad_account
      summary: Rename, change the default conversion event names, pause
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdAccountRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
    delete:
      operationId: disconnect_ad_account
      summary: Disconnect; audiences on it stop syncing (platform-side audiences are left in place)
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/accounts/{id}/import-spend:
    post:
      operationId: import_ad_spend
      summary: Pull spend, impressions and clicks per campaign / ad set / ad for a date range
      tags:
      - ad-tracking
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                from:
                  type: string
                  format: date
                to:
                  type: string
                  format: date
      security:
      - bearerAuth: []
      responses:
        '202':
          description: Import job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdSpendImport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/accounts/{id}/reconnect:
    post:
      operationId: reconnect_ad_account
      summary: Re-run the OAuth flow after a token expiry
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Account with `authorize_url`
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAccount'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/adapters:
    get:
      operationId: list_ad_adapters
      summary: The buying adapters this deployment ships, with the capability matrix per platform (audiences, conversions,
        spend, campaign create / pause / budget / bid, creative upload, placements, frequency caps, deal ids)
      tags:
      - ad-buying
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Adapters
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AdAdapter'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /ads/attribution:
    get:
      operationId: get_ad_attribution
      summary: Revenue, deals and leads by channel / campaign / ad under a model and window, with the ad-platform-reported
        figures beside them
      tags:
      - ad-attribution
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: model
        in: query
        schema:
          type: string
      - name: window_days
        in: query
        schema:
          type: integer
      - name: by
        in: query
        schema:
          type: string
          enum:
          - CHANNEL
          - ACCOUNT
          - CAMPAIGN
          - AD_SET
          - AD
          - SOURCE_MEDIUM
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAttributionReport'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /ads/attribution/models:
    get:
      operationId: list_attribution_models
      summary: Built-in and custom attribution models
      tags:
      - ad-attribution
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Models
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/AttributionModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: create_attribution_model
      summary: Add a custom model (weights per position, window, which touchpoint kinds count)
      tags:
      - ad-attribution
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionModel'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/attribution/models/{id}:
    patch:
      operationId: update_attribution_model
      summary: Change a custom model or make it the default
      tags:
      - ad-attribution
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AttributionModel'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Model
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttributionModel'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
    delete:
      operationId: delete_attribution_model
      summary: Remove a custom model
      tags:
      - ad-attribution
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/audiences:
    get:
      operationId: list_ad_audiences
      summary: Audience bindings (a segment, list or tag kept in step with a platform custom audience)
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: account_id
        in: query
        schema:
          type: string
          format: uuid
      - name: status
        in: query
        schema:
          type: string
          enum:
          - ACTIVE
          - PAUSED
          - ERROR
          - BUILDING
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Audiences
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AdAudience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: create_ad_audience
      summary: Bind a segment / list / tag to a new or existing platform audience
      tags:
      - ad-audiences
      description: Identifiers are normalised and SHA-256 hashed server-side before leaving the workspace; raw emails and
        phones never reach the platform. `consent_basis` is recorded on the audience and on every membership row. Contacts
        that are unsubscribed, suppressed, erased, or match `suppress_on` are removed on the next sync.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdAudienceRequest'
      security:
      - bearerAuth: []
      responses:
        '201':
          description: Audience; the first build runs asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAudience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/audiences/preview:
    post:
      operationId: preview_ad_audience
      summary: Count the source and estimate the platform match before creating the audience
      tags:
      - ad-audiences
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateAdAudienceRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Estimate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAudiencePreview'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/audiences/{id}:
    get:
      operationId: get_ad_audience
      summary: One audience with its stats
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAudience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    patch:
      operationId: update_ad_audience
      summary: Change source, identifiers, suppression rules, lookalike or mode
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateAdAudienceRequest'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAudience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
    delete:
      operationId: delete_ad_audience
      summary: Stop syncing and, when `delete_remote=true`, delete the platform audience
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - name: delete_remote
        in: query
        schema:
          type: boolean
      security:
      - bearerAuth: []
      responses:
        '204':
          description: OK
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/audiences/{id}/members:
    get:
      operationId: list_ad_audience_members
      summary: 'Membership rows: who is in the platform audience, when they were added / removed and why'
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          type: string
          enum:
          - PENDING
          - ADDED
          - REMOVED
          - FAILED
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Members
          content:
            application/json:
              schema:
                allOf:
                - $ref: '#/components/schemas/PaginatedResponse'
                - type: object
                  properties:
                    items:
                      type: array
                      items:
                        $ref: '#/components/schemas/AdAudienceMember'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /ads/audiences/{id}/pause:
    post:
      operationId: pause_ad_audience
      summary: Pause syncing; members stay on the platform
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAudience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /ads/audiences/{id}/resume:
    post:
      operationId: resume_ad_audience
      summary: Resume syncing
      tags:
      - ad-audiences
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      security:
      - bearerAuth: []
      responses:
        '200':
          description: Audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AdAudience'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
