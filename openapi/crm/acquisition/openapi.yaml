components:
  schemas:
    AdAccount:
      type: object
      required:
      - id
      - platform
      - name
      - status
      properties:
        id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - REDDIT
          - AMAZON_DSP
          - DSP_TRADE_DESK
          - DSP_DV360
          - DSP_STACKADAPT
          - DSP_ADFORM
          - DSP_ADMIXER
          - DSP_SMARTYADS
          - DSP_EPOM
          - BIDDER_BEESWAX
          - OPENRTB
          - LIVERAMP
        name:
          type: string
        external_account_id:
          type: string
          description: The platform's own account / ad-account / pixel id
        status:
          type: string
          enum:
          - AUTHORIZING
          - CONNECTED
          - TOKEN_EXPIRED
          - PAUSED
          - DISCONNECTED
          - ERROR
        authorize_url:
          type: string
          format: uri
          readOnly: true
          description: Present while AUTHORIZING
        capabilities:
          type: array
          items:
            type: string
            enum:
            - AUDIENCES
            - LOOKALIKES
            - CONVERSIONS
            - SPEND
            - CAMPAIGN_CONTROL
          readOnly: true
        conversion_endpoint:
          type: string
          enum:
          - META_CAPI
          - GOOGLE_OFFLINE
          - GOOGLE_ENHANCED
          - LINKEDIN_CAPI
          - TIKTOK_EVENTS
          - MICROSOFT_OFFLINE
          - NONE
          description: Which server-side conversion API the account relays to
        pixel_id:
          type: string
          description: Pixel / dataset / tag id used for conversion relay
        default_currency:
          type: string
        match_rate_last:
          type: number
          format: float
          readOnly: true
          description: Matched ÷ uploaded on the last audience sync, 0–1
        last_sync_at:
          type: string
          format: date-time
          readOnly: true
        last_spend_import_at:
          type: string
          format: date-time
          readOnly: true
        last_error:
          type: string
          readOnly: true
        connected_by:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    AdAdapter:
      type: object
      required:
      - platform
      - kind
      properties:
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - REDDIT
          - AMAZON_DSP
          - DSP_TRADE_DESK
          - DSP_DV360
          - DSP_STACKADAPT
          - DSP_ADFORM
          - DSP_ADMIXER
          - DSP_SMARTYADS
          - DSP_EPOM
          - BIDDER_BEESWAX
          - OPENRTB
          - LIVERAMP
        kind:
          type: string
          enum:
          - WALLED_GARDEN_API
          - SELF_SERVE_DSP_API
          - BIDDER_AS_A_SERVICE
          - OPENRTB_BIDDER
          - ONBOARDER
          description: 'WALLED_GARDEN_API: the platform''s own marketing API (Meta, Google Ads, LinkedIn, X, TikTok, Microsoft,
            Reddit, Pinterest, Amazon). SELF_SERVE_DSP_API: a DSP with an advertiser API (Adform, StackAdapt, Admixer, SmartyAds,
            Epom white-label). BIDDER_AS_A_SERVICE: our own bidding logic hosted on a bidder (Beeswax). OPENRTB_BIDDER: our
            own bidder on exchanges. ONBOARDER: audiences only (LiveRamp).'
        capabilities:
          type: array
          items:
            type: string
            enum:
            - AUDIENCES
            - LOOKALIKES
            - CONVERSIONS
            - SPEND
            - CAMPAIGN_CREATE
            - CAMPAIGN_PAUSE
            - BUDGET
            - BID
            - SCHEDULE
            - FREQUENCY_CAP
            - PLACEMENTS
            - CREATIVE_UPLOAD
            - DEAL_IDS
            - GEO
            - DEVICE
            - DAYPARTING
            - CONTEXTUAL
            - RETARGETING_PIXEL
        objectives:
          type: array
          items:
            type: string
        formats:
          type: array
          items:
            type: string
            enum:
            - IMAGE
            - VIDEO
            - HTML5
            - NATIVE
            - TEXT
            - CAROUSEL
            - AUDIO
        identity:
          type: array
          items:
            type: string
          description: Identifiers the platform matches on (hashed email, phone, MAID, UID2, RampID, cookie)
        minimums:
          type: object
          properties:
            audience_matched:
              type: integer
              format: int64
            daily_budget:
              type: number
              format: double
            monthly_spend_practical:
              type: number
              format: double
            currency:
              type: string
        fee_model:
          type: string
          description: Take rate / subscription / none, as known
        status:
          type: string
          enum:
          - SHIPPED
          - PLANNED
          - NOT_PLANNED
        notes:
          type: string
    AdAttributionReport:
      type: object
      properties:
        model:
          type: string
        window_days:
          type: integer
          format: int32
        from:
          type: string
          format: date
        to:
          type: string
          format: date
        totals:
          type: object
          properties:
            spend:
              type: number
              format: double
            leads:
              type: integer
              format: int64
            deals:
              type: integer
              format: int64
            won:
              type: integer
              format: int64
            revenue:
              type: number
              format: double
            platform_reported_revenue:
              type: number
              format: double
            unattributed_revenue:
              type: number
              format: double
        rows:
          type: array
          items:
            type: object
            properties:
              key:
                type: string
              label:
                type: string
              spend:
                type: number
                format: double
              leads:
                type: integer
                format: int64
              deals:
                type: integer
                format: int64
              won:
                type: integer
                format: int64
              revenue:
                type: number
                format: double
              platform_reported_revenue:
                type: number
                format: double
              roas:
                type: number
                format: float
              cac:
                type: number
                format: double
        warm_up_lift:
          type: object
          description: Email outcomes for contacts who were in a WARM_UP audience vs the holdout, when a holdout is configured
          properties:
            exposed:
              type: object
              additionalProperties:
                type: number
            holdout:
              type: object
              additionalProperties:
                type: number
            relative_lift:
              type: object
              additionalProperties:
                type: number
    AdAudience:
      type: object
      required:
      - id
      - name
      - account_id
      - platform
      - source
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - REDDIT
          - AMAZON_DSP
          - DSP_TRADE_DESK
          - DSP_DV360
          - DSP_STACKADAPT
          - DSP_ADFORM
          - DSP_ADMIXER
          - DSP_SMARTYADS
          - DSP_EPOM
          - BIDDER_BEESWAX
          - OPENRTB
          - LIVERAMP
        external_audience_id:
          type: string
          description: The platform's audience id; created on first sync unless given
        source:
          $ref: '#/components/schemas/AdAudienceSource'
        mode:
          type: string
          enum:
          - CONTINUOUS
          - ONE_OFF
          default: CONTINUOUS
          description: CONTINUOUS re-evaluates the source and pushes adds / removals every `sync_interval_minutes`
        sync_interval_minutes:
          type: integer
          format: int32
          default: 60
        identifiers:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - PHONE
            - FIRST_NAME
            - LAST_NAME
            - POSTCODE
            - COUNTRY
            - MAID
            - EXTERNAL_ID
          description: Which identifiers are hashed and sent; more identifiers raise the match rate
        consent_basis:
          type: string
          enum:
          - CONSENT
          - LEGITIMATE_INTEREST
          - CONTRACT
          description: Recorded on every membership; LEGITIMATE_INTEREST is refused for lists whose consent source is PURCHASED
            in regions configured as strict
        suppress_on:
          type: array
          items:
            type: string
            enum:
            - UNSUBSCRIBED
            - SUPPRESSED
            - ERASED
            - CONVERTED
            - DEAL_WON
            - TRACKING_OPTOUT
            - NO_MARKETING_CONSENT
          description: Contacts in these states are removed (or never added)
        exclude_source:
          $ref: '#/components/schemas/AdAudienceSource'
        lookalike:
          type: object
          properties:
            enabled:
              type: boolean
            ratio_percent:
              type: integer
              format: int32
              minimum: 1
              maximum: 10
            country:
              type: string
            external_audience_id:
              type: string
              readOnly: true
        purpose:
          type: string
          enum:
          - WARM_UP
          - RETARGET
          - EXCLUDE
          - LOOKALIKE_SEED
          - OTHER
          description: 'WARM_UP is the pre-email sequence: add N days before a send, remove on click or after the window'
        warm_up:
          type: object
          properties:
            days_before_send:
              type: integer
              format: int32
            remove_on:
              type: string
              enum:
              - EMAIL_CLICKED
              - EMAIL_OPENED
              - SITE_VISIT
              - WINDOW_END
            window_days:
              type: integer
              format: int32
            frequency_cap_hint:
              type: integer
              format: int32
              description: Impressions per person the campaign should cap at (informational; set on the platform)
        status:
          type: string
          enum:
          - BUILDING
          - ACTIVE
          - PAUSED
          - ERROR
        stats:
          type: object
          readOnly: true
          properties:
            source_count:
              type: integer
              format: int64
            eligible:
              type: integer
              format: int64
              description: After suppression
            uploaded:
              type: integer
              format: int64
            matched:
              type: integer
              format: int64
              description: As reported by the platform (Meta and LinkedIn report a size band; stored as the band midpoint)
            match_rate:
              type: number
              format: float
            removed_total:
              type: integer
              format: int64
            last_sync_at:
              type: string
              format: date-time
            next_sync_at:
              type: string
              format: date-time
        last_error:
          type: string
          readOnly: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    AdAudienceMember:
      type: object
      required:
      - contact_id
      - status
      properties:
        audience_id:
          type: string
          format: uuid
        audience_name:
          type: string
        platform:
          type: string
        contact_id:
          type: string
          format: uuid
        contact_name:
          type: string
        email_hash:
          type: string
          description: SHA-256 of the normalised email, hex; what was sent
        status:
          type: string
          enum:
          - PENDING
          - ADDED
          - REMOVED
          - FAILED
        matched:
          type: boolean
          description: Only known for platforms that report per-record match (LiveRamp); null elsewhere
        consent_basis:
          type: string
        added_at:
          type: string
          format: date-time
        removed_at:
          type: string
          format: date-time
        removed_reason:
          type: string
          enum:
          - LEFT_SOURCE
          - UNSUBSCRIBED
          - SUPPRESSED
          - ERASED
          - CONVERTED
          - DEAL_WON
          - TRACKING_OPTOUT
          - WARM_UP_DONE
          - AUDIENCE_DELETED
        error:
          type: string
    AdAudiencePreview:
      type: object
      properties:
        source_count:
          type: integer
          format: int64
        eligible:
          type: integer
          format: int64
        excluded:
          type: object
          additionalProperties:
            type: integer
            format: int64
          description: Counts per suppression reason
        identifier_coverage:
          type: object
          additionalProperties:
            type: number
            format: float
          description: Share of eligible contacts that have each identifier
        estimated_match_rate:
          type: number
          format: float
          description: From the account's history for this identifier set
        estimated_matched:
          type: integer
          format: int64
        below_platform_minimum:
          type: boolean
          description: Platforms refuse to serve audiences under ~100 (Meta) / 1,000 (Google) matched people
    AdAudienceSource:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - SEGMENT
          - LIST
          - TAG
          - SCORE_BAND
          - PIPELINE_STAGE
          - STATIC
        ref_id:
          type: string
          description: Segment / list / score / pipeline id
        tag:
          type: string
        band:
          type: string
          enum:
          - COLD
          - WARM
          - HOT
        stage_id:
          type: string
          format: uuid
        contact_ids:
          type: array
          items:
            type: string
            format: uuid
          description: STATIC only
    AdAudienceSyncRun:
      type: object
      required:
      - id
      - audience_id
      - status
      properties:
        id:
          type: string
          format: uuid
        audience_id:
          type: string
          format: uuid
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - DONE
          - FAILED
        trigger:
          type: string
          enum:
          - SCHEDULE
          - MANUAL
          - SOURCE_CHANGED
          - CREATED
        added:
          type: integer
          format: int64
        removed:
          type: integer
          format: int64
        failed:
          type: integer
          format: int64
        uploaded_total:
          type: integer
          format: int64
        platform_size:
          type: integer
          format: int64
        started_at:
          type: string
          format: date-time
        finished_at:
          type: string
          format: date-time
        error:
          type: string
    AdBuy:
      type: object
      required:
      - id
      - name
      - status
      - spec
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        purpose:
          type: string
          enum:
          - WARM_UP
          - RETARGET
          - ACQUISITION
          - OTHER
        warm_up_for_campaign_id:
          type: string
          format: uuid
          description: The outreach campaign this buy warms up
        spec:
          $ref: '#/components/schemas/AdBuySpec'
        status:
          type: string
          enum:
          - DRAFT
          - REVIEW
          - SCHEDULED
          - LIVE
          - PAUSED
          - ENDED
          - REJECTED
          - ERROR
        accounts:
          type: array
          items:
            type: object
            properties:
              account_id:
                type: string
                format: uuid
              platform:
                type: string
              external_campaign_id:
                type: string
              external_adset_ids:
                type: array
                items:
                  type: string
              status:
                type: string
              review:
                type: string
              unsupported:
                type: array
                items:
                  type: string
                description: Spec fields this adapter could not map
              spend:
                type: number
                format: double
              impressions:
                type: integer
                format: int64
              reach:
