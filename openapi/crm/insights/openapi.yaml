      - admin
      - marketer
      - sales
      - read-only
components:
  schemas:
    AutomationAnalytics:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              workflow_id:
                type: string
                format: uuid
              name:
                type: string
              entered_30d:
                type: integer
                format: int64
              completed_30d:
                type: integer
                format: int64
              goal_rate:
                type: number
                format: double
                minimum: 0
                maximum: 1
              messages_30d:
                type: integer
                format: int64
              open_rate:
                type: number
                format: double
                minimum: 0
                maximum: 1
              deals_created:
                type: integer
                format: int64
              revenue:
                type: number
                format: decimal
      required:
      - items
    AutomationContactRow:
      type: object
      properties:
        contact_id:
          type: string
          format: uuid
        email:
          type: string
        name:
          type: string
        status:
          type: string
          enum:
          - ACTIVE
          - COMPLETED
          - EXITED
          - PAUSED
        entered_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time
        current_step_id:
          type: string
          format: uuid
      required:
      - contact_id
      - status
      - entered_at
    AutomationContactsReport:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        contacts_entered:
          type: integer
        completion_rate:
          type: number
          format: float
          description: 0-100
        completion_rate_change_30d:
          type: number
          format: float
          description: 0-100
        avg_seconds_to_complete:
          type: integer
        top_tags:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        top_lists:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        completion_times:
          type: array
          items:
            $ref: '#/components/schemas/CompletionBucket'
        contacts:
          $ref: '#/components/schemas/PaginatedAutomationContactRow'
      required:
      - workflow_id
      - contacts_entered
      - completion_rate
      description: 'Per-automation contacts: completion KPIs, which tags/lists complete best, completion-time histogram, and
        the contact list (filter by status, search).'
    AutomationGoalRow:
      type: object
      properties:
        step_id:
          type: string
          format: uuid
        name:
          type: string
        contacts_achieved:
          type: integer
        contacts_skipped:
          type: integer
          description: Passed the goal without meeting it (if_not_met = CONTINUE)
        contacts_waiting:
          type: integer
        achieved_rate:
          type: number
          format: float
          description: 0-100
        avg_seconds_to_achieve:
          type: integer
      required:
      - step_id
      - name
      - contacts_achieved
      - achieved_rate
    AutomationGoalsReport:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        goals:
          type: array
          items:
            $ref: '#/components/schemas/AutomationGoalRow'
      required:
      - workflow_id
      - goals
    AutomationListRow:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        name:
          type: string
        folder_id:
          type: string
          format: uuid
        status:
          type: string
        contacts_entered:
          type: integer
        contacts_active:
          type: integer
        contacts_completed:
          type: integer
        message_count:
          type: integer
          description: SEND_MESSAGE steps in the graph
      required:
      - workflow_id
      - name
      - contacts_entered
    AutomationMessageRow:
      type: object
      properties:
        step_id:
          type: string
          format: uuid
        template_id:
          type: string
          format: uuid
        name:
          type: string
        last_sent_at:
          type: string
          format: date-time
        sends:
          type: integer
        unique_opens:
          type: integer
        unique_clicks:
          type: integer
        open_rate:
          type: number
          format: float
          description: 0-100
        click_rate:
          type: number
          format: float
          description: 0-100
        revenue:
          type: number
          format: decimal
      required:
      - step_id
      - name
      - sends
    AutomationOverviewReport:
      type: object
      properties:
        workflow_id:
          type: string
          format: uuid
        name:
          type: string
        contacts_total:
          type: integer
        contacts_finished:
          type: integer
        completion_rate:
          type: number
          format: float
          description: 0-100
        emails_sent:
          type: integer
        email_sent_rate:
          type: number
          format: float
          description: 0-100
        unique_opens:
          type: integer
        open_rate:
          type: number
          format: float
          description: 0-100
        unique_clicks:
          type: integer
        click_rate:
          type: number
          format: float
          description: 0-100
        revenue:
          type: number
          format: decimal
        series:
          type: array
          items:
            $ref: '#/components/schemas/NamedSeries'
        messages:
          type: array
          items:
            $ref: '#/components/schemas/AutomationMessageRow'
      required:
      - workflow_id
      - name
      - contacts_total
      - contacts_finished
      - completion_rate
      - emails_sent
      - messages
      description: 'Per-automation overview: tiles, sends/opens/clicks over time (`series` keys sends, opens, clicks), and
        one row per message step.'
    CompletionBucket:
      type: object
      properties:
        label:
          type: string
          examples:
          - < 1 day
          - 1-3 days
        min_seconds:
          type: integer
        max_seconds:
          type: integer
        count:
          type: integer
      required:
      - label
      - count
    ContactCounts:
      type: object
      properties:
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
      required:
      - total
      - active
      - inactive
    ContactGroupRow:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        total:
          type: integer
        active:
          type: integer
        inactive:
          type: integer
        growth_pct:
          type: number
          format: float
          description: 0-100
      required:
      - id
      - name
      - total
      - active
    ContactPerformanceReport:
      type: object
      properties:
        current:
          $ref: '#/components/schemas/ContactCounts'
        previous:
          $ref: '#/components/schemas/ContactCounts'
        granularity:
          type: string
          enum:
          - DAY
          - WEEK
          - MONTH
        trend:
          type: array
          items:
            $ref: '#/components/schemas/NamedSeries'
        top_lists:
          type: array
          items:
            $ref: '#/components/schemas/ContactGroupRow'
        top_tags:
          type: array
          items:
            $ref: '#/components/schemas/ContactGroupRow'
      required:
      - current
      - previous
      - trend
      - top_lists
      - top_tags
      description: Total / active / inactive contacts vs the previous period, trend lines (`trend` keys total, active, inactive)
        and the top-5 lists and tags.
    ConversionRate:
      type: object
      properties:
        period:
          type: string
        leads_created:
          type: integer
          format: int32
        opportunities_created:
          type: integer
          format: int32
        opportunities_won:
          type: integer
          format: int32
        opportunities_lost:
          type: integer
          format: int32
        lead_to_opp_rate:
          type: number
          format: float
        opp_to_won_rate:
          type: number
          format: float
        overall_conversion_rate:
          type: number
          format: float
        total_won_revenue:
          type: number
          format: decimal
      required:
      - period
      - leads_created
      - opportunities_created
      - opportunities_won
      - opportunities_lost
      - lead_to_opp_rate
      - opp_to_won_rate
      - overall_conversion_rate
      - total_won_revenue
      description: Conversion rate analytics with breakdown by source
    Dashboard:
      type: object
      properties:
        id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        name:
          type: string
        is_default:
          type: boolean
        widgets:
          type: array
          items:
            $ref: '#/components/schemas/DashboardWidget'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
      required:
      - id
      - user_id
      - name
      - widgets
    DashboardRequest:
      type: object
      properties:
        name:
          type: string
        is_default:
          type: boolean
    DashboardWidget:
      type: object
      properties:
        id:
          type: string
          format: uuid
        title:
          type: string
        kind:
          type: string
          enum:
          - NUMBER
          - NUMBERS
          - LINE
          - BAR
          - TABLE
        query:
          $ref: '#/components/schemas/WidgetQuery'
        prompt:
          type: string
          description: The natural-language ask the widget was built from, if any
        position:
          type: integer
        width:
          type: integer
          enum:
          - 1
          - 2
        schedule:
          $ref: '#/components/schemas/ReportSchedule'
        refreshed_at:
          type: string
          format: date-time
      required:
      - id
      - title
      - kind
      - query
    DealForecastReport:
      type: object
      properties:
        pipeline_id:
          type: string
          format: uuid
        currency:
          type: string
        basis:
          $ref: '#/components/schemas/ForecastBasis'
        granularity:
          type: string
          enum:
          - WEEK
          - MONTH
          - QUARTER
        periods:
          type: array
          items:
            $ref: '#/components/schemas/ForecastPeriod'
        accuracy:
          type: array
          items:
            $ref: '#/components/schemas/ForecastAccuracyEntry'
        generated_at:
          type: string
          format: date-time
      required:
      - pipeline_id
      - basis
      - granularity
      - periods
      description: 'Deal Forecast: expected revenue per period bucketed by expected close date and weighted by the chosen
        basis; `accuracy` compares past forecasts with what closed.'
    DealFunnelReport:
      type: object
      properties:
        pipeline_id:
          type: string
          format: uuid
        currency:
          type: string
        stages:
          type: array
          items:
            $ref: '#/components/schemas/FunnelStage'
        won_count:
          type: integer
        won_value:
          type: number
          format: double
        lost_count:
          type: integer
        overall_conversion_pct:
          type: number
          format: float
          description: 0-100
      required:
      - pipeline_id
      - stages
      - won_count
      - lost_count
      - overall_conversion_pct
      description: 'Funnel report for one pipeline: stage-to-stage progression percentages and time in stage.'
    DealOverviewReport:
      type: object
      properties:
        currency:
          type: string
        totals:
          $ref: '#/components/schemas/DealTotals'
        value_brackets:
          type: array
          items:
            $ref: '#/components/schemas/DealValueBracket'
        by_owner:
          type: array
          items:
            $ref: '#/components/schemas/DealOwnerRow'
        by_stage:
          type: array
          items:
            $ref: '#/components/schemas/DealStageRow'
        created_per_period:
          type: array
          items:
            $ref: '#/components/schemas/PeriodCount'
      required:
      - currency
      - totals
      - value_brackets
      - by_owner
      - by_stage
      description: 'Deal Overview report: totals, deal-value histogram, owner table, stage table, deals created over time.'
    DealOwnerOverviewReport:
      type: object
      properties:
        currency:
          type: string
        owners:
          type: array
          items:
            $ref: '#/components/schemas/DealOwnerRow'
        period:
          type: string
      required:
      - currency
      - owners
      description: 'Deal Owner Overview: one row per owner with created/won/lost/value/avg/time-to-close/tasks completed.'
    DealOwnerRow:
      type: object
      properties:
        user_id:
          type: string
          format: uuid
        name:
          type: string
        open_count:
          type: integer
        open_value:
          type: number
          format: double
        won_count:
          type: integer
        won_value:
          type: number
          format: double
        lost_count:
          type: integer
        lost_value:
          type: number
          format: double
        win_rate:
          type: number
          format: float
          description: 0-100
        avg_deal_value:
          type: number
          format: double
        avg_days_to_close:
          type: number
          format: float
        deals_created:
          type: integer
        tasks_completed:
          type: integer
        last_activity_at:
          type: string
          format: date-time
      required:
      - user_id
      - open_count
      - open_value
      - won_count
      - won_value
      - lost_count
      - lost_value
      - win_rate
      description: One owner's line in the overview / owner-overview tables
    DealStageRow:
      type: object
      properties:
        stage_id:
          type: string
          format: uuid
        name:
          type: string
        count:
          type: integer
        value:
          type: number
          format: double
        weighted_value:
          type: number
          format: double
      required:
      - stage_id
      - name
      - count
      - value
    DealTotals:
      type: object
      properties:
        open_count:
          type: integer
        open_value:
          type: number
          format: double
        won_count:
          type: integer
        won_value:
          type: number
          format: double
        lost_count:
          type: integer
        lost_value:
          type: number
          format: double
        win_rate:
          type: number
          format: float
          description: 0-100
        avg_deal_value:
          type: number
          format: double
        avg_days_to_close:
          type: number
          format: float
      required:
      - open_count
      - open_value
      - won_count
      - won_value
      - lost_count
      - lost_value
      - win_rate
    DealValueBracket:
      type: object
      properties:
        label:
          type: string
          examples:
          - $1k - $5k
        min:
          type: number
          format: double
        max:
          oneOf:
          - type: number
            format: double
          - type: 'null'
          description: null = open-ended top bracket
        count:
          type: integer
        value:
          type: number
          format: double
      required:
      - label
      - count
      - value
      description: One bar of the deal-value histogram. Brackets are tenant settings (default 0-1k, 1k-5k, 5k-25k, 25k+).
    EmailClientRow:
      type: object
      properties:
        client:
          type: string
          examples:
          - Gmail
          - Apple Mail
          - Outlook
        family:
          type: string
          enum:
          - WEBMAIL
          - DESKTOP
          - MOBILE
          - OTHER
        opens:
          type: integer
        share_pct:
          type: number
          format: float
          description: 0-100
      required:
      - client
      - opens
    EmailClientTrendsReport:
      type: object
      properties:
        total_opens:
          type: integer
        clients:
          type: array
          items:
            $ref: '#/components/schemas/EmailClientRow'
        by_family:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
      required:
      - total_opens
      - clients
    FieldBreakdownReport:
      type: object
      properties:
        entity:
          type: string
          enum:
          - CONTACT
          - DEAL
          - ACCOUNT
        field_id:
          type: string
          format: uuid
        field_label:
          type: string
        values:
          type: array
          items:
            $ref: '#/components/schemas/NameCount'
        blank:
          type: integer
      required:
      - entity
      - field_id
      - values
      description: Count of records per value of one (custom or standard) field.
    ForecastAccuracyEntry:
      type: object
      required:
      - period
      - expected
      - actual
      - variance
      - variance_pct
      properties:
        period:
          type: string
        expected:
          type: number
          format: double
        actual:
          type: number
          format: double
        variance:
          type: number
          format: double
        variance_pct:
          type: number
          format: float
      description: Forecast accuracy comparison (forecasted vs actual)
    ForecastBasis:
      type: string
      enum:
      - STAGE_PROBABILITY
      - DEAL_PROBABILITY
      - OPEN_VALUE
      description: 'How weighted value is computed: stage probability (Stage.probability), per-deal win probability (ML /
        manual), or unweighted open value'
    ForecastDeal:
      type: object
      properties:
        deal_id:
          type: string
          format: uuid
        title:
          type: string
        owner_id:
          type: string
          format: uuid
        stage_id:
          type: string
          format: uuid
        value:
          type: number
          format: double
        probability:
          type: number
          format: float
          description: 0-100
        weighted_value:
          type: number
          format: double
        expected_close_date:
          type: string
          format: date
      required:
      - deal_id
      - title
      - value
      - probability
      - weighted_value
    ForecastEntry:
      type: object
      properties:
        period:
          type: string
          description: Month/quarter string (e.g., "2026-06")
        weighted_pipeline:
          type: number
          format: double
        expected_close_revenue:
          type: number
          format: decimal
        confidence:
          type: number
          format: float
          minimum: 0
          maximum: 100
        actual_close_revenue:
          type: number
          format: decimal
        variance:
          type: number
          format: double
      required:
      - period
      - weighted_pipeline
      - expected_close_revenue
      - confidence
      - actual_close_revenue
      - variance
      description: A single forecast entry for a period
    ForecastPeriod:
      type: object
      properties:
        period:
          type: string
        open_count:
