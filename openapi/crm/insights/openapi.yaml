openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Insights
  version: v1.0.0
  description: 'What it adds up to: report read models (deals, contacts, email, automations, revenue, analytics), dashboards
    and prompt-built widgets, and rule-based named scores with their explanations.'
  x-api-docs:
    service: insights
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/insights
  description: Local development (port from port-registry)
- url: /api/v1/crm/insights
  description: CRM Insights API
tags:
- name: analytics
  description: Analytics
- name: automation-reports
  description: 'Automation reports: all automations, per-automation overview / goals / contacts, jump-to tracking, automated
    1:1 emails'
- name: contact-reports
  description: 'Contact reports: performance (active / inactive, trends, top lists and tags), field breakdown, nearby contacts,
    tag trends'
- name: conversion
  description: Lead-to-revenue conversion analytics
- name: dashboards
  description: Per-user dashboards of widgets (a saved metric query each), with per-widget scheduled email
- name: deal-reports
  description: 'Deal reports: overview, owner overview, funnel, sales performance, forecast (crm/pipeline deals)'
- name: email-reports
  description: 'Email engagement reports across campaigns and automations: client trends, open/read trends by weekday and
    hour, predictive-content variants'
- name: forecast
  description: Revenue forecasting
- name: performance
  description: Rep and team performance metrics
- name: pipeline
  description: Pipeline health and revenue summary
- name: reports
  description: Custom report builder and scheduling
- name: revenue-reports
  description: Marketing revenue attributed to campaigns and automation emails from conversions (crm/marketing) within an
    attribution window
- name: scores
  description: Scores
- name: task-reports
  description: 'Task overview: load, completion and outcome sentiment per rep (crm/tasks)'
- name: win-loss
  description: Win rate and loss analysis
paths:
  /analytics/automations:
    get:
      operationId: get_automation_analytics
      summary: Automations over the period
      tags:
      - analytics
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationAnalytics'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: from
        in: query
        schema:
          type: string
          format: date
      - name: to
        in: query
        schema:
          type: string
          format: date
      x-brrtrouter-impl: true
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /analytics/conversion-rates:
    get:
      operationId: get_conversion_rates
      summary: Get conversion rates by period
      tags:
      - conversion
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: period
        in: query
        schema:
          type: string
          enum:
          - WEEK
          - MONTH
          - QUARTER
          - YEAR
          default: MONTH
      - name: start_date
        in: query
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Conversion rates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedConversionrate'
              examples:
                default:
                  items:
                  - period: monthly
                    total_leads: 500
                    converted: 62
                    rate: 12.4
                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '429':
          $ref: '#/components/responses/TooManyRequests'
