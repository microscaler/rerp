    action: receive
    channel:
      $ref: '#/channels/from_sales'
    summary: crm/insights consumes lead.created, lead.stage_changed, lead.converted, deal.created, deal.updated, deal.stage_changed,
      deal.won, deal.lost, deal.reopened, task.created, task.completed, task.reopened
    messages:
    - $ref: '#/channels/from_sales/messages/leadCreated'
    - $ref: '#/channels/from_sales/messages/leadStageChanged'
