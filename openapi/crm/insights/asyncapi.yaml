operations:
  publish:
    action: send
    channel:
      $ref: '#/channels/published'
    summary: crm/insights publishes its events
    messages:
    - $ref: '#/channels/published/messages/scoreChanged'
    - $ref: '#/channels/published/messages/erasureCompleted'
  consume_acquisition:
    action: receive
    channel:
      $ref: '#/channels/from_acquisition'
    summary: crm/insights consumes form.submitted, site.visited, event.recorded, ad.clicked, conversion.recorded, ad_audience.synced,
      ad_buy.changed
    messages:
    - $ref: '#/channels/from_acquisition/messages/formSubmitted'
    - $ref: '#/channels/from_acquisition/messages/siteVisited'
    - $ref: '#/channels/from_acquisition/messages/eventRecorded'
    - $ref: '#/channels/from_acquisition/messages/adClicked'
    - $ref: '#/channels/from_acquisition/messages/conversionRecorded'
    - $ref: '#/channels/from_acquisition/messages/adAudienceSynced'
    - $ref: '#/channels/from_acquisition/messages/adBuyChanged'
  consume_audience:
    action: receive
    channel:
      $ref: '#/channels/from_audience'
    summary: crm/insights consumes contact.created, contact.updated, contact.merged, contact.archived, contact.erased, subscription.changed,
      tag.added, tag.removed, organisation.created, organisation.updated
    messages:
    - $ref: '#/channels/from_audience/messages/contactCreated'
    - $ref: '#/channels/from_audience/messages/contactUpdated'
    - $ref: '#/channels/from_audience/messages/contactMerged'
    - $ref: '#/channels/from_audience/messages/contactArchived'
    - $ref: '#/channels/from_audience/messages/contactErased'
    - $ref: '#/channels/from_audience/messages/subscriptionChanged'
    - $ref: '#/channels/from_audience/messages/tagAdded'
    - $ref: '#/channels/from_audience/messages/tagRemoved'
    - $ref: '#/channels/from_audience/messages/organisationCreated'
    - $ref: '#/channels/from_audience/messages/organisationUpdated'
  consume_automation:
    action: receive
    channel:
      $ref: '#/channels/from_automation'
    summary: crm/insights consumes enrolment.started, enrolment.step_completed, enrolment.goal_reached, enrolment.completed,
      enrolment.stopped, enrolment.failed, workflow.activated, workflow.paused
    messages:
    - $ref: '#/channels/from_automation/messages/enrolmentStarted'
    - $ref: '#/channels/from_automation/messages/enrolmentStepCompleted'
    - $ref: '#/channels/from_automation/messages/enrolmentGoalReached'
    - $ref: '#/channels/from_automation/messages/enrolmentCompleted'
    - $ref: '#/channels/from_automation/messages/enrolmentStopped'
    - $ref: '#/channels/from_automation/messages/enrolmentFailed'
