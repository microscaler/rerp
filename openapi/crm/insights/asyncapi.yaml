components:
  messages:
    scoreChanged:
      name: score.changed
      title: score.changed
      summary: A contact or deal score changed band or value.
      description: 'A contact or deal score changed band or value.


        Published by: `POST /scores/{id}/recalculate`


        Consumed by: crm/audience, crm/automation.'
      traits:
      - $ref: '#/components/messageTraits/envelope'
      payload:
        type: object
        required:
        - event_id
        - event_type
        - workspace_id
        - occurred_at
        - producer
        - data
        properties:
          event_id:
            type: string
            format: uuid
            description: Idempotency key for consumers
          event_type:
            type: string
            const: score.changed
          workspace_id:
            type: string
            format: uuid
          occurred_at:
            type: string
            format: date-time
          producer:
            type: string
            const: crm/insights
          actor:
            type: object
            properties:
              kind:
                type: string
                enum:
                - USER
                - API_KEY
                - SYSTEM
                - CONTACT
                - ANONYMOUS
              id:
                type: string
                description: Sesame user id, API key id, or contact id
          request_id:
            type: string
            description: X-Request-Id of the call that caused it, when there was one
          entity_id:
            type: string
            description: Id of the entity the event is about (also the ordering key)
          data:
            $ref: '#/components/schemas/ScoreChange'
    erasureCompleted:
      name: erasure.completed
      title: erasure.completed
      summary: A service erased its copy for a data request.
      description: 'A service erased its copy for a data request.


        Published by the service''s workers.


        Consumed by: crm/workspace.'
      traits:
      - $ref: '#/components/messageTraits/envelope'
      payload:
        type: object
        required:
        - event_id
        - event_type
        - workspace_id
        - occurred_at
        - producer
        - data
        properties:
          event_id:
            type: string
            format: uuid
            description: Idempotency key for consumers
          event_type:
            type: string
            const: erasure.completed
          workspace_id:
            type: string
            format: uuid
          occurred_at:
            type: string
            format: date-time
          producer:
            type: string
            const: crm/<service>
          actor:
            type: object
            properties:
              kind:
                type: string
                enum:
                - USER
                - API_KEY
                - SYSTEM
                - CONTACT
                - ANONYMOUS
              id:
                type: string
                description: Sesame user id, API key id, or contact id
          request_id:
            type: string
            description: X-Request-Id of the call that caused it, when there was one
          entity_id:
            type: string
            description: Id of the entity the event is about (also the ordering key)
          data:
            $ref: '#/components/schemas/ErasureCompleted'
  schemas:
    ScoreChange:
      type: object
      required:
      - score_id
      - entity
      - entity_id
      - score
      - band
      properties:
        score_id:
          type: string
          format: uuid
        score_name:
          type: string
        entity:
          type: string
          enum:
          - CONTACT
          - DEAL
        entity_id:
          type: string
          format: uuid
        score:
          type: integer
        previous_score:
          type: integer
        band:
          type: string
          enum:
          - COLD
          - WARM
          - HOT
        previous_band:
          type: string
          enum:
          - COLD
          - WARM
          - HOT
    ErasureCompleted:
      type: object
      required:
      - data_request_id
      - service
      - rows_erased
      properties:
        data_request_id:
          type: string
          format: uuid
        service:
          type: string
        rows_erased:
          type: integer
          format: int64
  messageTraits:
    envelope:
      bindings:
        googlepubsub:
          bindingVersion: 0.2.0
          orderingKey: entity id (per-entity ordering)
          attributes:
            type: object
            required:
            - event_type
            - workspace_id
            properties:
              event_type:
                type: string
              workspace_id:
                type: string
                format: uuid
              schema_version:
                type: string
                const: '1'
