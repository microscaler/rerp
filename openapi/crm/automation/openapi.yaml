      - REMOVE_TAG
      - SUBSCRIBE_LIST
      - UNSUBSCRIBE_LIST
      - ADJUST_SCORE
      - NOTIFY
      - CREATE_DEAL
      - UPDATE_DEAL_STAGE
      - ADD_NOTE
      - START_WORKFLOW
      - STOP_WORKFLOW
      - SEND_1TO1_EMAIL
      - SEND_TRANSACTIONAL
      - INTERNAL_NOTIFICATION
      - CONVERT
      - ARCHIVE_CONTACT
      - COMPLETE_TASK
      - UPDATE_DEAL_OWNER
      - UPDATE_DEAL_VALUE
      - UPDATE_DEAL_STATUS
      - UPDATE_DEAL_TITLE
      - UPDATE_DEAL_FIELD
      - ADD_TO_AD_AUDIENCE
      - REMOVE_FROM_AD_AUDIENCE
      - ADD_DEAL_NOTE
      - ADJUST_DEAL_SCORE
      - UPDATE_ACCOUNT_FIELD
      - UPDATE_ACCOUNT_OWNER
      - ADD_ACCOUNT_NOTE
      - ADD_TO_ACCOUNT
      - FORMAT_DATA
      - END
      description: Enum of action types. NOTIFY is the older name of INTERNAL_NOTIFICATION; SEND_EMAIL of SEND_MESSAGE. See WorkflowStep.action_config for each type's configuration.
    ConditionOperator:
      type: string
      enum:
      - EQUALS
      - NOT_EQUALS
