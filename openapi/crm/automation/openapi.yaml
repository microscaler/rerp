      enum:
      - STAGE_CHANGE
      - FIELD_CHANGE
      - TIME_BASED
      - WEBHOOK
      - MANUAL
      - ON_CREATE
      - ON_UPDATE
      - ON_DELETE
      - SUBSCRIBED_TO_LIST
      - UNSUBSCRIBED_FROM_LIST
      - TAG_ADDED
      - TAG_REMOVED
      - FORM_SUBMITTED
      - MESSAGE_OPENED
      - MESSAGE_CLICKED
      - MESSAGE_REPLIED
      - MESSAGE_BOUNCED
      - SITE_VISIT
      - CUSTOM_EVENT
      - SCORE_CHANGED
      - DATE_FIELD
      - DEAL_CREATED
      - DEAL_STAGE_CHANGE
      - DEAL_WON
      - DEAL_LOST
      - DEAL_VALUE_CHANGED
      - DEAL_STATUS_CHANGED
      - DEAL_FIELD_CHANGED
      - ENTERED_PIPELINE
