openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Automation
  version: v1.0.0
  description: 'What happens next: workflows and their versioned step graphs, the trigger and action catalogue, recipes, enrolments
    with step history and durable timers.'
  x-api-docs:
    service: automation
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/automation
  description: Local development (port from port-registry)
- url: /api/v1/crm/automation
  description: CRM Automation API
tags:
- name: actions
  description: Scheduled and manual actions
- name: automation-execution
  description: Workflow execution and run history
- name: enrolments
  description: Contacts moving through workflows
- name: rules
  description: Condition-action rules within workflows
- name: triggers
  description: Event hooks that fire workflows
- name: workflow-steps
  description: The step graph of a workflow (wait, if/else, split, goal)
- name: workflows
  description: Workflow definitions and management
paths:
  /actions/recurring:
    post:
      operationId: schedule_recurring_action
      summary: Schedule a recurring action
      tags:
      - actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RecurringActionRequest'
        description: Schedule a recurring action with a defined interval
      responses:
        '201':
          description: Recurring action scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledAction'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000026
                  type: email
                  scheduled_at: '2024-01-16T10:00:00Z'
                  status: pending
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new actions
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /actions/schedule:
    post:
      operationId: schedule_action
      summary: Schedule a one-time action
      tags:
      - actions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleActionRequest'
        description: Schedule a one-time action at a specific time
      responses:
        '201':
          description: Action scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledAction'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000026
                  type: email
                  scheduled_at: '2024-01-16T10:00:00Z'
                  status: pending
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Schedule a report to run on a recurring basis
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
  /actions/upcoming:
    get:
      operationId: list_upcoming_actions
      summary: List upcoming scheduled actions
      tags:
      - actions
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Upcoming actions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ScheduledActionPage'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: List all actions
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /catalog:
    get:
      operationId: get_automation_catalog
      summary: Triggers and actions
      tags:
      - workflows
      responses:
        '200':
          description: Catalog
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutomationCatalog'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /contacts/{id}/enrolments:
    get:
      operationId: list_contact_enrolments
      summary: Every workflow a contact is or was in
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Enrolments
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Enrolment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /deals/{id}/enrolments:
    get:
      operationId: list_deal_enrolments
      summary: Automations a deal is in
      tags:
      - enrolments
      responses:
        '200':
          description: Page of enrolments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/EnrolmentPage'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Id'
      x-brrtrouter-impl: true
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /enrolments/{id}:
    get:
      operationId: get_enrolment
      summary: One contact's progress through a workflow
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Enrolment with its step history
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /enrolments/{id}/jump:
    post:
      operationId: jump_enrolment
      summary: Move a contact to a given step now
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - step_id
              properties:
                step_id:
                  type: string
                  format: uuid
      responses:
        '200':
          description: Moved
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /enrolments/{id}/retry:
    post:
      operationId: retry_enrolment
      summary: Retry a failed enrolment from its failing step
      tags:
      - enrolments
      responses:
        '202':
          description: Retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/Unprocessable'
      description: 409 unless the enrolment is FAILED. Earlier steps are not repeated.
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      security:
      - bearerAuth: []
      x-required-role:
      - owner
      - admin
      - marketer
  /enrolments/{id}/stop:
    post:
      operationId: stop_enrolment
      summary: Remove a contact from the workflow
      tags:
      - enrolments
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Stopped
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Enrolment'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /recipes:
    get:
      operationId: list_workflow_recipes
      summary: Starter workflows (welcome series, abandoned signup, re-engagement, post-purchase)
      tags:
      - workflows
      responses:
        '200':
          description: Recipes
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowRecipe'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
  /recipes/import:
    post:
      operationId: import_workflow_recipe
      summary: Add a recipe to the workspace's library from a URL or an uploaded definition
      tags:
      - workflows
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                url:
                  type: string
                  format: uri
                definition:
                  type: object
      responses:
        '201':
          description: Recipe added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkflowRecipe'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/IdempotencyKey'
      x-required-role:
      - owner
      - admin
      - marketer
  /recipes/{id}/instantiate:
    post:
      operationId: instantiate_workflow_recipe
      summary: Create an inactive workflow from a recipe
      tags:
      - workflows
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/IdempotencyKey'
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                bindings:
                  type: object
                  additionalProperties:
                    type: string
                  description: Parameter key -> value; any parameter left out stays unbound (see /workflows/{id}/setup)
                list_id:
                  type: string
                  format: uuid
                  deprecated: true
                  description: Shorthand for bindings.list
      responses:
        '201':
          description: Workflow created from the recipe
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
  /rules:
    get:
      operationId: list_rules
      summary: List all rules across workflows
      tags:
      - rules
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: filter_workflow_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: List of rules
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RulePage'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  limit: 20
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Get workflow rules
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    post:
      operationId: create_rule
      summary: Create a standalone rule (adds to a workflow)
      tags:
      - rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateRuleRequest'
            examples:
              default:
                name: Assign to region A
                condition:
                  field: region
                  operator: equals
                  value: A
                action:
                  type: assign
                  value: team-001
        description: Create a new workflow rule
      responses:
        '201':
          description: Rule created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000008
                  name: Assign to region A
                  condition:
                    field: region
                    operator: equals
                    value: A
                  action:
                    type: assign
                    value: team-001
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Get workflow rules
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /rules/test:
    post:
      operationId: test_rule
      summary: Test a rule against a sample lead
      tags:
      - rules
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                rule_id:
                  type: string
                  format: uuid
                lead_data:
                  type: object
                  description: Sample lead data for evaluation
        description: Test a workflow rule with sample data to verify conditions and actions
      responses:
        '200':
          description: Rule test result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RuleTestResult'
              examples:
                default:
                  rule_id: 00000000-0000-0000-0000-000000000008
                  test_passed: true
                  matched: true
                  evaluation_time_ms: 12
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Get workflow rules
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      x-required-role:
      - owner
      - admin
      - marketer
  /rules/{id}:
    get:
      operationId: get_rule
      summary: Get rule by id
      tags:
      - rules
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Rule details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000008
                  name: Assign to region A
                  condition:
                    field: region
                    operator: equals
                    value: A
                  action:
                    type: assign
                    value: team-001
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '404':
          $ref: '#/components/responses/NotFound'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '429':
          $ref: '#/components/responses/TooManyRequests'
      security:
      - bearerAuth: []
      description: Get workflow rules
      x-brrtrouter-impl: true
      x-required-role:
      - owner
      - admin
      - marketer
      - sales
      - read-only
    put:
      operationId: update_rule
      summary: Update rule
      tags:
      - rules
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateRuleRequest'
            examples:
              default:
                name: Assign to region A
                condition:
                  field: region
                  operator: equals
                  value: A
                action:
                  type: assign
                  value: team-001
        description: Update an existing rule
      responses:
        '200':
          description: Rule updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Rule'
              examples:
                default:
                  id: 00000000-0000-0000-0000-000000000008
                  name: Assign to region A
                  condition:
                    field: region
                    operator: equals
                    value: A
                  action:
                    type: assign
                    value: team-001
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Resource updated successfully
        '401':
          $ref: '#/components/responses/Unauthorized'
        '429':
          $ref: '#/components/responses/TooManyRequests'
        '422':
          $ref: '#/components/responses/Unprocessable'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Get workflow rules
      x-required-role:
      - owner
      - admin
      - marketer
    delete:
      operationId: delete_rule
      summary: Delete rule
      tags:
      - rules
      parameters:
      - $ref: '#/components/parameters/WorkspaceId'
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Rule deleted
        '404':
          $ref: '#/components/responses/NotFound'
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
