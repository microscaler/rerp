      x-brrtrouter-impl: true
components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Page number for pagination (1-indexed)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      description: 'Maximum number of items per page (default: 20, max: 100)'
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Search query string for filtering resources
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier for the resource
  schemas:
    Workflow:
      type: object
      required:
      - id
      - name
      - is_active
      - sequence
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        description:
          type: string
        is_active:
          type: boolean
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTrigger'
          description: |
            Several start triggers per workflow; a contact enters when any one fires (subject to its own `runs`
            and `segment`). A workflow with no triggers is entered only by enrolment (manual, segment, or
            START_WORKFLOW from another workflow).
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
          deprecated: true
          description: Single-trigger form; `triggers[0]` since the multi-trigger model. Kept for rules-style workflows.
        trigger_config:
          type: object
          deprecated: true
          description: Trigger-specific configuration (JSON) for `trigger_type`
        action_type:
          $ref: '#/components/schemas/ActionType'
          description: Single-action form (a rule); graph workflows use `entry_step_id` and /workflows/{id}/steps instead
        action_config:
          type: object
          description: Action-specific configuration (JSON) for `action_type`
        conditions:
          type: object
          description: Additional AND/OR conditions (JSON)
        exit_rules:
          $ref: '#/components/schemas/ExitRules'
        unsubscribe_scope:
          type: string
          enum:
          - TRIGGER_LISTS
          - ALL_LISTS
          - NONE
          description: |
            Which lists an unsubscribe link in one of this workflow's messages applies to: the lists named by its
            triggers and subscribe actions (default), every list, or none (the link is omitted; transactional-like).
        access_group_ids:
          type: array
          items:
            type: string
            format: uuid
          description: crm/teams groups that may open and edit this workflow; empty means admins only
        tracking:
          type: object
          description: Report this workflow's entries and completions against a business goal and/or a conversion (crm/marketing)
          properties:
            goal_id:
              type: string
              format: uuid
            conversion_id:
              type: string
              format: uuid
        recipe_id:
          type: string
          description: The recipe this was instantiated from, if any
        bindings:
          type: object
          additionalProperties:
            type: string
          description: Recipe parameter key -> bound value (an id, a tag, a URL, or a JSON condition tree as a string)
        unbound_parameters:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/RecipeParameter'
          description: Parameters still to bind; non-empty blocks activation (UNBOUND_PARAMETER)
        notes:
          type: array
          items:
            $ref: '#/components/schemas/StepNote'
          description: Notes on the workflow as a whole (the builder shows them on the trigger block)
        entry_step_id:
          type: string
          format: uuid
          description: First step of the graph (see /workflows/{id}/steps); absent for single-action workflows
        reentry:
          $ref: '#/components/schemas/ReentryRule'
        status:
          type: string
          enum:
          - DRAFT
          - ACTIVE
          - PAUSED
          readOnly: true
        active_enrolments:
          type: integer
          format: int64
          readOnly: true
        completed_enrolments:
          type: integer
          format: int64
          readOnly: true
        sequence:
          type: integer
          format: int32
          description: Execution order (lower = earlier)
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
        run_count:
          type: integer
          format: int32
          readOnly: true
        last_run:
          type: string
          format: date-time
          readOnly: true
      description: An automation workflow that defines business logic for lead processing
    CreateWorkflowRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTrigger'
        exit_rules:
          $ref: '#/components/schemas/ExitRules'
        unsubscribe_scope:
          type: string
          enum: [TRIGGER_LISTS, ALL_LISTS, NONE]
        access_group_ids:
          type: array
          items: {type: string, format: uuid}
        reentry:
          $ref: '#/components/schemas/ReentryRule'
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
          deprecated: true
        trigger_config:
          type: object
        action_type:
          $ref: '#/components/schemas/ActionType'
        action_config:
          type: object
        conditions:
          type: object
        sequence:
          type: integer
          format: int32
        is_active:
          type: boolean
          default: true
      description: Request body for creating a new workflow automation
    UpdateWorkflowRequest:
      type: object
      properties:
        name:
          type: string
        description:
          type: string
        triggers:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowTrigger'
        exit_rules:
          $ref: '#/components/schemas/ExitRules'
        unsubscribe_scope:
          type: string
          enum: [TRIGGER_LISTS, ALL_LISTS, NONE]
        access_group_ids:
          type: array
          items: {type: string, format: uuid}
        reentry:
          $ref: '#/components/schemas/ReentryRule'
        tracking:
          type: object
          properties:
            goal_id: {type: string, format: uuid}
            conversion_id: {type: string, format: uuid}
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
          deprecated: true
        trigger_config:
          type: object
          deprecated: true
        action_type:
          $ref: '#/components/schemas/ActionType'
        action_config:
          type: object
        conditions:
          type: object
        sequence:
          type: integer
          format: int32
        is_active:
          type: boolean
      description: Request body for updating an existing workflow (partial; absent fields are unchanged)
    Rule:
      type: object
      required:
      - id
      - workflow_id
      - condition_field
      - condition_operator
      - sequence
      - is_active
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        condition_field:
          type: string
          maxLength: 128
        condition_operator:
          $ref: '#/components/schemas/ConditionOperator'
        condition_value:
          type: string
        condition_value_type:
          $ref: '#/components/schemas/ConditionValueType'
        action_type:
          $ref: '#/components/schemas/ActionType'
        action_config:
          type: object
          description: Action-specific configuration (JSON)
        is_active:
          type: boolean
        sequence:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
          readOnly: true
