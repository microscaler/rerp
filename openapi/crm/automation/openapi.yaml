        limit:
          type: integer
          format: int32
      description: A generic paginated response wrapper with items and pagination
        metadata
    PaginatedWorkflow:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Workflow'
      description: Paginated list of Workflow records
    PaginatedRule:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Rule'
      description: Paginated list of Rule records
    PaginatedTrigger:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Trigger'
      description: Paginated list of Trigger records
    StepKind:
      type: string
      enum:
      - ACTION
      - WAIT
      - IF_ELSE
      - SPLIT
      - GOAL
      - GOTO
      - END
      description: |
        ACTION runs one ActionType and continues. WAIT holds for a duration, until a date/time, until a contact
        date field, or until a condition is met (with an optional timeout). IF_ELSE evaluates conditions and
        takes the yes or no branch. SPLIT sends contacts down branches evenly, by percentage, as a test with a
        winning path, or to path A until a date/count. GOAL ("jump to") names a condition that, when met, moves the
        contact to this step from below it or from anywhere, and records the goal; a contact that reaches it
        without meeting the condition continues or waits (`goal.if_not_met`). GOTO moves the contact to any other
        step unconditionally and is terminal for its own branch (nothing follows it). END finishes the enrolment.
    WorkflowStep:
      type: object
      required:
      - id
      - kind
      properties:
        id:
          type: string
          format: uuid
          description: Stable across edits; enrolments point at it
        kind:
          $ref: '#/components/schemas/StepKind'
        label:
          type: string
          maxLength: 128
        next_step_id:
          type: string
          format: uuid
          description: ACTION, WAIT and GOAL continue here; absent means END
        action_type:
          $ref: '#/components/schemas/ActionType'
        action_config:
          type: object
          description: |
            ACTION: per type.
            SEND_MESSAGE {template_id, sender_id?} (a marketing message; needs list consent). SEND_1TO1_EMAIL
            {from_user_id, subject, text} (plain text, from a user's mailbox or sender identity with their reply-to).
            SEND_TRANSACTIONAL {transactional_template_id, variables}. INTERNAL_NOTIFICATION {subject, to[] (up to
            5 addresses or user ids), from_sender_id?, body, include_contact_link: bool} (staff only, no consent).
            SUBSCRIBE_LIST / UNSUBSCRIBE_LIST {list_ids[]}. ADD_TAG / REMOVE_TAG {tag}. UPDATE_FIELD {field, value}.
            ADD_NOTE {text}. ADJUST_SCORE {score_id, points}. CONVERT {conversion_id}. ARCHIVE_CONTACT {}.
            CREATE_TASK {title, description?, task_type_id, assignee: "OWNER"|user_id, due_after_seconds, deal: bool}
            (deal: true attaches it to the contact's open deal in `pipeline_id`). COMPLETE_TASK {task_type_id?,
            outcome?}. CREATE_DEAL {pipeline_id, stage_id, title, value?, owner: "OWNER"|user_id}. UPDATE_DEAL_STAGE
            {pipeline_id, stage_id}. UPDATE_DEAL_OWNER {user_id}. UPDATE_DEAL_VALUE {value|delta}. UPDATE_DEAL_STATUS
            {status}. UPDATE_DEAL_TITLE {title}. UPDATE_DEAL_FIELD {field, value}. ADD_DEAL_NOTE {text}.
            ADJUST_DEAL_SCORE {score_id, points}. UPDATE_ACCOUNT_FIELD {field, value}. UPDATE_ACCOUNT_OWNER
            {user_id}. ADD_ACCOUNT_NOTE {text}. ADD_TO_ACCOUNT {account_id|"FROM_EMAIL_DOMAIN"}.
            CALL_WEBHOOK {url, secret_id?}. START_WORKFLOW / STOP_WORKFLOW {workflow_id}.
            ADD_TO_AD_AUDIENCE / REMOVE_FROM_AD_AUDIENCE {audience_id} (crm/marketing `/ads/audiences`; the
            warm-up sequence is add → wait N days → send → remove on click).
            FORMAT_DATA {op: COPY|DATE_ADJUST|EXTRACT|MATH|CAPITALIZE, source_field, target_field, amount?, unit?,
            extract?: PHONE|URL, operator?: ADD|SUBTRACT|MULTIPLY|DIVIDE, operand?, case?: SENTENCE|TITLE|UPPER|LOWER}.
        wait:
          $ref: '#/components/schemas/WaitConfig'
        conditions:
          type: object
          description: |
            IF_ELSE and GOAL; the crm/contacts condition tree (AND/OR groups of field / tag / list status / form
            submitted / engagement / site / deal / score predicates; `{"segment_id": ...}` reuses a saved segment).
        yes_step_id:
          type: string
          format: uuid
        no_step_id:
          type: string
          format: uuid
        split:
          $ref: '#/components/schemas/SplitConfig'
        branches:
          type: array
          items:
            type: object
            required:
            - key
            properties:
              key:
                type: string
                description: A, B, C ...
              percent:
                type: integer
                format: int32
                description: PERCENT mode; percents sum to 100. Ignored (even) in the other modes.
              step_id:
                type: string
                format: uuid
          description: SPLIT paths, in order; `step_id` absent means the path ends at once
        goal:
          $ref: '#/components/schemas/GoalConfig'
        goto_step_id:
          type: string
          format: uuid
          description: GOTO target; any step of this workflow
        position:
          type: object
          description: Editor layout hint (x, y); opaque to the runtime
        notes:
          type: array
          items:
            $ref: '#/components/schemas/StepNote'
          description: Guidance and comments on the step; recipes ship with them
        unbound_parameters:
          type: array
          readOnly: true
          items:
            type: string
          description: Recipe parameters this step references that are not bound yet (the step cannot run)
    StepNote:
      type: object
      required:
      - text
      properties:
        id:
          type: string
          format: uuid
        text:
          type: string
          maxLength: 2000
        author:
          type: string
          description: A staff user id, or RECIPE
        created_at:
          type: string
          format: date-time
    WaitConfig:
      type: object
      properties:
        mode:
          type: string
          enum:
          - DURATION
          - UNTIL_DATETIME
          - UNTIL_CONDITION
          - UNTIL_DATE_FIELD
        seconds:
          type: integer
          format: int64
          description: DURATION
        until:
          type: string
          format: date-time
          description: UNTIL_DATETIME, an absolute instant
        until_pattern:
          type: object
          description: |
            UNTIL_DATETIME as a recurring pattern instead of an instant: the next matching day at `time`, where any
            of month/day/year may be left open ("any month, the 24th, at 08:00"). Evaluated in `timezone`.
          properties:
            month:
              type: integer
              format: int32
              minimum: 1
              maximum: 12
            day:
              type: integer
              format: int32
              minimum: 1
              maximum: 31
            year:
              type: integer
              format: int32
            time:
              type: string
              description: HH:MM
            timezone:
              type: string
              enum:
              - CONTACT
              - WORKSPACE
              description: The contact's own timezone (falling back to the workspace's) or the workspace's
        conditions:
          type: object
          description: UNTIL_CONDITION; the condition tree (see WorkflowStep.conditions)
        date_field:
          type: string
          description: UNTIL_DATE_FIELD; a contact date or datetime field (renewal_date, trial_ends_at, birthday)
        relation:
          type: string
          enum:
          - ON
          - BEFORE
          - AFTER
          description: UNTIL_DATE_FIELD; with `offset_seconds` as the distance for BEFORE/AFTER
        offset_seconds:
          type: integer
          format: int64
          description: UNTIL_DATE_FIELD; the distance before/after the field's date (BEFORE and AFTER); negative also means before
        if_date_passed:
          type: string
          enum:
          - CONTINUE
          - EXIT
          default: CONTINUE
          description: UNTIL_DATE_FIELD; when the target date has already passed as the contact arrives
        timeout_seconds:
          type: integer
          format: int64
          description: UNTIL_CONDITION; continue anyway after this long
        send_window:
          type: object
          description: Optional days/hours in the contact's timezone within which the wait may complete
          properties:
            days:
              type: array
              items:
                type: string
                enum:
                - MON
                - TUE
                - WED
                - THU
                - FRI
                - SAT
                - SUN
            from_hour:
              type: integer
              format: int32
            to_hour:
              type: integer
              format: int32
    SplitConfig:
      type: object
      required:
      - mode
      properties:
        mode:
          type: string
          enum:
          - EVEN
          - PERCENT
          - TEST
          - UNTIL
          description: |
            EVEN spreads contacts over `branches` equally. PERCENT uses `branches[].percent`. TEST spreads evenly
            until `test.until_date` or `test.until_count` contacts have been split, then sends everyone down the
            winning path (the one whose contacts best met `test.winner_conditions`). UNTIL sends everyone to
            path A until `until_date` or `until_count`, then to path B.
        test:
          type: object
          properties:
            until_date:
              type: string
              format: date
            until_count:
              type: integer
              format: int32
            winner_conditions:
              type: object
              description: The condition tree that defines success (opened, clicked, converted, tag added ...)
            winner_key:
              type: string
              readOnly: true
              description: Set once the test has decided
        until_date:
          type: string
          format: date
        until_count:
          type: integer
          format: int32
    GoalConfig:
      type: object
      properties:
        name:
          type: string
          maxLength: 128
        scope:
          type: string
          enum:
          - BELOW
          - ANYWHERE
          default: BELOW
          description: Contacts that may jump here when the conditions are met - only those below this step, or anywhere in the workflow
        if_not_met:
          type: string
          enum:
          - CONTINUE
          - WAIT
          default: CONTINUE
          description: A contact that reaches this step in sequence without meeting the conditions continues past it, or waits here until it does
        track:
          type: boolean
          description: Record a goal event (crm/marketing conversions report) when a contact meets it
    WorkflowSteps:
      type: object
      required:
      - workflow_id
      - entry_step_id
      - steps
      properties:
        workflow_id:
          type: string
          format: uuid
        entry_step_id:
          type: string
          format: uuid
        steps:
          type: array
          items:
            $ref: '#/components/schemas/WorkflowStep'
        version:
          type: integer
          format: int32
          readOnly: true
    StepGraphValidation:
      type: object
      required:
      - ok
      - problems
      properties:
        ok:
          type: boolean
        problems:
          type: array
          items:
            type: object
            required:
            - code
            - message
            properties:
              code:
                type: string
                enum:
                - ORPHAN_STEP
                - DANGLING_NEXT
                - BRANCH_PERCENT
                - TEMPLATE_KIND
                - MISSING_ENTRY
                - CYCLE_WITHOUT_WAIT
                - TEMPLATE_NOT_READY
                - NO_POSTAL_ADDRESS
                - UNBOUND_PARAMETER
                - TOO_MANY_RECIPIENTS
                - GOTO_HAS_NEXT
              step_id:
                type: string
                format: uuid
              message:
                type: string
    ReentryRule:
      type: string
      enum:
      - ONCE
      - MULTIPLE
      - CONCURRENT
      - RESTART
      description: |
        ONCE enrols a contact at most once ever; MULTIPLE allows a new enrolment only after the previous one has
        exited; CONCURRENT starts a new enrolment every time a trigger fires, even while one is active; RESTART
        stops the active enrolment and begins again.
    ExitRules:
      type: object
      description: When an enrolment ends early. Reaching END (or the last step) always ends it.
      properties:
        on_unsubscribe:
          type: boolean
          description: The contact unsubscribes from any message this workflow sent
        on_conversion:
          type: boolean
          description: Any conversion the workflow tracks (`tracking`) is recorded for the contact
        on_goal_reached:
          type: boolean
          description: A GOAL (jump-to) step's conditions are met
    WorkflowTrigger:
      type: object
      required:
      - type
      properties:
        id:
          type: string
          format: uuid
        type:
          $ref: '#/components/schemas/TriggerType'
        config:
          type: object
          description: |
            Per type (absent keys mean "any"):
            SUBSCRIBED_TO_LIST / UNSUBSCRIBED_FROM_LIST {list_id?}. TAG_ADDED / TAG_REMOVED {tag}. FORM_SUBMITTED
            {form_id?}. MESSAGE_OPENED / MESSAGE_CLICKED / MESSAGE_REPLIED / MESSAGE_FORWARDED / MESSAGE_SHARED /
            MESSAGE_BOUNCED {template_id?|campaign_id?, link_url?, list_id?, one_to_one?: ANY|AUTOMATED|DIRECT,
            network?: FACEBOOK|TWITTER|...}. SITE_VISIT {url_pattern} (`*` wildcard). CUSTOM_EVENT {event_type,
            value?}. ON_CREATE {}. FIELD_CHANGE {field, to?} ("changes ever" when `to` is absent). ACCOUNT_FIELD_CHANGED
            {field, to?}. SCORE_CHANGED {score_id, threshold, direction: ABOVE|BELOW}. DATE_FIELD {field (a contact or
            deal date field, or subscribed_at / created_at), relation: ON|BEFORE|AFTER, offset: {amount, unit:
            DAYS|WEEKS|MONTHS|YEARS}, days: DAILY|WEEKDAYS|WEEKENDS, hour: 0-23, timezone: CONTACT|WORKSPACE}.
            TIME_BASED {cron, timezone}. RSS_ITEM {feed_url, cadence: HOURLY|DAILY|WEEKDAYS|WEEKENDS, time, timezone}.
            DEAL_CREATED / ENTERED_PIPELINE {pipeline_id?}. DEAL_STAGE_CHANGE {pipeline_id, from_stage_id?,
            to_stage_id?}. DEAL_STATUS_CHANGED {to: OPEN|WON|LOST, pipeline_id?}. DEAL_WON / DEAL_LOST {pipeline_id?}.
            DEAL_VALUE_CHANGED / DEAL_FIELD_CHANGED {pipeline_id?, field?}. Any DEAL_* also takes {owner: {op:
            EQ|NEQ, user_id}}. TASK_COMPLETED {task_type_id?, outcome?}. GOAL_REACHED {workflow_id, goal_step_id,
            outcome: ACHIEVED|SKIPPED}. JUMPED_TO {from_workflow_id?}. FILE_DOWNLOADED {asset_id?}. WEBHOOK
            {secret_id}. MANUAL {}.
        runs:
          type: string
          enum:
          - ONCE
          - MULTIPLE
          default: ONCE
          description: Fire once per contact for this trigger, or every time the event happens (subject to the workflow's reentry rule)
        segment:
          type: object
          description: Optional condition tree; only contacts matching it enter through this trigger
    EnrolmentStatus:
      type: string
      enum:
      - ACTIVE
      - WAITING
      - COMPLETED
      - GOAL_REACHED
      - EXITED
      - RESTARTED
      - STOPPED
      - FAILED
      description: |
        ACTIVE is between steps, WAITING sits in a WAIT or a GOAL with if_not_met WAIT. COMPLETED reached END.
        EXITED left early (see Enrolment.exit_reason). RESTARTED was ended by a RESTART reentry. STOPPED was ended
        by a user or STOP_WORKFLOW. FAILED hit an unrecoverable error.
    ExitReason:
      type: string
      enum:
      - UNSUBSCRIBED
      - CONVERTED
      - GOAL_REACHED
      - DATE_PASSED
      - ARCHIVED
      - STOPPED_BY_WORKFLOW
      - STOPPED_BY_USER
      - WORKFLOW_ARCHIVED
      - RESTARTED
    Enrolment:
      type: object
      required:
      - id
      - workflow_id
      - contact_id
      - status
      - entered_at
      properties:
        id:
          type: string
          format: uuid
        workflow_id:
          type: string
          format: uuid
        workflow_name:
          type: string
          readOnly: true
        contact_id:
          type: string
          format: uuid
        contact_email:
          type: string
          readOnly: true
        status:
          $ref: '#/components/schemas/EnrolmentStatus'
        current_step_id:
          type: string
          format: uuid
        next_run_at:
          type: string
          format: date-time
          description: When the runtime will next act on this enrolment (WAITING)
        entered_by:
          type: string
          description: TRIGGER, MANUAL, SEGMENT, STARTED_BY_WORKFLOW, or a staff user id
        trigger_id:
          type: string
          format: uuid
          description: The WorkflowTrigger that fired (entered_by TRIGGER)
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
        trigger_subject:
          type: string
          description: What fired it, for the log - the list, tag, form or deal involved
        exit_reason:
          $ref: '#/components/schemas/ExitReason'
        split_paths:
          type: object
          readOnly: true
          description: SPLIT step id -> branch key, fixed on first assignment so a contact keeps its path
        goal_step_id:
          type: string
          format: uuid
          readOnly: true
        history:
          type: array
          readOnly: true
          items:
            $ref: '#/components/schemas/EnrolmentStepRecord'
        entered_at:
          type: string
          format: date-time
          readOnly: true
        ended_at:
          type: string
          format: date-time
          readOnly: true
    EnrolmentStepRecord:
      type: object
      required:
      - step_id
      - kind
      - at
      - outcome
      properties:
        step_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/StepKind'
        label:
          type: string
        at:
          type: string
          format: date-time
        outcome:
          type: string
          enum:
          - DONE
          - BRANCH_YES
          - BRANCH_NO
          - SPLIT
          - WAITED
          - TIMED_OUT
          - SKIPPED
          - ACHIEVED
          - JUMPED
          - SUPPRESSED
          - STEP_REMOVED
          - FAILED
          description: |
            ACHIEVED/SKIPPED for a GOAL reached in sequence; JUMPED for a contact pulled to a GOAL from elsewhere;
            SUPPRESSED for a send withheld for consent; STEP_REMOVED when the step was deleted under the contact.
        skip_reason:
          type: string
          description: SKIPPED/SUPPRESSED detail - NO_OPEN_DEAL, ALREADY_CONVERTED, NOT_SUBSCRIBED, TEMPLATE_NOT_READY ...
        left_at:
          type: string
          format: date-time
        send_id:
          type: string
          format: uuid
          description: crm/outreach send produced by a SEND_MESSAGE step
        error:
          type: string
    EnrolRequest:
      type: object
      required:
      - contact_ids
      properties:
        contact_ids:
          type: array
          items:
            type: string
            format: uuid
          maxItems: 1000
        start_step_id:
          type: string
          format: uuid
          description: Defaults to the entry step
    EnrolResult:
      type: object
      required:
      - enrolled
      - already_active
      - excluded
      properties:
        enrolled:
          type: integer
          format: int32
        already_active:
          type: integer
          format: int32
          description: Skipped by the reentry rule (ONCE or MULTIPLE with an active enrolment)
        excluded:
          type: integer
          format: int32
          description: Unsubscribed or suppressed contacts when the workflow sends messages
        skipped:
          type: array
          items:
            type: object
            properties:
              contact_id:
                type: string
                format: uuid
              reason:
                type: string
                enum: [ALREADY_ENROLLED, ALREADY_ACTIVE, EXCLUDED, ARCHIVED]
        enrolment_ids:
          type: array
          items:
            type: string
            format: uuid
    WorkflowMap:
      type: object
      required:
      - workflow_id
      - active
      - completed
      - steps
      properties:
        workflow_id:
          type: string
          format: uuid
        active:
          type: integer
          format: int64
        completed:
          type: integer
          format: int64
        goal_reached:
          type: integer
          format: int64
        stopped:
          type: integer
          format: int64
        steps:
          type: array
          items:
            type: object
            required:
            - step_id
            - kind
            - waiting_now
            - passed
            properties:
              step_id:
                type: string
                format: uuid
              kind:
                $ref: '#/components/schemas/StepKind'
              label:
                type: string
              waiting_now:
                type: integer
                format: int64
              passed:
                type: integer
                format: int64
              branch_yes:
                type: integer
                format: int64
              branch_no:
                type: integer
                format: int64
              sent:
                type: integer
                format: int64
              opened:
                type: integer
                format: int64
              clicked:
                type: integer
                format: int64
              failed:
                type: integer
                format: int64
    RecipeParameter:
      type: object
      required:
      - key
      - kind
      - label
      properties:
        key:
          type: string
        kind:
          type: string
          enum:
          - LIST
          - TAG
          - TEMPLATE
          - FORM
          - URL
          - FIELD
          - PIPELINE
          - STAGE
          - USER
          - CONVERSION
          - SCORE
          - CONDITION
          - TEXT
        label:
          type: string
        hint:
          type: string
        required:
          type: boolean
          default: true
        used_by_step_ids:
          type: array
          items:
            type: string
          readOnly: true
    WorkflowRecipe:
      type: object
      required:
      - id
      - name
      - category
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        category:
          type: string
          enum:
          - WELCOME
          - NURTURE
          - RE_ENGAGEMENT
          - SALES
          - POST_PURCHASE
          - EVENT
          - INTERNAL
        trigger_types:
          type: array
          items:
            $ref: '#/components/schemas/TriggerType'
        trigger_type:
          $ref: '#/components/schemas/TriggerType'
          deprecated: true
        parameters:
          type: array
          items:
            $ref: '#/components/schemas/RecipeParameter'
        source_url:
          type: string
          format: uri
          description: Set on a recipe imported from a URL
        industry:
          type: string
          description: Library grouping (Software, E-Commerce, Any ...)
        definition:
          type: object
          description: |
            The graph as the recipe files hold it (openapi/crm/automation/recipes/*.yaml): triggers, steps, templates,
            with `$list`, `$tag:<key>`, `$template:<key>`, `$url`, `$condition` placeholders where workspace
            references go. Returned by GET /recipes/{id}.
        step_count:
          type: integer
          format: int32
        needs_templates:
          type: integer
          format: int32
          description: AUTOMATION templates the user must supply or accept defaults for
    PaginatedEnrolment:
      allOf:
      - $ref: '#/components/schemas/PaginatedResponse'
      - type: object
        properties:
          items:
            type: array
            items:
              $ref: '#/components/schemas/Enrolment'
      description: Paginated list of Enrolment records
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
externalDocs:
  description: Automation API Reference
  url: https://docs.rerp.com/crm/automation/api-reference
