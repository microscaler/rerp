      - JUMPED_TO
      - GOAL_REACHED
      - AD_CLICKED
      description: Enum of trigger types (event-based, schedule-based, webhook-based). JUMPED_TO fires when a contact is moved into this workflow by another workflow's GOTO/START_WORKFLOW.
    ActionType:
      type: string
      enum:
      - SEND_EMAIL
      - SEND_MESSAGE
      - CREATE_TASK
      - UPDATE_FIELD
      - ASSIGN_LEAD
      - CALL_WEBHOOK
      - CREATE_RECORD
