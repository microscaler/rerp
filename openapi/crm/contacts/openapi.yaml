openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: Contacts
  version: v1.0.0
  description: Contact management service — contacts, org hierarchy, addresses.
  x-api-version: CRM Contacts API v1.0.0
  x-crm-api-version: v1.0.0
  termsOfService: https://rerp.example.com/terms
  contact:
    name: RERP API Support
    url: https://docs.rerp.com/support
    email: api-support@rerp.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-api-docs:
    service: contacts
    openapi_version: 3.1.0
    brrtrouter_version: latest
servers:
- url: http://localhost:10352/api/v1/crm/contacts
  description: Local development (direct to service, port from port-registry)
- url: /api/v1/crm/contacts
  description: Contacts API
tags:
- name: tags
  description: Tags on contacts
- name: segments
  description: Saved condition trees that select contacts
- name: contacts
  description: Contact CRUD
- name: contacts-accounts
  description: Contact-account associations
- name: contacts-hierarchy
  description: Contact tree and relationship management
- name: contacts-leads
  description: Contact-lead associations
- name: contacts-merge
  description: Contact deduplication and merge operations
- name: contacts-search
  description: Contact search and discovery operations
paths:
  /contacts:
    get:
      operationId: list_contacts
      summary: List contacts
      tags:
      - contacts
      parameters:
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      - name: search
        in: query
        schema:
          type: string
      - name: filter_company_id
        in: query
        schema:
          type: string
          format: uuid
      - name: filter_parent_id
        in: query
        schema:
          type: string
          format: uuid
      - name: filter_email
        in: query
        schema:
          type: string
          format: email
      - name: filter_active
        in: query
        schema:
          type: boolean
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  per_page: 20
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
        '404':
          description: Resource not found
      security:
      - bearerAuth: []
      description: List all contacts
      x-operation-id: get_contacts_list
      x-controller: rerp_crm::contacts::controller::contacts
      x-handler-name: contacts
    post:
      operationId: create_contact
      summary: Create a new contact
      tags:
      - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateContactRequest'
            examples:
              default: &id002
                first_name: Jane
                last_name: Smith
                email: jane@example.com
                phone: +1-555-0124
                title: Marketing Director
                account_id: 00000000-0000-0000-0000-000000000003
        description: Create a new contact person
      responses:
        '201':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                default: &id001
                  id: 00000000-0000-0000-0000-000000000002
                  first_name: Jane
                  last_name: Smith
                  email: jane@example.com
                  phone: +1-555-0124
                  title: Marketing Director
                  account_id: 00000000-0000-0000-0000-000000000003
                  created_at: '2024-01-15T10:30:00Z'
                  updated_at: '2024-01-15T10:30:00Z'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new contacts
      x-operation-id: post_contacts_list
      x-controller: rerp_crm::contacts::controller::contacts
      x-handler-name: contacts
  /contacts/search-by-email:
    get:
      operationId: search_contacts_by_email
      summary: Find contacts matching an email address
      tags:
      - contacts
      parameters:
      - name: email
        in: query
        required: true
        schema:
          type: string
          format: email
      responses:
        '200':
          description: Matching contacts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  per_page: 20
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Search contacts by email address
      x-operation-id: get_search-by-email
      x-controller: rerp_crm::contacts::controller::contacts::search-by-email
      x-handler-name: contacts_search-by-email
  /contacts/{id}:
    get:
      operationId: get_contact
      summary: Get contact by id
      tags:
      - contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Contact details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                default: *id001
        '404':
          description: Not found
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get contacts by ID
      x-operation-id: get_id_by_id
      x-controller: rerp_crm::contacts::controller::contacts::id
      x-handler-name: contacts_id
    put:
      operationId: update_contact
      summary: Update contact fields
      tags:
      - contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateContactRequest'
            examples:
              default: *id002
        description: Update an existing contact
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
              examples:
                default: *id001
        '400':
          description: Invalid request
        '404':
          description: Not found
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: Conflict — resource version mismatch or duplicate
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '204':
          description: Resource updated successfully
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Update contacts by ID
      x-operation-id: put_id_by_id
      x-controller: rerp_crm::contacts::controller::contacts::id
      x-handler-name: contacts_id
    delete:
      operationId: delete_contact
      summary: Soft-delete contact
      tags:
      - contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Contact deleted
        '404':
          description: Not found
        '403':
          description: Forbidden — insufficient permissions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized - Invalid or missing authentication token
      security:
      - bearerAuth: []
      description: Delete contacts by ID
      x-operation-id: delete_id_by_id
      x-controller: rerp_crm::contacts::controller::contacts::id
      x-handler-name: contacts_id
  /contacts/{id}/tree:
    get:
      operationId: get_contact_hierarchy
      summary: Get contact's org tree (parent + children)
      tags:
      - contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Org tree
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  per_page: 20
        '404':
          description: Not found
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get hierarchical tree structure
      x-operation-id: get_tree_by_id
      x-controller: rerp_crm::contacts::controller::contacts::id::tree
      x-handler-name: contacts_id_tree
  /contacts/{id}/leads:
    get:
      operationId: get_contact_related_leads
      summary: Get leads associated with a contact
      tags:
      - contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: page
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          default: 1
      - name: limit
        in: query
        schema:
          type: integer
          format: int32
          minimum: 1
          maximum: 100
          default: 20
      responses:
        '200':
          description: Related leads
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  per_page: 20
        '404':
          description: Not found
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get leads associated with a campaign
      x-operation-id: get_leads_by_id
      x-controller: rerp_crm::contacts::controller::contacts::id::leads
      x-handler-name: contacts_id_leads
  /contacts/{id}/accounts:
    get:
      operationId: get_contact_accounts
      summary: Get accounts associated with a contact
      tags:
      - contacts
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Related accounts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedResponse'
              examples:
                default:
                  items: []
                  total: 0
                  page: 1
                  per_page: 20
        '404':
          description: Not found
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get contacts by ID
      x-operation-id: get_accounts_by_id
      x-controller: rerp_crm::contacts::controller::contacts::id::accounts
      x-handler-name: contacts_id_accounts
  /contacts/merge:
    post:
      operationId: merge_contacts
      summary: Merge two contacts (keep one, delete other, update references)
      tags:
      - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MergeContactsRequest'
            examples:
              default: *id002
        description: Merge two duplicate contacts, keeping the better data
      responses:
        '200':
          description: Merge completed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MergeResult'
              examples:
                default:
                  primary_id: 00000000-0000-0000-0000-000000000002
                  merged_from:
                  - 00000000-0000-0000-0000-000000000032
                  - 00000000-0000-0000-0000-000000000033
                  fields_merged:
                  - email
                  - phone
                  - company
        '400':
          description: Invalid request
        '404':
          description: Contact not found
        '500':
          description: Internal server error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '201':
          description: Resource created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
              examples:
                default:
                  success: true
                  kept_id: 00000000-0000-0000-0000-000000000001
                  merged_id: 00000000-0000-0000-0000-000000000002
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '409':
          description: Conflict - resource conflict or operation cannot be completed
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
      description: Create a new contacts
      x-operation-id: post_merge
      x-controller: rerp_crm::contacts::controller::contacts::merge
      x-handler-name: contacts_merge
  /tags:
    get:
      operationId: list_tags
      summary: Tags with contact counts
      tags:
      - tags
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTag'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    post:
      operationId: create_tag
      summary: Create a tag
      tags:
      - tags
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '409':
          description: Tag exists
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /tags/{id}:
    put:
      operationId: update_tag
      summary: Rename or recolour a tag
      tags:
      - tags
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTagRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Tag'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
    delete:
      operationId: delete_tag
      summary: Delete a tag (removed from every contact)
      tags:
      - tags
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Tag is referenced by an active automation trigger
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /contacts/{id}/tags:
    post:
      operationId: add_contact_tags
      summary: Add tags to a contact
      description: Emits TAG_ADDED for each tag newly present, which crm/automation listens for.
      tags:
      - tags
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagNames'
      responses:
        '200':
          description: Contact with its tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
    delete:
      operationId: remove_contact_tags
      summary: Remove tags from a contact
      tags:
      - tags
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TagNames'
      responses:
        '200':
          description: Contact with its tags
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Contact'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /contacts/{id}/activity:
    get:
      operationId: get_contact_activity
      summary: The contact's timeline
      description: Merged, newest first, from every CRM service - sends and opens (outreach), enrolment steps (automation), form submissions and page views (marketing), stage changes (pipeline), notes and tag changes.
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: kinds
        in: query
        schema:
          type: array
          items:
            $ref: '#/components/schemas/ActivityKind'
        style: form
        explode: false
      responses:
        '200':
          description: Activity
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedActivity'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /contacts/{id}/notes:
    post:
      operationId: add_contact_note
      summary: Add a note to the timeline
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - body
              properties:
                body:
                  type: string
      responses:
        '201':
          description: Note added
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Activity'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /contacts/import:
    post:
      operationId: import_contacts
      summary: Bulk import from CSV
      description: Multipart CSV with a column mapping. Rows are validated and deduplicated by email; the response is a job the client polls. Consent for list subscription is recorded as IMPORT with the stated source.
      tags:
      - contacts
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              - mapping
              properties:
                file:
                  type: string
                  format: binary
                mapping:
                  type: string
                  description: JSON object column -> contact field or custom field key
                tag_names:
                  type: string
                  description: JSON array of tags to add to every imported contact
                list_id:
                  type: string
                  format: uuid
                consent_note:
                  type: string
                update_existing:
                  type: boolean
      responses:
        '202':
          description: Import job started
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '400':
          description: Invalid file or mapping
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /contacts/import/{id}:
    get:
      operationId: get_import_job
      summary: Import job progress
      tags:
      - contacts
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Job
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /contacts/export:
    post:
      operationId: export_contacts
      summary: Export contacts matching a segment as CSV
      tags:
      - contacts
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                segment_id:
                  type: string
                  format: uuid
                conditions:
                  type: object
                fields:
                  type: array
                  items:
                    type: string
      responses:
        '202':
          description: Export job started; the job carries the download URL when done
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ImportJob'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /segments:
    get:
      operationId: list_segments
      summary: Saved segments
      tags:
      - segments
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Segments
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSegment'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    post:
      operationId: create_segment
      summary: Save a segment
      tags:
      - segments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentRequest'
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '400':
          description: Invalid conditions
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /segments/{id}:
    get:
      operationId: get_segment
      summary: Get a segment
      tags:
      - segments
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Segment
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
    put:
      operationId: update_segment
      summary: Update a segment
      tags:
      - segments
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateSegmentRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Segment'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
    delete:
      operationId: delete_segment
      summary: Delete a segment
      tags:
      - segments
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Segment is used by a scheduled campaign
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /segments/evaluate:
    post:
      operationId: evaluate_segment
      summary: Count and sample the contacts a condition tree matches
      tags:
      - segments
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - conditions
              properties:
                conditions:
                  $ref: '#/components/schemas/ConditionGroup'
      responses:
        '200':
          description: Match count and sample
          content:
            application/json:
              schema:
                type: object
                required:
                - count
                properties:
                  count:
                    type: integer
                    format: int64
                  sample:
                    type: array
                    items:
                      $ref: '#/components/schemas/Contact'
        '400':
          description: Invalid conditions
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
components:
  schemas:
    Contact:
      type: object
      required:
      - id
      - name
      - create_date
      properties:
        tags:
          type: array
          items:
            type: string
          description: Tag names (see /tags)
        custom_fields:
          type: object
          additionalProperties: true
          description: Values for crm/platform custom fields, keyed by field key
        score:
          type: integer
          format: int32
