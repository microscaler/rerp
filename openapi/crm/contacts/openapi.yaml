      type: string
      enum:
      - MESSAGE_SENT
      - MESSAGE_OPENED
      - MESSAGE_CLICKED
      - MESSAGE_BOUNCED
      - UNSUBSCRIBED
      - SUBSCRIBED
      - FORM_SUBMITTED
      - PAGE_VIEW
      - SITE_EVENT
      - WORKFLOW_ENTERED
      - WORKFLOW_STEP
      - WORKFLOW_ENDED
      - TAG_ADDED
      - TAG_REMOVED
      - FIELD_CHANGED
      - SCORE_CHANGED
      - DEAL_CREATED
      - DEAL_STAGE_CHANGED
      - NOTE
      - CHAT
    Activity:
      type: object
      required:
      - id
      - contact_id
      - kind
      - at
      - summary
      properties:
        id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        kind:
          $ref: '#/components/schemas/ActivityKind'
        at:
          type: string
          format: date-time
        summary:
          type: string
          description: One line for the timeline
        actor:
          type: string
          description: Staff user id, workflow id, 'contact' or 'system'
        ref_service:
          type: string
          description: Which CRM service owns the underlying record
        ref_id:
          type: string
          format: uuid
        data:
          type: object
          description: Kind-specific detail (template name, link url, form fields, from/to stage)
    ConditionGroup:
      type: object
      required:
      - op
      - items
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        items:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/ConditionGroup'
            - $ref: '#/components/schemas/Condition'
      description: Recursive AND/OR tree shared by segments, automation IF_ELSE/GOAL steps and campaign audiences
    Condition:
      type: object
      required:
      - subject
      - operator
      properties:
        subject:
          type: string
          description: |
            What is tested: field:<name>, custom:<key>, tag, list:<id>, score, engagement:opened:<days>,
            engagement:clicked:<days>, engagement:any:<days>, deal:stage, deal:value, site:visited:<path>,
            event:<name>, form:<id>, created_at, last_activity_at, timezone, country
        operator:
          type: string
          enum:
          - EQ
          - NEQ
          - CONTAINS
          - NOT_CONTAINS
          - STARTS_WITH
          - GT
          - GTE
          - LT
          - LTE
          - IN
          - NOT_IN
          - IS_SET
          - IS_NOT_SET
          - HAS
          - HAS_NOT
          - BEFORE
          - AFTER
          - WITHIN_DAYS
          - NOT_WITHIN_DAYS
        value:
          description: String, number, boolean, ISO date or array as the operator requires
    Segment:
      type: object
      required:
      - id
      - name
      - conditions
      - created_at
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        description:
          type: string
        conditions:
          $ref: '#/components/schemas/ConditionGroup'
        contact_count:
          type: integer
          format: int64
          readOnly: true
          description: Evaluated at last save or refresh
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
    CreateSegmentRequest:
      type: object
      required:
      - name
      - conditions
      properties:
        name:
          type: string
          maxLength: 128
        description:
          type: string
        conditions:
          $ref: '#/components/schemas/ConditionGroup'
    ImportJob:
      type: object
      required:
      - id
      - kind
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - IMPORT
          - EXPORT
        status:
          type: string
          enum:
          - QUEUED
          - RUNNING
          - DONE
          - FAILED
        total_rows:
          type: integer
          format: int64
        processed_rows:
          type: integer
          format: int64
        created:
          type: integer
          format: int64
        updated:
          type: integer
          format: int64
        skipped:
          type: integer
          format: int64
        errors:
          type: array
          items:
            type: object
            properties:
              row:
                type: integer
                format: int64
              message:
                type: string
        download_url:
          type: string
          format: uri
          description: EXPORT when DONE; expires
        created_at:
          type: string
          format: date-time
          readOnly: true
        finished_at:
          type: string
          format: date-time
    PaginatedTag:
