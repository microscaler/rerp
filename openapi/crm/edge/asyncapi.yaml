  schemas:
    Received:
      type: object
      required:
      - received_at
      - request_id
      description: 'What the edge saw. It is untrusted: consumers re-validate everything before acting.'
      properties:
        received_at:
          type: string
          format: date-time
        request_id:
          type: string
        ip:
          type: string
          description: Client IP; consumers keep it only as consent evidence
        user_agent:
          type: string
        origin:
          type: string
        token:
          type: string
          description: The signed token from the path, unverified
        path_params:
          type: object
          additionalProperties:
            type: string
        query:
          type: object
          additionalProperties:
            type: string
        body:
          description: The request body as received (JSON), within the edge size limit
        signature_verified:
          type: boolean
          description: 'Webhooks: the provider signature checked out'
    OAuthCompleted:
      type: object
      required:
      - flow
      - state
