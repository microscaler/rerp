# Generated with the OpenAPI document from the CRM event catalogue (openapi/crm/docs/10-events.md).
asyncapi: 3.0.0
info:
  title: CRM Edge events
  version: 1.0.0
  description: 'Events crm/edge publishes on Pub/Sub topic `crm.edge.v1` and the events it consumes from other CRM services.
    Every message is an envelope (event id, type, workspace, time, actor) around `data`. Delivery is at least once: consumers
    are idempotent on `event_id`. Catalogue: openapi/crm/docs/10-events.md; decisions: ADR 003, ADR 004.'
defaultContentType: application/json
servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub in the CRM plane project (topics and subscriptions are created by gcp-infrastructure
      through Crossplane).
channels:
  published:
    address: crm.edge.v1
    title: crm.edge.v1
    description: Everything crm/edge publishes.
    messages:
      formSubmissionReceived:
        $ref: '#/components/messages/formSubmissionReceived'
      surveyReceived:
        $ref: '#/components/messages/surveyReceived'
      eventRegistrationReceived:
        $ref: '#/components/messages/eventRegistrationReceived'
      confirmationReceived:
        $ref: '#/components/messages/confirmationReceived'
      openReceived:
        $ref: '#/components/messages/openReceived'
      clickReceived:
        $ref: '#/components/messages/clickReceived'
      unsubscribeReceived:
        $ref: '#/components/messages/unsubscribeReceived'
      preferencesReceived:
        $ref: '#/components/messages/preferencesReceived'
      trackReceived:
        $ref: '#/components/messages/trackReceived'
      adClickReceived:
        $ref: '#/components/messages/adClickReceived'
      adCallReceived:
        $ref: '#/components/messages/adCallReceived'
      providerEventReceived:
        $ref: '#/components/messages/providerEventReceived'
      adWebhookReceived:
        $ref: '#/components/messages/adWebhookReceived'
      oauthCompleted:
        $ref: '#/components/messages/oauthCompleted'
operations:
  publish:
    action: send
    channel:
      $ref: '#/channels/published'
    summary: crm/edge publishes its events
    messages:
    - $ref: '#/channels/published/messages/formSubmissionReceived'
    - $ref: '#/channels/published/messages/surveyReceived'
    - $ref: '#/channels/published/messages/eventRegistrationReceived'
    - $ref: '#/channels/published/messages/confirmationReceived'
    - $ref: '#/channels/published/messages/openReceived'
    - $ref: '#/channels/published/messages/clickReceived'
    - $ref: '#/channels/published/messages/unsubscribeReceived'
    - $ref: '#/channels/published/messages/preferencesReceived'
    - $ref: '#/channels/published/messages/trackReceived'
    - $ref: '#/channels/published/messages/adClickReceived'
    - $ref: '#/channels/published/messages/adCallReceived'
    - $ref: '#/channels/published/messages/providerEventReceived'
    - $ref: '#/channels/published/messages/adWebhookReceived'
    - $ref: '#/channels/published/messages/oauthCompleted'
components:
  messages:
    formSubmissionReceived:
      name: form_submission.received
      title: form_submission.received
      summary: A public form was submitted.
      description: 'A public form was submitted.


        Published by: `POST /forms/{id}/submit`


        Consumed by: crm/intake.'
      traits:
      - $ref: '#/components/messageTraits/envelope'
      payload:
        type: object
        required:
        - event_id
        - event_type
        - workspace_id
        - occurred_at
        - producer
        - data
        properties:
          event_id:
            type: string
            format: uuid
            description: Idempotency key for consumers
          event_type:
            type: string
            const: form_submission.received
          workspace_id:
            type:
            - string
            - 'null'
            format: uuid
            description: Resolved from the form, site or token when the edge can; consumers re-resolve
          occurred_at:
            type: string
            format: date-time
          producer:
            type: string
            const: crm/edge
          actor:
            type: object
            properties:
              kind:
                type: string
                enum:
                - USER
                - API_KEY
                - SYSTEM
                - CONTACT
                - ANONYMOUS
              id:
                type: string
                description: Sesame user id, API key id, or contact id
          request_id:
            type: string
            description: X-Request-Id of the call that caused it, when there was one
          entity_id:
            type: string
            description: Id of the entity the event is about (also the ordering key)
          data:
            $ref: '#/components/schemas/Received'
