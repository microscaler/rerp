asyncapi: 3.0.0
info:
  title: CRM Sales events
  version: 1.0.0
  description: 'Events crm/sales publishes on Pub/Sub topic `crm.sales.v1` and the events it consumes from other CRM services.
    Every message is an envelope (event id, type, workspace, time, actor) around `data`. Delivery is at least once: consumers
    are idempotent on `event_id`. Catalogue: openapi/crm/docs/10-events.md; decisions: ADR 003, ADR 004.'
defaultContentType: application/json
servers:
