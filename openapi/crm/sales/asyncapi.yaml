                description: Sesame user id, API key id, or contact id
          request_id:
            type: string
            description: X-Request-Id of the call that caused it, when there was one
          entity_id:
            type: string
            description: Id of the entity the event is about (also the ordering key)
          data:
            $ref: '#/components/schemas/ErasureCompleted'
  schemas:
    ErasureCompleted:
      type: object
      required:
      - data_request_id
      - service
      - rows_erased
      properties:
        data_request_id:
          type: string
          format: uuid
        service:
          type: string
        rows_erased:
          type: integer
          format: int64
  messageTraits:
    envelope:
      bindings:
        googlepubsub:
          bindingVersion: 0.2.0
          orderingKey: entity id (per-entity ordering)
          attributes:
            type: object
            required:
            - event_type
            - workspace_id
            properties:
              event_type:
                type: string
              workspace_id:
                type: string
                format: uuid
              schema_version:
                type: string
                const: '1'
