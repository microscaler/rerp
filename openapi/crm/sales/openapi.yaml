openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Sales
  version: v1.0.0
  description: 'Selling: website leads and their triage, pipelines and stages, deals with contacts, roles, notes, files and
    emails, deal settings, sales teams and assignment, task types, outcomes, settings, tasks, calendar feeds and saved responses,
    and the signed conversion to a RERP customer (ADR 003).'
  x-api-docs:
    service: sales
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/sales
  description: Local development (port from port-registry)
- url: /api/v1/crm/sales
  description: CRM Sales API
tags:
- name: calendars
  description: iCal feeds of tasks
- name: deal-roles
  description: Roles a contact plays on a deal
- name: deals
  description: 'Deals: contacts and roles, stage and status, notes, files, activity, 1:1 email'
- name: leads
  description: Lead and opportunity lifecycle
- name: members
  description: Team member management
- name: outcomes
  description: The outcome catalogue
- name: pipelines
  description: Pipelines, their summary and settings
- name: saved-responses
  description: Reusable 1:1 email responses
- name: settings
  description: Task settings
- name: stages
  description: Pipeline stage management
- name: task-types
  description: Task types and their outcomes
- name: tasks
  description: Tasks on contacts and deals
- name: teams
  description: Team CRUD
