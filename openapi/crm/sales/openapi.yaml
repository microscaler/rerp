components:
  schemas:
    ActivityEntry:
      type: object
      required:
      - id
      - kind
      - at
      description: One line of a deal's timeline
      properties:
        id:
          type: string
          format: uuid
        kind:
          type: string
          enum:
          - CREATED
          - STAGE_CHANGED
          - STATUS_CHANGED
          - VALUE_CHANGED
          - OWNER_CHANGED
          - FIELD_CHANGED
          - CONTACT_ADDED
          - CONTACT_REMOVED
          - NOTE_ADDED
          - FILE_ADDED
          - TASK_ADDED
          - TASK_COMPLETED
          - EMAIL_SENT
          - EMAIL_RECEIVED
          - WORKFLOW_ACTION
        summary:
          type: string
        actor:
          type: string
          description: A staff user id, WORKFLOW, FORM, IMPORT or CONTACT
        detail:
          type: object
        at:
          type: string
          format: date-time
    AddTeamMemberRequest:
      type: object
      required:
      - user_id
      properties:
        user_id:
          type: string
          maxLength: 64
          description: Sesame user id (the sub claim of the access token)
        assignment_max:
          type: integer
          format: int32
        assignment_domain:
          type: string
        quota_monthly:
          type: string
          format: decimal
          pattern: ^-?\d{1,15}(\.\d{1,4})?$
          description: Decimal string in the currency of the record.
      description: Request body for adding a member to a team
    AssignmentResult:
      type: object
      properties:
        assigned_count:
          type: integer
          format: int32
        failed_count:
          type: integer
          format: int32
        details:
          type: array
          items:
            type: object
            properties:
              lead_id:
                type: string
                format: uuid
              assigned_to:
                type: string
                format: uuid
              reason:
                type: string
      required:
      - assigned_count
      - failed_count
      - details
      description: Result of lead assignment with counts and details
    Attachment:
      type: object
      required:
      - id
      - filename
      - size
      - created_at
      properties:
        id:
          type: string
          format: uuid
        filename:
          type: string
        content_type:
          type: string
        size:
          type: integer
          format: int64
        url:
          type: string
          format: uri
          readOnly: true
          description: Signed, time-limited
        uploaded_by:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
    AutomationHook:
      type: object
      required:
      - workflow_id
      - 'on'
      description: Start a crm/automation workflow for the task's contact when the task is added or completed
      properties:
        workflow_id:
          type: string
          format: uuid
        'on':
          type: string
          enum:
          - ADDED
          - COMPLETED
    BulkDealRequest:
      type: object
      required:
      - deal_ids
      - action
      properties:
        deal_ids:
          type: array
          items:
            type: string
            format: uuid
        action:
          type: string
          enum:
          - MOVE_STAGE
          - ASSIGN_OWNER
          - SET_STATUS
          - ADD_TAG
          - REMOVE_TAG
          - DELETE
        stage_id:
          type: string
          format: uuid
        pipeline_id:
          type: string
          format: uuid
        owner_id:
          type: string
          maxLength: 64
          description: Sesame user id (the sub claim of the access token)
        status:
          $ref: '#/components/schemas/DealStatus'
        tag_id:
          type: string
          format: uuid
    CalendarFeed:
      type: object
      required:
      - id
      - name
      - scope
      - created_at
      description: An iCal feed of tasks, by scope, pipelines and assignees; the URL carries a token and is served by GET
        /calendars/{token}.ics
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        scope:
          type: string
          enum:
          - ALL
          - DEALS
          - CONTACTS
        pipeline_ids:
          type: array
          items:
