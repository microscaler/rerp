          - GOOGLE_OFFLINE
          - GOOGLE_ENHANCED
          - LINKEDIN_CAPI
          - TIKTOK_EVENTS
          - MICROSOFT_OFFLINE
          - NONE
          description: Which server-side conversion API the account relays to
        pixel_id:
          type: string
          description: Pixel / dataset / tag id used for conversion relay
        default_currency:
          type: string
        match_rate_last:
          type: number
          format: float
          readOnly: true
          description: Matched ÷ uploaded on the last audience sync, 0–1
        last_sync_at:
