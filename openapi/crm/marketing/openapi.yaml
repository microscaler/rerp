      type: object
      properties:
        name:
          type: string
        status:
          type: string
          enum:
          - CONNECTED
          - PAUSED
        conversion_endpoint:
          type: string
        pixel_id:
          type: string
        default_currency:
          type: string
    AdAudienceSource:
      type: object
      required:
      - kind
      properties:
        kind:
          type: string
          enum:
          - SEGMENT
          - LIST
          - TAG
          - SCORE_BAND
          - PIPELINE_STAGE
          - STATIC
        ref_id:
          type: string
          description: Segment / list / score / pipeline id
        tag:
          type: string
        band:
          type: string
          enum:
          - COLD
          - WARM
          - HOT
        stage_id:
          type: string
          format: uuid
        contact_ids:
          type: array
          items:
            type: string
            format: uuid
          description: STATIC only
    AdAudience:
      type: object
      required:
      - id
      - name
      - account_id
      - platform
      - source
      - status
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        account_id:
          type: string
          format: uuid
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - DSP_TRADE_DESK
          - DSP_DV360
          - LIVERAMP
        external_audience_id:
          type: string
          description: The platform's audience id; created on first sync unless given
        source:
          $ref: '#/components/schemas/AdAudienceSource'
        mode:
          type: string
          enum:
          - CONTINUOUS
          - ONE_OFF
          default: CONTINUOUS
          description: CONTINUOUS re-evaluates the source and pushes adds / removals every `sync_interval_minutes`
        sync_interval_minutes:
          type: integer
          format: int32
          default: 60
        identifiers:
          type: array
          items:
            type: string
            enum:
            - EMAIL
            - PHONE
            - FIRST_NAME
            - LAST_NAME
            - POSTCODE
            - COUNTRY
            - MAID
            - EXTERNAL_ID
          description: Which identifiers are hashed and sent; more identifiers raise the match rate
        consent_basis:
          type: string
          enum:
          - CONSENT
          - LEGITIMATE_INTEREST
          - CONTRACT
          description: Recorded on every membership; LEGITIMATE_INTEREST is refused for lists whose consent source is PURCHASED in regions configured as strict
        suppress_on:
          type: array
          items:
            type: string
            enum:
            - UNSUBSCRIBED
            - SUPPRESSED
            - ERASED
            - CONVERTED
            - DEAL_WON
            - TRACKING_OPTOUT
            - NO_MARKETING_CONSENT
          description: Contacts in these states are removed (or never added)
        exclude_source:
          $ref: '#/components/schemas/AdAudienceSource'
        lookalike:
          type: object
          properties:
            enabled:
              type: boolean
            ratio_percent:
              type: integer
              format: int32
              minimum: 1
              maximum: 10
            country:
              type: string
            external_audience_id:
              type: string
              readOnly: true
        purpose:
          type: string
          enum:
          - WARM_UP
          - RETARGET
          - EXCLUDE
          - LOOKALIKE_SEED
          - OTHER
          description: 'WARM_UP is the pre-email sequence: add N days before a send, remove on click or after the window'
        warm_up:
          type: object
          properties:
            days_before_send:
              type: integer
              format: int32
            remove_on:
              type: string
              enum:
              - EMAIL_CLICKED
              - EMAIL_OPENED
              - SITE_VISIT
              - WINDOW_END
            window_days:
              type: integer
              format: int32
            frequency_cap_hint:
              type: integer
              format: int32
              description: Impressions per person the campaign should cap at (informational; set on the platform)
        status:
          type: string
          enum:
          - BUILDING
          - ACTIVE
          - PAUSED
          - ERROR
        stats:
          type: object
          readOnly: true
          properties:
            source_count:
              type: integer
              format: int64
            eligible:
              type: integer
              format: int64
              description: After suppression
            uploaded:
              type: integer
              format: int64
            matched:
              type: integer
              format: int64
              description: As reported by the platform (Meta and LinkedIn report a size band; stored as the band midpoint)
            match_rate:
              type: number
              format: float
            removed_total:
              type: integer
              format: int64
            last_sync_at:
              type: string
              format: date-time
            next_sync_at:
              type: string
              format: date-time
        last_error:
          type: string
          readOnly: true
        created_by:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
