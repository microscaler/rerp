                  total: 1
                  page: 1
                  per_page: 20
                  has_next: false
                  has_prev: false
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get leads associated with a campaign
      x-operation-id: get_leads_by_id
      x-controller: rerp_crm::marketing::controller::campaigns::id::leads
      x-handler-name: campaigns_id_leads
  /campaigns/{id}/revenue:
    get:
      operationId: get_campaign_revenue
      summary: Get revenue attributed to a campaign
      tags:
      - campaigns
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: start_date
        in: query
        schema:
          type: string
          format: date
      - name: end_date
        in: query
        schema:
          type: string
          format: date
      responses:
        '200':
          description: Campaign revenue
          content:
            application/json:
              schema:
                type: object
                properties:
                  total_revenue:
                    type: number
                    format: double
                  total_opportunities:
                    type: integer
                    format: int32
                  total_won_deals:
                    type: integer
                    format: int32
                  average_deal_size:
                    type: number
                    format: double
              examples:
                default:
                  campaign_id: 00000000-0000-0000-0000-000000000012
                  total_revenue: 25000
                  conversions: 15
        '401':
          description: Unauthorized - Invalid or missing authentication token
        '404':
          description: Resource not found
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      description: Get revenue attributed to a campaign
      x-operation-id: get_revenue_by_id
      x-controller: rerp_crm::marketing::controller::campaigns::id::revenue
      x-handler-name: campaigns_id_revenue
  /events/register:
    post:
      operationId: register_event
      summary: Register attendee for an event (creates lead)
      tags:
      - events
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EventRegistrationRequest'
            examples:
