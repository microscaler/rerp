components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
      description: Page number for pagination (1-indexed)
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
      description: 'Maximum number of items per page (default: 20, max: 100)'
    Search:
      name: search
      in: query
      schema:
        type: string
      description: Search query string for filtering resources
    Id:
      name: id
      in: path
      required: true
      schema:
        type: string
        format: uuid
      description: Unique identifier for the resource
  schemas:
    UTMCampaign:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        active:
          type: boolean
          default: true
        sequence:
          type: integer
          format: int32
        company_id:
          type: string
          format: uuid
      description: UTM campaign tracking parameters
    CreateUTMCampaignRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        active:
          type: boolean
        sequence:
          type: integer
          format: int32
      description: Request body for creating a new UTM campaign
    UpdateUTMCampaignRequest:
      type: object
      properties:
        name:
          type: string
        active:
          type: boolean
        sequence:
          type: integer
          format: int32
      required:
      - name
      - active
      - sequence
      description: Request body for updating an existing UTM campaign
    UTMMedium:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        active:
          type: boolean
          default: true
      description: UTM medium type definition
    CreateUTMMediumRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        active:
          type: boolean
      description: Request body for creating a new UTM medium
    UTMSource:
      type: object
      required:
      - id
      - name
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 64
        medium_id:
          type: string
          format: uuid
        active:
          type: boolean
          default: true
      description: UTM source definition for traffic attribution
    CreateUTMSourceRequest:
      type: object
      required:
      - name
      properties:
        name:
          type: string
        medium_id:
          type: string
          format: uuid
        active:
          type: boolean
      description: Request body for creating a new UTM source
    WebForm:
      type: object
      required:
      - id
      - name
      - capture_fields
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
          maxLength: 128
        description:
          type: string
        fields:
          type: array
          items:
            $ref: '#/components/schemas/FormFieldDef'
          description: Ordered field definitions; supersedes capture_fields
        actions:
          type: array
          items:
            $ref: '#/components/schemas/FormAction'
        style:
          $ref: '#/components/schemas/FormStyle'
        double_opt_in:
          type: boolean
        allowed_origins:
          type: array
          items:
            type: string
            format: uri
        submission_count:
          type: integer
          format: int64
          readOnly: true
        conversion_rate:
          type: number
          format: double
          readOnly: true
          description: Submissions / views where views are tracked
        public_url:
          type: string
          format: uri
          readOnly: true
        redirect_url:
          type: string
          description: Set with on_submit REDIRECT
        on_submit:
          type: string
          enum:
          - THANK_YOU
          - REDIRECT
          default: THANK_YOU
          description: Show `style.success_message`, or send the visitor to `redirect_url`
        is_active:
          type: boolean
          default: true
          description: false pauses submissions (the public endpoint answers 410)
        allow_blank_overwrite:
          type: boolean
          default: false
          description: A submitted blank overwrites an existing field value (otherwise blanks are ignored)
        block_free_mail:
          type: boolean
          default: false
          description: Refuse personal email providers (gmail, yahoo, outlook ...)
        blocked_domains:
          type: array
          items:
            type: string
          description: Refuse these email domains; `*.example.com` blocks subdomains only
        custom_html:
          type: string
          description: When set, the embed renders this markup instead of `fields`
        workflow_ids:
          type: array
          items:
            type: string
            format: uuid
          readOnly: true
          description: Workflows with a FORM_SUBMITTED trigger on this form
        capture_fields:
          type: object
          description: Schema of fields to capture (key-value definitions)
        team_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        utm_source_id:
          type: string
          format: uuid
        utm_medium_id:
          type: string
          format: uuid
        utm_campaign_id:
          type: string
          format: uuid
        consent_required:
          type: boolean
          default: false
        consent_text:
          type: string
        api_endpoint:
          type: string
          readOnly: true
        embed_code:
          type: string
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      description: A marketing form definition with its fields
    FormSubmissionRequest:
      type: object
      required:
      - fields
      properties:
        fields:
          type: object
          description: Form field values matching capture_fields schema
        consent_given:
          type: boolean
          description: GDPR consent checkbox
        visitor_id:
          type: string
          description: Anonymous visitor ID (from cookie)
      description: Request body for submitting a marketing form
    FormSubmissionResult:
      type: object
      properties:
        lead_id:
          type: string
          format: uuid
        contact_id:
          type: string
          format: uuid
        form_id:
          type: string
          format: uuid
        redirect_url:
          type: string
      required:
      - lead_id
      - contact_id
      - form_id
      - redirect_url
      description: Result of a marketing form submission
    VisitorTracking:
      type: object
      required:
      - id
      - visitor_id
      - first_seen
      properties:
        id:
          type: string
          format: uuid
        visitor_id:
          type: string
        url_visited:
          type: string
        referrer:
          type: string
        user_agent:
          type: string
        country:
          type: string
        city:
          type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time
        pages_viewed:
          type: integer
          format: int32
        converted_to_lead:
          type: boolean
        lead_id:
          type: string
          format: uuid
      description: A visitor tracking record with page and session data
    TrackPageViewRequest:
      type: object
      required:
      - visitor_id
      - url_visited
      properties:
        visitor_id:
          type: string
        url_visited:
          type: string
        referrer:
          type: string
        user_agent:
          type: string
        ip_address:
          type: string
      description: Request body for tracking a visitor page view
    IdentifyVisitorRequest:
      type: object
      required:
      - visitor_id
      - email
      properties:
        visitor_id:
          type: string
        email:
          type: string
          format: email
      description: Request body for identifying a returning visitor
    EventRegistrationRequest:
      type: object
      required:
      - event_name
      - attendee_name
      - attendee_email
      properties:
        event_name:
          type: string
        event_date:
          type: string
          format: date-time
        attendee_name:
          type: string
        attendee_email:
          type: string
          format: email
        attendee_phone:
          type: string
        attendee_company:
          type: string
        attendee_function:
          type: string
        source:
          type: string
          default: web
      description: Request body for registering for an event
    EventRegistration:
      type: object
      required:
      - id
      - event_name
      - attendee_email
      properties:
        id:
          type: string
          format: uuid
        event_name:
          type: string
        event_date:
          type: string
          format: date-time
        attendee_name:
          type: string
        attendee_email:
          type: string
        attendee_company:
          type: string
        attendee_phone:
          type: string
        attendee_function:
          type: string
        lead_id:
          type: string
          format: uuid
        source:
          type: string
        attended:
          type: boolean
        registration_date:
          type: string
          format: date-time
      description: An event registration record
    SurveyResponseRequest:
      type: object
      required:
      - survey_name
      - responses
      properties:
        survey_name:
          type: string
        respondent_name:
          type: string
        respondent_email:
          type: string
          format: email
        responses:
          type: object
          description: All survey answers as key-value pairs
      description: Request body for submitting a survey response
    SurveyResponse:
      type: object
      required:
      - id
      - survey_name
      - respondent_email
      properties:
        id:
          type: string
          format: uuid
        survey_name:
          type: string
        respondent_email:
          type: string
        respondent_name:
          type: string
        responses:
          type: object
        lead_id:
          type: string
          format: uuid
        response_date:
          type: string
          format: date-time
