          type: string
          readOnly: true
        connected_by:
          type: string
        created_at:
          type: string
          format: date-time
          readOnly: true
    ConnectAdAccountRequest:
      type: object
      required:
      - platform
      - name
      properties:
        platform:
          type: string
          enum:
          - META
          - GOOGLE_ADS
          - LINKEDIN
          - X
          - TIKTOK
          - MICROSOFT_ADS
          - PINTEREST
          - DSP_TRADE_DESK
          - DSP_DV360
          - LIVERAMP
        name:
          type: string
        external_account_id:
          type: string
        auth:
          type: object
          description: OAUTH starts the platform flow (response carries `authorize_url`); API_KEY / TOKEN stores the credential in the secrets service, never on the account row
          properties:
            kind:
              type: string
              enum:
              - OAUTH
              - API_KEY
              - TOKEN
            secret_id:
              type: string
        conversion_endpoint:
          type: string
        pixel_id:
          type: string
