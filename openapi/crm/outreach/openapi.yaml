      tags:
      - senders
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Verification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Sender'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /reports/overview:
    get:
      operationId: get_outreach_overview
      summary: Sends, open and click rates over a period
      tags:
      - outreach-reports
      parameters:
      - name: from
        in: query
        schema:
          type: string
