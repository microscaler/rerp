      - name: to
        in: query
        schema:
          type: string
          format: date
      - name: list_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Overview
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/OutreachOverview'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
  /reports/lists/{id}/growth:
    get:
      operationId: get_list_growth
      summary: Subscriptions and unsubscribes per day for a list
      tags:
      - outreach-reports
      parameters:
      - $ref: '#/components/parameters/Id'
      - name: days
        in: query
