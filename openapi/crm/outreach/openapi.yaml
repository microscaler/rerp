openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Outreach
  version: v1.0.0
  description: |
    Message delivery for the CRM: lists and subscriptions (consent), message templates, one-time and
    A/B campaigns, transactional sends, the per-message delivery log and engagement events (delivered,
    opened, clicked, bounced, complained, unsubscribed), suppression, sender identities, and the public
    endpoints a recipient touches (open pixel, click redirect, one-click unsubscribe, preference page).

    Channel is a property of the template and the campaign (EMAIL first; SMS and WHATSAPP share the
    same model and are delivered when a provider adapter exists). Automation (crm/automation) sends
    through this service via its SEND_MESSAGE action; it never talks to a provider itself.

    Data home (ADR 003): the outreach store sits with the marketing funnel, outside RERP's tenant
    database, in a Postgres this service owns (a deployment may point it at a managed project or an
    in-cluster instance). Marketing history, consent and engagement never cross into RERP; only
    converted customers do. The provider adapter (SES, Postmark, Resend, ...) is deployment
    configuration, never a property of the data.
  x-api-version: CRM Outreach API v1.0.0
  x-crm-api-version: v1.0.0
  termsOfService: https://rerp.example.com/terms
  contact:
    name: RERP API Support
    url: https://docs.rerp.com/support
    email: api-support@rerp.example.com
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
  x-api-docs:
    service: outreach
    openapi_version: 3.1.0
    brrtrouter_version: latest
servers:
- url: http://localhost:10353/api/v1/crm/outreach
  description: Local development (direct to service, port from port-registry)
- url: /api/v1/crm/outreach
  description: Outreach API
tags:
- name: lists
  description: Mailing lists and their subscription state
- name: subscriptions
  description: Contact x list subscription state and consent history
- name: templates
  description: Message templates (email, SMS, WhatsApp) with merge fields
- name: campaigns
  description: One-time and A/B campaigns, their schedule and send
- name: sends
  description: Per-recipient delivery log
- name: events
  description: Engagement events (delivered, opened, clicked, bounced, complained, unsubscribed)
- name: transactional
  description: Application-triggered single sends sharing the suppression list
- name: suppressions
  description: Addresses that must never be sent to
- name: senders
  description: Sender identities and sending domains (DKIM / DMARC state)
- name: public
  description: Unauthenticated endpoints a recipient's mail client or browser touches
- name: provider-webhooks
  description: Inbound delivery events from the email/SMS provider
- name: outreach-reports
  description: Campaign and list performance
paths:
  /lists:
    get:
      operationId: list_lists
      summary: List mailing lists
      tags:
      - lists
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Search'
      responses:
        '200':
          description: Mailing lists with subscriber counts
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMailingList'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
    post:
      operationId: create_list
      summary: Create a mailing list
      tags:
      - lists
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateMailingListRequest'
            examples:
              default:
                name: Product launch waitlist
                description: Everyone who asked to be told when the product opens
                sender_id: 00000000-0000-0000-0000-000000000301
                double_opt_in: true
      responses:
        '201':
          description: List created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingList'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '500':
          description: Internal server error
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /lists/{id}:
    get:
      operationId: get_list
      summary: Get a mailing list
      tags:
      - lists
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: The list
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingList'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
    put:
      operationId: update_list
      summary: Update a mailing list
      tags:
      - lists
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateMailingListRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/MailingList'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
    delete:
      operationId: delete_list
      summary: Archive a mailing list
      description: Lists are archived, never hard-deleted; subscription history under them is retained for consent audit.
      tags:
      - lists
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Archived
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /lists/{id}/subscriptions:
    get:
      operationId: list_list_subscriptions
      summary: Subscriptions on a list
      tags:
      - subscriptions
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SubscriptionStatus'
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSubscription'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /subscriptions:
    post:
      operationId: subscribe
      summary: Subscribe a contact to a list
      description: |
        Records a subscription with its consent source. With double opt-in on the list the status is PENDING until
        the confirmation link is followed. Re-subscribing an UNSUBSCRIBED contact requires a fresh consent source
        (a form submission or an explicit staff action with a note); an automation may not do it.
      tags:
      - subscriptions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubscribeRequest'
      responses:
        '201':
          description: Subscription recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '409':
          description: Address is suppressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /subscriptions/{id}:
    get:
      operationId: get_subscription
      summary: Get a subscription with its consent history
      tags:
      - subscriptions
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Subscription
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /subscriptions/{id}/unsubscribe:
    post:
      operationId: unsubscribe
      summary: Unsubscribe a contact from a list
      tags:
      - subscriptions
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UnsubscribeRequest'
      responses:
        '200':
          description: Unsubscribed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /contacts/{id}/subscriptions:
    get:
      operationId: list_contact_subscriptions
      summary: A contact's subscriptions across all lists
      tags:
      - subscriptions
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Subscriptions
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/Subscription'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
  /templates:
    get:
      operationId: list_templates
      summary: List message templates
      tags:
      - templates
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Search'
      - name: channel
        in: query
        schema:
          $ref: '#/components/schemas/Channel'
      - name: kind
        in: query
        schema:
          $ref: '#/components/schemas/TemplateKind'
      responses:
        '200':
          description: Templates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTemplate'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    post:
      operationId: create_template
      summary: Create a message template
      tags:
      - templates
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateTemplateRequest'
            examples:
              default:
                name: 'Onboarding day 7: your first week'
                channel: EMAIL
                kind: AUTOMATION
                subject: 'Day 7: what you have set up so far'
                preheader: A week in, and three things worth doing next
                body_format: MARKDOWN
                body: "Hi {{contact.first_name}},\n\nA week ago you signed up..."
      responses:
        '201':
          description: Template created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /templates/{id}:
    get:
      operationId: get_template
      summary: Get a template
      tags:
      - templates
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Template
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
    put:
      operationId: update_template
      summary: Update a template (creates a new version)
      tags:
      - templates
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateTemplateRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Template'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
    delete:
      operationId: delete_template
      summary: Archive a template
      tags:
      - templates
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Archived
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Template is referenced by a scheduled campaign or active automation
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /templates/{id}/render:
    post:
      operationId: render_template
      summary: Render a template for a contact (preview)
      description: Merge fields are resolved from the given contact, or from the sample values supplied. Nothing is sent.
      tags:
      - templates
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RenderRequest'
      responses:
        '200':
          description: Rendered message
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RenderedMessage'
        '400':
          description: Unresolvable merge field
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /templates/{id}/test-send:
    post:
      operationId: test_send_template
      summary: Send a template to a staff address
      tags:
      - templates
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TestSendRequest'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Send'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /merge-fields:
    get:
      operationId: list_merge_fields
      summary: Merge fields available to templates
      description: Contact fields, custom fields (crm/platform), list and campaign fields, and system links (unsubscribe, preferences, web view).
      tags:
      - templates
      responses:
        '200':
          description: Merge fields
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      $ref: '#/components/schemas/MergeField'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
  /campaigns:
    get:
      operationId: list_campaigns
      summary: List campaigns
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Search'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/CampaignStatus'
      - name: kind
        in: query
        schema:
          $ref: '#/components/schemas/CampaignKind'
      - name: list_id
        in: query
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Campaigns
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedCampaign'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    post:
      operationId: create_campaign
      summary: Create a campaign (draft)
      tags:
      - campaigns
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreateCampaignRequest'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /campaigns/{id}:
    get:
      operationId: get_campaign
      summary: Get a campaign
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Campaign
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
    put:
      operationId: update_campaign
      summary: Update a draft or scheduled campaign
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpdateCampaignRequest'
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Campaign is sending or sent
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
    delete:
      operationId: delete_campaign
      summary: Delete a draft campaign
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '204':
          description: Deleted
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Only drafts can be deleted; sent campaigns are archived
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /campaigns/{id}/audience:
    get:
      operationId: preview_campaign_audience
      summary: Resolve the campaign's audience now
      description: Lists minus exclusions minus suppressed minus unsubscribed, filtered by the segment. Returns the count and a sample.
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Audience
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AudiencePreview'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /campaigns/{id}/schedule:
    post:
      operationId: schedule_campaign
      summary: Schedule or send now
      description: Validates the campaign (sender verified, template renders, audience non-empty, unsubscribe link present) and moves it to SCHEDULED. Omit send_at to send immediately.
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ScheduleCampaignRequest'
      responses:
        '200':
          description: Scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '400':
          description: Validation failed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignValidation'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /campaigns/{id}/cancel:
    post:
      operationId: cancel_campaign
      summary: Cancel a scheduled campaign or stop one mid-send
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          description: Unauthorized
        '404':
          description: Not found
        '409':
          description: Campaign already completed
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /campaigns/{id}/duplicate:
    post:
      operationId: duplicate_campaign
      summary: Copy a campaign as a new draft
      tags:
      - campaigns
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '201':
          description: Draft created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Campaign'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /campaigns/{id}/report:
    get:
      operationId: get_campaign_report
      summary: Campaign performance
      tags:
      - outreach-reports
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Report
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CampaignReport'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /campaigns/{id}/sends:
    get:
      operationId: list_campaign_sends
      summary: Per-recipient sends for a campaign
      tags:
      - sends
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: status
        in: query
        schema:
          $ref: '#/components/schemas/SendStatus'
      responses:
        '200':
          description: Sends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSend'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /sends/{id}:
    get:
      operationId: get_send
      summary: One send with its events
      tags:
      - sends
      parameters:
      - $ref: '#/components/parameters/Id'
      responses:
        '200':
          description: Send
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Send'
        '401':
          description: Unauthorized
        '404':
          description: Not found
      security:
      - bearerAuth: []
  /contacts/{id}/sends:
    get:
      operationId: list_contact_sends
      summary: Everything sent to a contact
      tags:
      - sends
      parameters:
      - $ref: '#/components/parameters/Id'
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Sends
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSend'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
  /events:
    get:
      operationId: list_events
      summary: Engagement events
      description: Filter by contact, campaign, send or type. The automation service subscribes to these to fire EMAIL_OPENED / EMAIL_CLICKED triggers.
      tags:
      - events
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: contact_id
        in: query
        schema:
          type: string
          format: uuid
      - name: campaign_id
        in: query
        schema:
          type: string
          format: uuid
      - name: send_id
        in: query
        schema:
          type: string
          format: uuid
      - name: type
        in: query
        schema:
          $ref: '#/components/schemas/EventType'
      - name: since
        in: query
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: Events
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedMessageEvent'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
  /transactional/send:
    post:
      operationId: send_transactional
      summary: Send one message to one recipient from the application
      description: |
        For welcome, password, receipt and alert mail. Honors the suppression list and hard bounces but not list
        subscription state (a transactional message is not marketing). Requires a template of kind TRANSACTIONAL.
      tags:
      - transactional
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TransactionalSendRequest'
      responses:
        '202':
          description: Queued
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Send'
        '400':
          description: Invalid request
        '401':
          description: Unauthorized
        '422':
          description: Recipient suppressed
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      x-brrtrouter-impl: true
  /suppressions:
    get:
      operationId: list_suppressions
      summary: Suppressed addresses
      tags:
      - suppressions
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - $ref: '#/components/parameters/Search'
      - name: reason
        in: query
        schema:
          $ref: '#/components/schemas/SuppressionReason'
      responses:
        '200':
          description: Suppressions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSuppression'
        '401':
          description: Unauthorized
      security:
      - bearerAuth: []
    post:
