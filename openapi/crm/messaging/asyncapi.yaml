# Generated with the OpenAPI document from the CRM event catalogue (openapi/crm/docs/10-events.md).
asyncapi: 3.0.0
info:
  title: CRM Messaging events
  version: 1.0.0
  description: 'Events crm/messaging publishes on Pub/Sub topic `crm.messaging.v1` and the events it consumes from other CRM
    services. Every message is an envelope (event id, type, workspace, time, actor) around `data`. Delivery is at least once:
    consumers are idempotent on `event_id`. Catalogue: openapi/crm/docs/10-events.md; decisions: ADR 003, ADR 004.'
defaultContentType: application/json
servers:
  pubsub:
    host: pubsub.googleapis.com
    protocol: googlepubsub
    description: Google Cloud Pub/Sub in the CRM plane project (topics and subscriptions are created by gcp-infrastructure
      through Crossplane).
channels:
  published:
    address: crm.messaging.v1
    title: crm.messaging.v1
    description: Everything crm/messaging publishes.
