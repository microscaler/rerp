        page:
          type: integer
          format: int32
        limit:
          type: integer
          format: int32
      required:
      - items
      - total
      - page
      - limit
    Condition:
      type: object
      required:
      - subject
      - operator
      properties:
        subject:
          type: string
          description: 'What is tested: field:<name>, custom:<key>, tag, list:<id>, score, engagement:opened:<days>,

            engagement:clicked:<days>, engagement:any:<days>, deal:stage, deal:value, site:visited:<path>,

            event:<name>, form:<id>, created_at, last_activity_at, timezone, country

            '
        operator:
          type: string
          enum:
          - EQ
          - NEQ
          - CONTAINS
          - NOT_CONTAINS
          - STARTS_WITH
          - GT
          - GTE
          - LT
          - LTE
          - IN
          - NOT_IN
          - IS_SET
          - IS_NOT_SET
          - HAS
          - HAS_NOT
          - BEFORE
          - AFTER
          - WITHIN_DAYS
          - NOT_WITHIN_DAYS
        value:
          description: String, number, boolean, ISO date or array as the operator requires
          oneOf:
          - type: string
          - type: number
          - type: boolean
          - type: array
            items:
              type: string
      description: Defined by crm/audience; this is an identical copy.
    ConditionGroup:
      type: object
      required:
      - op
      - items
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        items:
          type: array
          items:
            oneOf:
            - $ref: '#/components/schemas/Condition'
            - $ref: '#/components/schemas/ConditionSubgroup'
      description: 'AND/OR tree shared by segments, automation IF_ELSE/GOAL steps and campaign audiences: a group holds conditions
        and sub-groups, a sub-group holds conditions (two levels). Defined by crm/audience; this is an identical copy.'
    ConditionSubgroup:
      type: object
      properties:
        op:
          type: string
          enum:
          - AND
          - OR
        items:
          type: array
          items:
            $ref: '#/components/schemas/Condition'
      required:
      - op
      - items
      description: A nested AND/OR group of conditions inside a ConditionGroup. Defined by crm/audience; this is an identical
        copy.
  parameters:
    Page:
      name: page
      in: query
      description: Page number (1-indexed)
      schema:
        type: integer
        format: int32
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      description: Items per page
      schema:
        type: integer
        format: int32
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      description: Free-text search
      schema:
        type: string
    Id:
      name: id
      in: path
      required: true
      description: Resource id
      schema:
        type: string
        format: uuid
    WorkspaceId:
      name: X-Workspace-Id
      in: header
      required: true
      description: 'The workspace (brand) the call acts in. Checked against the caller''s memberships: a foreign workspace
        is 403, a record in another workspace is 404 (ADR 004).'
      schema:
        type: string
        format: uuid
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Makes a retried request return the first response without repeating the side effect (kept 24 hours).
      schema:
        type: string
        maxLength: 128
  responses:
    BadRequest:
      description: Malformed request
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unauthorized:
      description: Missing or invalid credentials
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Forbidden:
      description: 'Not allowed: the role, or a workspace the caller is not a member of'
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    NotFound:
      description: Not found (or in another workspace)
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Conflict:
      description: Conflicts with the current state
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    Unprocessable:
      description: Validation failed; see fields
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
    TooManyRequests:
      description: Rate limited
      headers:
        X-Request-Id:
          $ref: '#/components/headers/RequestId'
        Retry-After:
          $ref: '#/components/headers/RetryAfter'
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ErrorResponse'
  headers:
    RequestId:
      description: Correlates the request across the gateway, the service and its logs and traces.
      schema:
        type: string
    RetryAfter:
      description: Seconds to wait before retrying.
      schema:
        type: integer
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
