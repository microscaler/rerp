components:
  schemas:
    ABTestConfig:
      type: object
      required:
      - sample_percent
      - winner_metric
      - decide_after_minutes
      properties:
        test_scope:
          type: string
          enum:
          - SUBJECT_FROM
          - SUBJECT_FROM_CONTENT
          default: SUBJECT_FROM
          description: What differs between variants - subject and/or from only, or the whole message too
        sample_percent:
          type: integer
          format: int32
          minimum: 10
          maximum: 100
          description: Share of the audience split across variants (by `ratios`, evenly when absent); the rest get the winner
        ratios:
          type: array
          items:
            type: integer
            format: int32
          description: Per-variant share of the sample, in variant order; sums to 100
        decide_winner:
          type: boolean
          default: true
          description: false sends the variants by ratio to everyone and never picks a winner
        winner_metric:
          type: string
          enum:
          - OPENS
          - CLICKS
        decide_after_minutes:
          type: integer
          format: int32
          minimum: 60
        winner_key:
          type: string
          readOnly: true
    AccountEngagementSeries:
      type: object
      required:
      - account_id
      - points
      properties:
        account_id:
          type: string
          format: uuid
        points:
          type: array
          items:
            type: object
            required:
            - date
            properties:
              date:
                type: string
                format: date
              posts:
                type: integer
                format: int32
              impressions:
                type: integer
                format: int64
              engagements:
                type: integer
                format: int64
              followers:
                type: integer
                format: int64
    Asset:
      type: object
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        url:
          type: string
          format: uri
        content_type:
          type: string
        size_bytes:
          type: integer
          format: int64
        width:
          type: integer
          format: int32
        height:
          type: integer
          format: int32
        created_at:
          type: string
          format: date-time
      required:
      - id
      - name
      - url
    AssetPage:
      type: object
      required:
      - items
