openapi: 3.1.0
# Handler coroutine stack (BRRTRouter src/handler_stack.rs): the default for every operation; an operation's own
# x-brrtrouter-stack-size overrides it. Measured handlers peak at 24-48 KiB (pp, 24 Oct 2026).
x-brrtrouter-stack-size: 128KiB
info:
  title: CRM Messaging
  version: v1.0.0
  description: 'What we send: versioned templates, snippets, assets and the merge-field catalogue; campaigns (one-time, A/B,
    RSS, recurring, reminder; email and SMS) with their per-recipient send ledger and engagement; senders and sending domains,
    SMS senders, tracking domains, postal addresses, list exclusions, providers; connected 1:1 mailboxes; social accounts
    and posts; campaign and deliverability reports.'
  x-api-docs:
    service: messaging
    openapi_version: 3.1.0
    brrtrouter_version: latest
  license:
    name: MIT
    url: https://opensource.org/licenses/MIT
servers:
- url: http://localhost:10352/api/v1/crm/messaging
  description: Local development (port from port-registry)
- url: /api/v1/crm/messaging
  description: CRM Messaging API
tags:
- name: assets
  description: Assets
- name: campaigns
  description: One-time and A/B campaigns, their schedule and send
- name: events
  description: Engagement events (delivered, opened, clicked, bounced, complained, unsubscribed)
- name: list-exclusions
  description: List exclusions
- name: mailboxes
  description: 'Connected email accounts (OAuth Google/Microsoft or IMAP/SMTP): two-way sync of 1:1 mail onto contacts and
    deals, 1:1 sends with tracking'
- name: outreach-reports
  description: Campaign and list performance
- name: postal-addresses
  description: Postal addresses
- name: providers
  description: Providers
- name: reports
  description: Reports
- name: senders
  description: Sender identities and sending domains (DKIM / DMARC state)
- name: sends
  description: Per-recipient delivery log
- name: sms
  description: Sms
- name: snippets
  description: Snippets
- name: social
  description: Social
- name: social-accounts
  description: Connected platform accounts
- name: social-calendar
  description: Calendar view of scheduled and published posts
- name: social-engagement
  description: Engagement metrics per post and per account
- name: social-leads
  description: Capturing leads from social interactions
- name: social-posts
  description: Posts, scheduling and approval
- name: templates
  description: Message templates (email, SMS, WhatsApp) with merge fields
- name: tracking-domains
  description: Tracking domains
- name: transactional
  description: Application-triggered single sends sharing the suppression list
