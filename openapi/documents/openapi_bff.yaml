          description: Intake channels this rule applies to
        target_module:
          type: string
          description: Target RERP module name (e.g. accounts-payable, crm)
        target_endpoint:
          type: string
          description: API endpoint to create/update record (e.g. /api/v1/accounts-payable/invoices)
        schema_id:
          type: string
          format: uuid
          nullable: true
          description: Extraction schema to use
        auto_approve:
          type: boolean
          default: false
        auto_approve_threshold:
          type: number
          format: decimal
          default: 0.85
          description: Confidence threshold for auto-approve
        notify:
          type: array
          items:
            type: string
          description: User roles or user IDs to notify
        fallback_route:
          type: string
          nullable: true
          description: What to do if confidence < threshold (e.g. manual_review)
        retry_count:
          type: integer
          default: 3
        retry_delay:
          type: integer
          default: 60
          description: Seconds between retries
        created_at:
          type: string
          format: date-time
    RoutesRouteDef:
      type: object
      required:
      - org_id
      - name
      - document_type
      - target_module
      - target_endpoint
      properties:
        id:
          type: string
          format: uuid
          nullable: true
          description: Omitted to create new; include to update
        org_id:
          type: string
          format: uuid
        name:
          type: string
        document_type:
          type: string
        source:
          type: array
          items:
            type: string
            enum:
            - email
            - camera
            - webhook
            - upload
          default: []
        target_module:
          type: string
        target_endpoint:
          type: string
        schema_id:
          type: string
          format: uuid
          nullable: true
        auto_approve:
          type: boolean
          default: false
        auto_approve_threshold:
          type: number
          format: decimal
          default: 0.85
        notify:
          type: array
          items:
            type: string
          default: []
        fallback_route:
          type: string
          nullable: true
        retry_count:
          type: integer
          default: 3
        retry_delay:
          type: integer
          default: 60
    RoutesRoutesListResponse:
      type: object
      required:
      - items
      - total
      - page
      - limit
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/RoutesRoute'
        total:
          type: integer
        page:
          type: integer
        limit:
          type: integer
    RoutesTestResult:
      type: object
      required:
      - matched
      - rule
      properties:
        matched:
          type: boolean
        rule:
          nullable: true
          $ref: '#/components/schemas/RoutesRoute'
        confidence:
          type: number
          format: decimal
          nullable: true
        auto_approved:
          type: boolean
    RoutesTestRouteRequest:
      type: object
      required:
      - org_id
      properties:
        org_id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
          description: Existing document to test against
        raw_text:
          type: string
          description: Raw text to test routing with (if no document_id)
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: Sesame-issued bearer token validated by BRRTRouter
