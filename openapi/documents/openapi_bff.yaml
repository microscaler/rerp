openapi: 3.1.0
info:
  title: RERP Documents Backend for Frontend API
  description: Aggregated API for canonical document storage, ingestion, intelligence, workflows, and generated document renditions.
    All services derive tenant scope from validated Sesame identity. Service containers listen on 8080.
  version: 0.1.0
  contact:
    name: RERP Documents API Support
    email: documents-api@rerp.ai
servers:
- url: https://api.rerp.ai
  description: Production server
- url: http://localhost:8080
  description: Local suite BFF
tags:
- name: analyze
- name: auto-approve-rules
- name: classifiers
- name: classify
- name: confirmations
- name: copies
- name: documents
- name: email-aliases
- name: extraction
- name: folders
- name: intake
- name: mobile
- name: pipeline
- name: renditions
- name: routes
- name: schemas
- name: storage
- name: templates
- name: versions
paths:
  /analysis/{id}:
    get:
      operationId: get_analysis_job
      summary: Get analysis job status or result
      description: Poll an analysis job by ID. Returns the job status or the final AnalysisResult if processing is complete.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Analysis job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAnalysisJob'
        '404':
          description: Job not found
      tags:
      - analyze
      x-service: analyze
      x-service-base-path: /api/documents/analyze
      x-brrtrouter-downstream-path: /api/documents/analyze/analysis/{id}
      x-brrtrouter-impl: false
  /batch:
    post:
      operationId: batch_upload
      summary: Batch upload multiple documents
      description: Upload multiple documents in a single request. Each document is processed independently. Failing documents
        do not block successful ones.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                files:
                  type: array
                  items:
                    type: string
                    format: binary
                  description: Array of document files
                org_id:
                  type: string
                  format: uuid
                  description: Organization ID (RLS-scoped)
                folder_id:
                  type: string
                  format: uuid
                  nullable: true
                  description: Target folder ID for all documents
                metadata:
                  type: object
                  nullable: true
                  description: Shared metadata applied to all documents
                  additionalProperties: true
                per_file_metadata:
                  type: array
                  items:
                    type: object
                    additionalProperties: true
                  nullable: true
                  description: Per-file metadata overrides (must match order of files array)
      responses:
        '201':
          description: Batch upload accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeBatchResult'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeError'
        '401':
          description: Authentication required
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntakeError'
      x-service: intake
      x-service-base-path: /api/documents/intake
      x-brrtrouter-downstream-path: /api/documents/intake/batch
      x-brrtrouter-impl: false
  /classifications/{id}:
    get:
      operationId: get_classification_result
      summary: Get classification job status or result
      description: Poll a classification job by ID. Returns the job status or the final Classification if processing is complete.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Classification job result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyClassificationJob'
        '404':
          description: Job not found
      tags:
      - classify
      x-service: classify
      x-service-base-path: /api/documents/classify
      x-brrtrouter-downstream-path: /api/documents/classify/classifications/{id}
      x-brrtrouter-impl: false
  /classifiers:
    get:
      operationId: list_classifiers
      summary: List custom classifiers
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of classifiers
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyClassifiersListResponse'
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyError'
      tags:
      - classifiers
      x-service: classify
      x-service-base-path: /api/documents/classify
      x-brrtrouter-downstream-path: /api/documents/classify/classifiers
      x-brrtrouter-impl: false
    post:
      operationId: create_classifier
      summary: Create a custom classifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyClassifierDef'
      responses:
        '201':
          description: Classifier created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyClassifier'
        '400':
          description: Invalid request
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyError'
      tags:
      - classifiers
      x-service: classify
      x-service-base-path: /api/documents/classify
      x-brrtrouter-downstream-path: /api/documents/classify/classifiers
      x-brrtrouter-impl: false
  /confirmations/batch-approve:
    post:
      operationId: batch_approve_confirmations
      summary: Approve multiple confirmations at once
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationBatchApproveRequest'
      responses:
        '202':
          description: Batch approval submitted asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationBatchResult'
        '400':
          description: Invalid request
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/confirmations/batch-approve
      x-brrtrouter-impl: false
  /confirmations/pending:
    get:
      operationId: list_pending_confirmations
      summary: List pending confirmations
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: List of pending confirmations
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationConfirmationsListResponse'
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/confirmations/pending
      x-brrtrouter-impl: false
  /confirmations/{id}:
    get:
      operationId: get_confirmation
      summary: Get confirmation details
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Confirmation details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationConfirmation'
        '404':
          description: Not found
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/confirmations/{id}
      x-brrtrouter-impl: false
  /confirmations/{id}/approve:
    post:
      operationId: approve_confirmation
      summary: Approve extraction (triggers target module API asynchronously)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '202':
          description: Confirmation approved; target module API called asynchronously
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationConfirmationApproved'
        '404':
          description: Not found
        '400':
          description: Cannot approve (e.g., already approved)
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/confirmations/{id}/approve
      x-brrtrouter-impl: false
  /confirmations/{id}/correct:
    post:
      operationId: correct_confirmation
      summary: Correct extracted data (updates schema/ML model)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationCorrectRequest'
      responses:
        '200':
          description: Correction recorded
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationConfirmation'
        '404':
          description: Not found
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/confirmations/{id}/correct
      x-brrtrouter-impl: false
  /confirmations/{id}/reject:
    post:
      operationId: reject_confirmation
      summary: Reject extraction (returns to manual review)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationRejectRequest'
      responses:
        '200':
          description: Confirmation rejected
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationConfirmation'
        '404':
          description: Not found
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/confirmations/{id}/reject
      x-brrtrouter-impl: false
  /documents:
    get:
      operationId: list_documents
      summary: List documents (paginated)
      parameters:
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Full-text search across document metadata
      - name: folder_id
        in: query
        required: false
        schema:
          type: string
          format: uuid
          nullable: true
        description: Filter by folder
      - name: document_type
        in: query
        required: false
        schema:
          type: string
          nullable: true
        description: Filter by document type
      responses:
        '200':
          description: List of documents
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorePaginatedDocuments'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - documents
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents
      x-brrtrouter-impl: false
    post:
      operationId: create_document
      summary: Upload a new document
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
                org_id:
                  type: string
                  format: uuid
                title:
                  type: string
                document_type:
                  type: string
                  nullable: true
                folder_id:
                  type: string
                  format: uuid
                  nullable: true
                tags:
                  type: array
                  items:
                    type: string
                metadata:
                  type: object
                  additionalProperties: true
      responses:
        '201':
          description: Document created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreDocument'
        '400':
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
        '413':
          description: File too large
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - documents
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents
      x-brrtrouter-impl: false
  /documents/analyze-bulk:
    post:
      operationId: analyze_documents_bulk
      summary: Ask a question about multiple documents
      description: Asynchronously ask a question that may reference multiple documents. The LLM processes all documents and
        generates a synthesized answer. Maximum 20 documents per request. Returns an AnalysisJob for polling.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeAnalyzeBulkRequest'
      responses:
        '200':
          description: Cached analysis result returned immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAnalysisResult'
        '202':
          description: Analysis job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAnalysisJob'
        '400':
          description: Invalid request (e.g. too many documents, query too long)
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeError'
      tags:
      - analyze
      x-service: analyze
      x-service-base-path: /api/documents/analyze
      x-brrtrouter-downstream-path: /api/documents/analyze/documents/analyze-bulk
      x-brrtrouter-impl: false
  /documents/search:
    get:
      operationId: search_documents
      summary: Full-text search across all documents
      parameters:
      - name: q
        in: query
        required: true
        schema:
          type: string
        description: Search query
      - $ref: '#/components/parameters/Page'
      - $ref: '#/components/parameters/Limit'
      responses:
        '200':
          description: Search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CorePaginatedDocuments'
        '400':
          description: Invalid query
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - documents
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents/search
      x-brrtrouter-impl: false
  /documents/{id}:
    get:
      operationId: get_document
      summary: Get document metadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document details
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreDocument'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - documents
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents/{id}
      x-brrtrouter-impl: false
    put:
      operationId: update_document
      summary: Update document metadata
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CoreUpdateDocumentRequest'
      responses:
        '200':
          description: Document updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreDocument'
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - documents
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents/{id}
      x-brrtrouter-impl: false
    delete:
      operationId: delete_document
      summary: Delete document
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '204':
          description: Document deleted
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - documents
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents/{id}
      x-brrtrouter-impl: false
  /documents/{id}/analysis:
    get:
      operationId: get_analysis
      summary: Get cached analysis results for a document
      description: Returns the most recent analysis result for a document. This is a cached lookup, not a new analysis.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Analysis results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAnalysisResult'
        '404':
          description: No analysis found
      tags:
      - analyze
      x-service: analyze
      x-service-base-path: /api/documents/analyze
      x-brrtrouter-downstream-path: /api/documents/analyze/documents/{id}/analysis
      x-brrtrouter-impl: false
  /documents/{id}/analyze:
    post:
      operationId: analyze_document
      summary: Ask a question about a document
      description: Asynchronously ask a question about a document. The LLM generates an answer based on document context.
        Returns an AnalysisJob for polling. If a cached analysis result exists for this query, it may be returned immediately
        with 200.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AnalyzeAnalyzeRequest'
      responses:
        '200':
          description: Cached analysis result returned immediately
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAnalysisResult'
        '202':
          description: Analysis job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeAnalysisJob'
        '404':
          description: Document not found
        '400':
          description: Invalid request (e.g. query too long)
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AnalyzeError'
      tags:
      - analyze
      x-service: analyze
      x-service-base-path: /api/documents/analyze
      x-brrtrouter-downstream-path: /api/documents/analyze/documents/{id}/analyze
      x-brrtrouter-impl: false
  /documents/{id}/classification:
    get:
      operationId: get_classification
      summary: Get existing classification result for a document
      description: Returns the most recent classification result for a document. If no classification exists, returns 404.
        This is a cached lookup, not a re-classification.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Classification result
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyClassification'
        '404':
          description: No classification found
      tags:
      - classify
      x-service: classify
      x-service-base-path: /api/documents/classify
      x-brrtrouter-downstream-path: /api/documents/classify/documents/{id}/classification
      x-brrtrouter-impl: false
  /documents/{id}/classify:
    post:
      operationId: classify_document
      summary: Submit document for classification
      description: Asynchronously classify a document. Returns a ClassificationJob that can be polled via GET /classifications/{job_id}.
        If a classification already exists for this document, returns it immediately with 200.
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ClassifyClassifyRequest'
      responses:
        '200':
          description: Classification result returned (cached, existing result found)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyClassification'
        '202':
          description: Classification job accepted
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyClassificationJob'
        '404':
          description: Document not found
        '400':
          description: Invalid request
        '429':
          description: Rate limit exceeded
          headers:
            Retry-After:
              schema:
                type: integer
              description: Seconds to wait before retrying
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ClassifyError'
      tags:
      - classify
      x-service: classify
      x-service-base-path: /api/documents/classify
      x-brrtrouter-downstream-path: /api/documents/classify/documents/{id}/classify
      x-brrtrouter-impl: false
  /documents/{id}/download:
    get:
      operationId: download_document
      summary: Download the raw document file
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Document file
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Document not found
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CoreError'
      tags:
      - storage
      x-service: core
      x-service-base-path: /api/documents/core
      x-brrtrouter-downstream-path: /api/documents/core/documents/{id}/download
      x-brrtrouter-impl: false
  /documents/{id}/extract/{schema_id}:
    get:
      operationId: get_extraction_result
      summary: Get extraction results for a document and schema
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Extraction results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractExtractionResult'
        '404':
          description: Not found
      tags:
      - extraction
      x-service: extract
      x-service-base-path: /api/documents/extract
      x-brrtrouter-downstream-path: /api/documents/extract/documents/{id}/extract/{schema_id}
      x-brrtrouter-impl: false
  /documents/{id}/extract/{schema_id}/highlights:
    get:
      operationId: get_extraction_highlights
      summary: Get bounding box coordinates for extracted fields
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      - name: schema_id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      responses:
        '200':
          description: Bounding box coordinates
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ExtractHighlights'
        '404':
          description: Not found
      tags:
      - extraction
      x-service: extract
      x-service-base-path: /api/documents/extract
      x-brrtrouter-downstream-path: /api/documents/extract/documents/{id}/extract/{schema_id}/highlights
      x-brrtrouter-impl: false
  /documents/{id}/merge:
    post:
      operationId: merge_documents
      summary: Merge multiple documents into one (async)
      parameters:
      - name: id
        in: path
        required: true
        schema:
          type: string
          format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ConfirmationMergeRequest'
      responses:
        '202':
          description: Document merge scheduled
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ConfirmationMergedDocument'
        '404':
          description: Document not found
      tags:
      - confirmations
      x-service: confirmation
      x-service-base-path: /api/documents/confirmation
      x-brrtrouter-downstream-path: /api/documents/confirmation/documents/{id}/merge
