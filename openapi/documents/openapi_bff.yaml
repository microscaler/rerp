components:
  parameters:
    Page:
      name: page
      in: query
      schema:
        type: integer
        minimum: 1
        default: 1
    Limit:
      name: limit
      in: query
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Search:
      name: search
      in: query
      schema:
        type: string
    TemplateId:
      name: template_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    VersionId:
      name: version_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
    RenditionId:
      name: rendition_id
      in: path
      required: true
      schema:
        type: string
        format: uuid
  schemas:
    AnalyzeAnalysisJob:
      type: object
      required:
      - id
      - query
      - status
      - created_at
      properties:
        id:
          type: string
          format: uuid
          description: Job ID for polling via GET /analysis/{id}
        document_id:
          type: string
          format: uuid
          nullable: true
          description: Null if bulk analysis
        query:
          type: string
        status:
          type: string
          enum:
          - queued
          - processing
          - complete
          - failed
        result:
          nullable: true
          $ref: '#/components/schemas/AnalyzeAnalysisResult'
          description: Final analysis result (available when status is complete)
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
          nullable: true
    AnalyzeAnalysisResult:
      type: object
      required:
      - id
      - query
      - answer
      - created_at
      properties:
        id:
          type: string
          format: uuid
        document_id:
          type: string
          format: uuid
          nullable: true
          description: Null if bulk analysis
        query:
          type: string
        answer:
          type: string
          description: LLM-generated answer
        sources:
          type: array
          items:
            type: object
            properties:
              page:
                type: integer
              text:
                type: string
              confidence:
                type: number
                format: decimal
          description: Source passages from the document
        tokens_used:
          type: object
          properties:
            prompt_tokens:
              type: integer
            completion_tokens:
              type: integer
            total_tokens:
              type: integer
        model:
          type: string
        created_at:
          type: string
          format: date-time
    AnalyzeAnalyzeBulkRequest:
      type: object
      required:
      - org_id
      - query
      - document_ids
      properties:
        org_id:
          type: string
          format: uuid
          description: Organization ID for RLS
        query:
          type: string
          maxLength: 2000
          description: Free-text question about multiple documents
        document_ids:
          type: array
          items:
            type: string
            format: uuid
          minItems: 1
          maxItems: 20
          description: Document UUIDs to analyze (max 20)
        model:
          type: string
          nullable: true
          description: Optional model override
    AnalyzeAnalyzeRequest:
      type: object
      required:
      - org_id
      - query
      properties:
        org_id:
          type: string
          format: uuid
          description: Organization ID for RLS
        query:
          type: string
