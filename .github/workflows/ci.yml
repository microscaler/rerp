name: RERP CI

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main, develop]
  workflow_dispatch:
    inputs:
      run_release_jobs:
        description: "Run container build and push jobs (release build). Set when dispatching to (re-)run release, or when invoked by release.yaml."
        required: false
        default: false
        type: boolean

concurrency:
  # Each ref gets its own group (tags, branches, PRs are isolated)
  group: ${{ github.workflow }}-${{ github.ref }}
  # CRITICAL: Only cancel PRs, NEVER cancel pushes (branches) or tags (releases)
  # Tags are never PRs, so they're automatically protected
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read
  pull-requests: read

env:
  RUST_BACKTRACE: "1"
  RUST_LOG: "info"
  PYTHON_VERSION: '3.12'

jobs:
  vars:
    name: Set CI vars
    runs-on: ubuntu-latest
    outputs:
      run_release_jobs: ${{ steps.set_vars.outputs.is_release_tag == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_release_jobs == 'true') }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"
      - run: pip install -e ./tooling
      - run: pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"
      - id: set_vars
        run: echo "is_release_tag=$(rerp ci is-tag)" >> $GITHUB_OUTPUT
      - name: Validate version (prevent downgrade)
        if: steps.set_vars.outputs.is_release_tag == 'true' || (github.event_name == 'workflow_dispatch' && github.event.inputs.run_release_jobs == 'true')
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          # When running on a tag, extract version from the tag ref
          # Otherwise, read from microservices/Cargo.toml
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            # Extract version from tag (e.g., refs/tags/v0.1.3 -> 0.1.3)
            CURRENT=$(echo "${{ github.ref }}" | sed -E 's|refs/tags/v?||')
            echo "Running on tag: ${{ github.ref }}, version: $CURRENT"
          else
            # Read current version from microservices/Cargo.toml
            CURRENT=$(grep -A 5 '\[workspace.package\]' microservices/Cargo.toml | grep -E '^\s*version\s*=' | head -1 | sed -E 's/.*version\s*=\s*"v?([^"]+)".*/\1/' || echo "")
            if [ -z "$CURRENT" ]; then
              echo "Warning: Could not read version from microservices/Cargo.toml, skipping validation"
              exit 0
            fi
          fi
          
          # Get all tags and find the previous one (excluding current tag if we're on a tag)
          # Use git to get tags sorted by version, excluding the current tag
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            CURRENT_TAG=$(echo "${{ github.ref }}" | sed -E 's|refs/tags/||')
            # Get all tags, sort by version, exclude current tag, get the latest
            LATEST=$(git tag -l 'v*' | grep -v "^${CURRENT_TAG}$" | sort -V | tail -1 | sed 's/^v//' || echo "")
          else
            # Not on a tag, get latest from GitHub API
            if LATEST=$(rerp ci get-latest-tag); then
              LATEST="$LATEST"
            else
              echo "Error: Failed to get latest tag from GitHub API after retries. Cannot validate version safely."
              echo "This prevents accidental version downgrades. Please retry the workflow."
              exit 1
            fi
          fi
          
          if [ -n "$LATEST" ]; then
            echo "Validating version: current=$CURRENT, latest=$LATEST"
            rerp ci validate-version --current "$CURRENT" --latest "$LATEST" || exit 1
            echo "Version validation passed"
          else
            echo "No previous releases found, allowing first release"
          fi

  conventional-commits:
    name: Conventional Commits
    runs-on: ubuntu-latest
    if: "!startsWith(github.ref, 'refs/tags/')"
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Lint commit messages
        uses: wagoid/commitlint-github-action@v6

  tooling:
    name: Build, Test and Coverage (Tooling)
    needs: [conventional-commits]
    # On tag push: conventional-commits is skipped; run so container pipeline (download/build-push/verify) can run.
    if: startsWith(github.ref, 'refs/tags/') || needs.conventional-commits.result == 'success' || needs.conventional-commits.result == 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling[dev]

      - name: Install brrtrouter_tooling (required for rerp CLI and tests)
        run: |
          tooling/.venv/bin/pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"

      - name: Validate documentation authority and ADR lifecycle
        run: tooling/.venv/bin/python tooling/scripts/check_doc_governance.py

      - name: Run tooling tests with coverage
        run: cd tooling && .venv/bin/pytest tests/ -v --cov=rerp_tooling --cov-report=term-missing --cov-fail-under=65

  validate-openapi:
    name: Validate OpenAPI Specs
    needs: [tooling]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling
          tooling/.venv/bin/pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"

      - name: Validate OpenAPI specs
        run: |
          echo "🔍 Validating OpenAPI specifications..."
          tooling/.venv/bin/rerp openapi validate

      - name: Generate BFF specs (dry run)
        run: |
          echo "🔄 Testing BFF spec generation..."
          tooling/.venv/bin/rerp bff generate-system
          echo "✅ BFF spec generation successful"

  validate-ports:
    name: Validate Port Assignments
    needs: [validate-openapi]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling
          tooling/.venv/bin/pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"

      - name: Validate port assignments
        run: |
          echo "🔍 Validating port registry, helm, kind-config, Tiltfile..."
          tooling/.venv/bin/rerp ports validate


  build-and-test:
    name: Build and Test
    needs: [validate-ports]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
      
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'

      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling
          tooling/.venv/bin/pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"


      - name: Release deps stay on git revisions (sibling paths only through RERP_LOCAL_DEPS)
        run: python3 tooling/src/rerp_tooling/local_deps.py --check

      - name: Cache cargo registry
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            microservices/target
          key: ${{ runner.os }}-cargo-rerp-${{ hashFiles('microservices/**/Cargo.toml', 'microservices/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rerp-
      
      - name: Install musl target and tools
        run: |
          rustup target add x86_64-unknown-linux-musl
          sudo apt-get update
          sudo apt-get install -y musl-tools
      
      - name: Build workspace (amd64)
        run: |
          echo "🔨 Building RERP workspace for amd64..."
          tooling/.venv/bin/rerp build workspace amd64
      
      - name: Build example service (amd64)
        run: |
          echo "🔨 Building example service (accounting/accounts-payable) for amd64..."
          tooling/.venv/bin/rerp build accounting_accounts-payable amd64
      
      - name: Build accounting microservices (amd64) - smoke test
        run: |
          echo "🔨 Building accounting microservices (workspace) for amd64..."
          tooling/.venv/bin/rerp build microservices amd64 --release
      
      - name: Format check
        run: |
          cd microservices
          cargo fmt --check || (echo "❌ Code formatting check failed. Run 'cargo fmt' to fix." && exit 1)
      
      - name: Run tests
        run: |
          cd microservices
          cargo test --workspace --lib
      
      - name: Check documentation
        run: |
          cd microservices
          cargo doc --workspace --no-deps || true

  discover-microservices:
    name: Discover microservices
    needs: [build-and-test]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      gen_packages: ${{ steps.discover.outputs.gen_packages }}
      impl_packages: ${{ steps.discover.outputs.impl_packages }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Discover gen and impl packages from workspace
        id: discover
        run: |
          cd microservices
          GEN=()
          IMPL=()
          for member in $(grep -E '^\s*"accounting/' Cargo.toml | sed 's/.*"\([^"]*\)".*/\1/'); do
            base="${member%/gen}"
            base="${base%/impl}"
            snake=$(echo "$base" | sed 's|/|_|g' | sed 's/-/_/g')
            pkg="rerp_${snake}"
            case "$member" in
              */gen)  GEN+=("${pkg}_gen") ;;
              */impl) IMPL+=("$pkg") ;;
            esac
          done
          echo "gen_packages=[$(printf '"%s",' "${GEN[@]}" | sed 's/,$//')]" >> "$GITHUB_OUTPUT"
          echo "impl_packages=[$(printf '"%s",' "${IMPL[@]}" | sed 's/,$//')]" >> "$GITHUB_OUTPUT"

  clippy-gen:
    name: Clippy (gen) ${{ matrix.package }}
    needs: [discover-microservices]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-microservices.outputs.gen_packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling
          tooling/.venv/bin/pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            microservices/target
          key: ${{ runner.os }}-cargo-rerp-${{ hashFiles('microservices/**/Cargo.toml', 'microservices/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rerp-
      - name: Clippy (strict)
        run: cd microservices && cargo clippy -p ${{ matrix.package }} -- -D warnings

  clippy-impl:
    name: Clippy (impl) ${{ matrix.package }}
    needs: [discover-microservices]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJson(needs.discover-microservices.outputs.impl_packages) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v6
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling
          tooling/.venv/bin/pip install "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@main#subdirectory=tooling"
      - name: Cache cargo
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            microservices/target
          key: ${{ runner.os }}-cargo-rerp-${{ hashFiles('microservices/**/Cargo.toml', 'microservices/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-rerp-
      - name: Clippy (report only)
        run: cd microservices && cargo clippy -p ${{ matrix.package }} --

  # Images: .github/workflows/images.yml (the octopilot pipeline builds skaffold.yaml and publishes to ghcr.io).
