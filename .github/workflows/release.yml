# Release workflow: bump Cargo.toml, generate notes (OpenAI or Anthropic), commit, tag, push, create GitHub Release.
# The workflow token pushes the commit and tag; the image build (images.yml) is dispatched on the tag.
# PRD: docs/RELEASE_MANAGEMENT_PRD.md
#
# Optional secrets: OPENAI_API_KEY (provider=openai) or ANTHROPIC_API_KEY (provider=anthropic) for the release notes;
# without one the release takes GitHub's generated notes.

name: Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: 'Bump: patch|minor|major; rc=bump -rc.N; release=promote RC to full (e.g. 0.39.0-rc.2 -> 0.39.0)'
        required: false
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - rc
          - release
      branch:
        description: 'Branch to release from'
        required: false
        default: main
        type: string
      provider:
        description: 'AI provider for release notes (openai or anthropic)'
        required: false
        default: anthropic
        type: choice
        options:
          - openai
          - anthropic

permissions:
  contents: write
  actions: write     # dispatch the image build on the new tag

jobs:
  release:
    name: Bump, tag and push
    runs-on: ubuntu-latest
    env:
      BUMP: ${{ github.event.inputs.bump || 'patch' }}
      BRANCH: ${{ github.event.inputs.branch || 'main' }}
      NOTES_PROVIDER: ${{ github.event.inputs.provider || 'anthropic' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          ref: ${{ env.BRANCH }}
          token: ${{ github.token }}
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Set up tooling .venv
        run: |
          python3 -m venv tooling/.venv
          tooling/.venv/bin/pip install --upgrade pip
          tooling/.venv/bin/pip install -e ./tooling

      - name: Bump version and update Cargo.toml
        id: bump
        run: tooling/.venv/bin/rerp release bump ${{ env.BUMP }}

      - name: Check for changes
        run: |
          if git diff --quiet; then
            echo "No version change (already at this version?)"
            exit 1
          fi

      - name: Generate release notes (OpenAI or Anthropic per provider)
        id: notes
        # Without the provider's API key the release takes GitHub's generated notes instead.
        continue-on-error: true
        # Script exits 1 on missing API key, API error, or empty body → GHA fails the job.
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: tooling/.venv/bin/rerp release generate-notes --version ${{ steps.bump.outputs.version }} --output release-body.md --template .github/release-notes-template.md --provider ${{ env.NOTES_PROVIDER }}

      - name: Commit, tag and push
        uses: EndBug/add-and-commit@v11
        with:
          add: "-u"
          message: "chore(release): v${{ steps.bump.outputs.version }}"
          tag: "v${{ steps.bump.outputs.version }}"
          author_name: "github-actions[bot]"
          author_email: "github-actions[bot]@users.noreply.github.com"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.bump.outputs.version }}"
          body_path: ${{ steps.notes.outcome == 'success' && 'release-body.md' || '' }}
          generate_release_notes: ${{ steps.notes.outcome != 'success' }}

      # A tag pushed with the workflow's own token starts no workflow, so the images are built by dispatching
      # images.yml on the tag: its pipeline sees refs/tags/v* and publishes to ghcr.io.
      - name: Build and publish the release images
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run images.yml --repo "$GITHUB_REPOSITORY" --ref "v${{ steps.bump.outputs.version }}"
