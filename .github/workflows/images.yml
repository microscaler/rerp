name: Release images

# Official images, built by the octopilot pipeline from skaffold.yaml: one buildpack build of the RERP suites
# (one build per suite, side by side, only for the suites a change touches), one image per service (suites/<suite>.txt) holding only its own binary on paketobuildpacks/run-jammy-tiny.
# A v* tag (cut by release.yml) publishes them to ghcr.io/microscaler with the chart and attaches the result to the
# GitHub Release. This repository is public: nothing here names a private registry, cloud project or secret.

on:
  push:
    branches: [main]
    tags: ["v*"]
    paths-ignore:
      - "**/*.md"
      - docs/**
      - llmwiki/**
      - deployment-configuration/**
      - k8s/**
      - "Tiltfile*"
  workflow_dispatch:
    inputs:
      build_all:
        description: Build every suite, not only the ones changed since the previous run or tag
        type: boolean
        default: false

concurrency:
  group: rerp-images-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

jobs:
  build:
    name: Octopilot
    # The reusable workflow's release job needs contents: write (GitHub Release) and packages: write (ghcr.io).
    # actions: write lets the pipeline trim old artifacts (keep_artifacts) before it uploads its own.
    permissions:
      contents: write
      packages: write
      id-token: write
      pull-requests: write
      actions: write
    uses: octopilot/actions/.github/workflows/pipeline.yml@main
    with:
      # v1.2.2: forwards the shared sccache (OP_SCCACHE) to the buildpack.
      op_version: v1.2.2
      # ms02 ARC runners with the shared Rust compile cache. This workflow has no pull_request trigger (main, v* tags,
      # dispatch: maintainers only); pull requests run checks.yml on GitHub-hosted runners, and outside contributors'
      # workflow runs need approval. Uploads (integration images to ttl.sh, releases to ghcr.io) go over ms02's
      # 12 Mbit/s uplink.
      runner: '["self-hosted", "linux", "x64", "microscaler"]'
      sccache: true
      # Image builds and pushes on GitHub-hosted runners: ~1 GB per run over ms02's ~15 Mbit/s uplink starved
      # PriceWhisperer's releases (27 Oct). These builds run without sccache.
      artifacts_runner: ubuntu-24.04
      # Release notes from our own vLLM (Qwen on the Sparks), reachable from the ms02 runners; if it is down
      # the notes fall back to the commit list and the release goes ahead.
      release_notes_provider: openai
      release_notes_base_url: http://10.177.76.236/v1   # the Cylon LLM gateway (ms02); key: secret RELEASE_NOTES_API_KEY
      release_notes_model: Qwen/Qwen3.8-27B-FP8
      integration: false
      release_to_ghcr: true
      # Suite builds are intermediates: only their per-service images (suites/<suite>.txt) are released.
      release_skip: rerp-crm rerp-documents
      # Build only the suites a change touches, side by side (skaffold.yaml has one artifact per suite). A tag
      # compares the previous tag, so a release carries every suite changed since the last one; the others keep
      # their last version (each service's image policy moves on its own). Dispatch with build_all for everything.
      only_changed: true
      build_all: ${{ inputs.build_all == true }}
      # Housekeeping before anything is uploaded or pushed: Actions artifacts down to the newest 3 of each name and
      # none older than 7 days (the organisation's artifact quota is shared), and 5 versions of each image on ghcr.io
      # counting the one being released.
      keep_artifacts: 3
      artifact_max_age_days: 7
      keep_images: 5
    secrets: inherit
