# Dependabot version updates for RERP
# https://docs.github.com/en/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file

version: 2

updates:
  # ---------------------------------------------------------------------------
  # npm (ui/website: package.json + yarn.lock)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "npm"
    directory: "/ui/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "javascript"
    commit-message:
      prefix: "chore(deps)"
    groups:
      npm-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # pip (tooling: pyproject.toml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "pip"
    directory: "/tooling"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "python"
    commit-message:
      prefix: "chore(deps)"
    groups:
      pip-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]

  # ---------------------------------------------------------------------------
  # cargo (workspace: root + components; and entities)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "cargo"
    # The Rust workspace is microservices/ (there is no Cargo.toml at the root).
    directory: "/microservices"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 10
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      # Same group, patterns and Monday 09:00 UTC slot in every Microscaler Rust repo: the crates they all compile
      # move to the same versions in the same week, which is what lets the shared sccache on the ms02 CI runners hit
      # across repos. Majors still arrive one PR each.
      shared-stack:
        patterns: ["tokio*", "serde*", "hyper*", "http-body*", "tower*", "tracing*", "opentelemetry*", "prost*",
                   "tonic*", "rustls*", "ring", "aws-lc*", "cc", "openssl*", "reqwest*", "chrono*", "uuid", "anyhow",
                   "thiserror*", "clap*", "jsonwebtoken", "redis*", "futures*", "bytes", "regex*", "syn", "quote",
                   "proc-macro2", "rand*", "base64", "sha2", "hmac", "ed25519*", "time", "url", "once_cell",
                   "parking_lot*", "dashmap", "smallvec", "itoa", "memchr", "hashbrown", "indexmap", "pyroscope*"]
        update-types: ["minor", "patch"]
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Path deps outside repo: Dependabot cannot update these
      - dependency-name: "brrtrouter"
      - dependency-name: "brrtrouter_macros"

  - package-ecosystem: "cargo"
    directory: "/entities"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "rust"
    commit-message:
      prefix: "chore(deps)"
    groups:
      cargo-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
    ignore:
      # Path deps outside repo
      - dependency-name: "lifeguard*"

  # ---------------------------------------------------------------------------
  # docker (Dockerfiles with FROM; Dependabot requires a file named "Dockerfile")
  # docker/microservices uses Dockerfile.<service> so is not scanned
  # ---------------------------------------------------------------------------
  - package-ecosystem: "docker"
    directory: "/docker/base"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  - package-ecosystem: "docker"
    directory: "/docker/website"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "docker"

  # ---------------------------------------------------------------------------
  # github-actions (.github/workflows and action.yml)
  # ---------------------------------------------------------------------------
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
      day: "monday"
      time: "09:00"
      timezone: "UTC"
    open-pull-requests-limit: 5
    labels:
      - "dependencies"
      - "github-actions"
    commit-message:
      prefix: "chore(deps)"
    groups:
      actions-minor-patch:
        patterns: ["*"]
        update-types: ["minor", "patch"]
