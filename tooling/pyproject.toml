[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rerp-tooling"
version = "0.1.0"
description = "Thin shim: `rerp` CLI is implemented in brrtrouter-tooling (`brrtrouter_tooling.workspace`)"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    # From git, so CI (and anyone without a BRRTRouter checkout) can install it: the same BRRTRouter revision as the
    # release crates (microservices/Cargo.toml). Developing BRRTRouter's tooling alongside: after installing this,
    # `pip install -e ../../BRRTRouter/tooling` in the same venv replaces it with the sibling checkout.
    "brrtrouter-tooling @ git+https://github.com/microscaler/BRRTRouter.git@9bcb2db0020fb9d86ea19954ef113b6d8019ece3#subdirectory=tooling",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.4.0",
    "pre-commit>=3.0",
]

[project.scripts]
rerp = "rerp_tooling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-v --tb=short"

[tool.ruff]
target-version = "py39"
line-length = 100
exclude = [".venv", "__pycache__", "build", "dist", "*.egg-info", ".git"]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]

[tool.ruff.format]
quote-style = "double"
